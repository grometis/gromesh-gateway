# Weekly, grouped updates. Every Dependabot PR follows the usual rule: it only merges with Fabrício's ok.
# open-pull-requests-limit is per entry; the five entries below add up to at most 5 open PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 2
    versioning-strategy: increase
    ignore:
      # Majors are planned work (backlog 21), not weekly updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
        patterns: ["*"]
      npm-production:
        dependency-type: production
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/apps/agent, /tests/load/agents]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/agent, /apps/control-plane, /apps/ui, /images/kong]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    ignore:
      # Majors are planned work (backlog 21), not weekly updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Base-image line changes are planned (backlog 22): only patches and digests of Ubuntu 24.04 and nginx 1.28 stable.
      # node keeps minor/patch: 26.x is one LTS line.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # 1.28.1 and 1.28.2 carry CVE-2026-42945 (CRITICAL): skip them; 1.28.3 and later patches are proposed.
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions: [">=1.28.1, <1.28.3"]
    groups:
      docker:
        patterns: ["*"]
