# Weekly, grouped updates. Every Dependabot PR follows the usual rule: it only merges with Fabrício's ok.
# open-pull-requests-limit is per entry; the five entries below add up to at most 5 open PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      npm-development:
        dependency-type: development
        patterns: ["*"]
      npm-production:
        dependency-type: production
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/apps/agent, /tests/load/agents]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/apps/agent, /apps/control-plane, /apps/ui, /images/kong]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
