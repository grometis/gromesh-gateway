name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gromesh
          POSTGRES_PASSWORD: gromesh
          POSTGRES_DB: gromesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gromesh" --health-interval 5s --health-timeout 3s --health-retries 20
      # Plugin configs are validated by a real Kong (control-plane integration tests).
      kong:
        image: kong:3.9.3
        env:
          KONG_DATABASE: "off"
          KONG_ADMIN_LISTEN: "0.0.0.0:8001"
          KONG_PLUGINS: bundled
        ports: ["127.0.0.1:8011:8001"]
        options: >-
          --health-cmd "kong health" --health-interval 5s --health-timeout 5s --health-retries 20
      # Analytics are read from a real ClickHouse (control-plane integration tests create the table themselves).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.16.34-alpine
        env:
          CLICKHOUSE_DB: gromesh
          CLICKHOUSE_USER: gromesh
          CLICKHOUSE_PASSWORD: gromesh-dev-observability
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["127.0.0.1:8123:8123"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gromesh:gromesh@127.0.0.1:5432/gromesh
      KONG_VALIDATOR_URL: http://127.0.0.1:8011
      # No init scripts in a CI service: the tests create the table and read it with the admin user.
      TEST_CLICKHOUSE_USER: gromesh
      TEST_CLICKHOUSE_PASSWORD: gromesh-dev-observability
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated UI client matches the contract
        run: |
          pnpm --filter @gromesh/ui gen:api
          git diff --exit-code -- apps/ui/src/api/schema.d.ts
      - run: pnpm lint:contracts
      - run: pnpm typecheck
      - run: pnpm test

  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/ui exec playwright install --with-deps chromium
      - name: UI acceptance against Prism
        run: pnpm --filter @gromesh/ui test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-acceptance-failure
          path: apps/ui/test-results/
          retention-days: 7

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          # Standard library only: there is no go.sum to key a module cache on.
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/e2e exec playwright install --with-deps chromium
      - run: docker compose -f deploy/compose/docker-compose.yml build agent
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - name: Kong accepts the compiler output (contract example)
        run: pnpm smoke
      - name: Walking skeleton (API → compiler → Kong → upstream)
        run: pnpm --filter @gromesh/control-plane test:e2e
      - name: Product acceptance (UI → agent → proxy → rollback)
        run: pnpm test:e2e
      - name: Capture compose logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose -f deploy/compose/docker-compose.yml logs --no-color > e2e/test-results/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-e2e-failure
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - name: Stop acceptance stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down

  helm-dp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint and render data-plane chart (defaults and full)
        shell: bash
        run: |
          helm() {
            docker run --rm -v "$PWD:/w:ro" -w /w alpine/helm:3.16.2 "$@"
          }
          # A synthetic token exercises Secret creation without committing credentials.
          helm lint deploy/helm/data-plane --strict --set-string agent.token=ci-placeholder
          helm template dp deploy/helm/data-plane --set-string agent.token=ci-placeholder > /dev/null
          helm lint deploy/helm/data-plane --strict -f deploy/helm/data-plane/ci/values-full.yaml
          helm template dp deploy/helm/data-plane -f deploy/helm/data-plane/ci/values-full.yaml > /dev/null
          if helm template dp deploy/helm/data-plane > /dev/null 2> /tmp/helm-dp-missing-token.log; then
            echo 'Chart unexpectedly accepted missing registration credentials' >&2
            exit 1
          fi
          grep -q 'Set agent.existingSecret' /tmp/helm-dp-missing-token.log
