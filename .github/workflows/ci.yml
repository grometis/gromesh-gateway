name: ci

on:
  push:
    branches: [main]
  pull_request:
  # image-digests dispatches ci on its PR branch: a PR opened with GITHUB_TOKEN gets no pull_request event.
  workflow_dispatch:

# A new push to a PR (or a new dispatch on the bot's branch) cancels the run it replaces; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # What a PR touches decides which jobs run. Pushes to main run everything; the digest bot's branches run only
  # the jobs that use the images it pins (compose e2e and the Helm install in kind, which also renders the charts).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.mode.outputs.all }}
      bot: ${{ steps.mode.outputs.bot }}
      code: ${{ steps.filter.outputs.code || 'false' }}
      ui: ${{ steps.filter.outputs.ui || 'false' }}
      agent: ${{ steps.filter.outputs.agent || 'false' }}
      charts: ${{ steps.filter.outputs.charts || 'false' }}
      heavy: ${{ steps.filter.outputs.heavy || 'false' }}
      kind: ${{ steps.filter.outputs.kind || 'false' }}
    steps:
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          bot=false
          case "$REF" in chore/app-image-digests|chore/kong-image-digest) bot=true ;; esac
          all=false
          # main, or a manual dispatch on any branch that is not the bot's: everything.
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$bot" = false ]; }; then all=true; fi
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
      - name: Changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            code:
              - *workflow
              - apps/**
              - packages/**
              - contracts/**
              - scripts/**
              # The e2e package is typechecked with the rest.
              - e2e/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - .nvmrc
            ui:
              - *workflow
              - apps/ui/**
              - contracts/**
              - package.json
              - pnpm-lock.yaml
              - .nvmrc
            agent:
              - *workflow
              - apps/agent/**
            charts:
              - *workflow
              - deploy/helm/**
            # Helm install in kind: charts, the agent, the kind scenario, the images themselves or any workflow; and what
            # the charts must keep up with in the control plane: the environment it reads at start (all of it in
            # src/config.ts), its migrations (run by the chart's hook) and the agent protocol, both sides.
            kind:
              - .github/workflows/**
              - deploy/helm/**
              - apps/agent/**
              - e2e/kind/**
              - images/**
              - apps/*/Dockerfile
              - apps/control-plane/src/config.ts
              - apps/control-plane/drizzle/**
              - apps/control-plane/src/agent-gateway/**
              - contracts/agent-protocol.openapi.yaml
            heavy:
              - *workflow
              - apps/**
              - packages/**
              - deploy/**
              - e2e/**
              - contracts/**
              - scripts/**
              - pnpm-lock.yaml

  # Code checks and the chart lint/render (formerly helm-dp and helm-cp) in one job: each half runs when its paths change.
  checks:
    needs: changes
    if: needs.changes.outputs.all == 'true' || (needs.changes.outputs.bot != 'true' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.charts == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gromesh
          POSTGRES_PASSWORD: gromesh
          POSTGRES_DB: gromesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gromesh" --health-interval 5s --health-timeout 3s --health-retries 20
      # Analytics are read from a real ClickHouse (control-plane integration tests create the table themselves).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
        env:
          CLICKHOUSE_DB: gromesh
          CLICKHOUSE_USER: gromesh
          CLICKHOUSE_PASSWORD: gromesh-dev-observability
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["127.0.0.1:8123:8123"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gromesh:gromesh@127.0.0.1:5432/gromesh
      KONG_VALIDATOR_URL: http://127.0.0.1:8011
      # No init scripts in a CI service: the tests create the table and read it with the admin user.
      TEST_CLICKHOUSE_USER: gromesh
      TEST_CLICKHOUSE_PASSWORD: gromesh-dev-observability
      RUN_CODE: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.code == 'true' }}
      RUN_CHARTS: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.charts == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint and render the data-plane chart (defaults and full)
        if: env.RUN_CHARTS == 'true'
        shell: bash
        run: |
          helm() {
            docker run --rm -v "$PWD:/w:ro" -w /w alpine/helm:3.16.2 "$@"
          }
          # A synthetic token exercises Secret creation without committing credentials.
          helm lint deploy/helm/data-plane --strict --set-string agent.token=ci-placeholder
          helm template dp deploy/helm/data-plane --set-string agent.token=ci-placeholder > /dev/null
          helm lint deploy/helm/data-plane --strict -f deploy/helm/data-plane/ci/values-full.yaml
          helm template dp deploy/helm/data-plane -f deploy/helm/data-plane/ci/values-full.yaml > /dev/null
          if helm template dp deploy/helm/data-plane > /dev/null 2> /tmp/helm-dp-missing-token.log; then
            echo 'Chart unexpectedly accepted missing registration credentials' >&2
            exit 1
          fi
          grep -q 'Set agent.existingSecret' /tmp/helm-dp-missing-token.log
      - name: Install Helm 3.19.0
        if: env.RUN_CHARTS == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/helm" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/helm"
          curl -fsSLO --retry 3 https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO --retry 3 https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          install linux-amd64/helm "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: "Control-plane chart: strict lint, render, rejection tests and Kubernetes schema validation"
        if: env.RUN_CHARTS == 'true'
        env:
          KUBECONFORM: 'true'
        run: bash deploy/helm/control-plane/ci/check.sh
      - uses: pnpm/action-setup@v6
        if: env.RUN_CODE == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN_CODE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.RUN_CODE == 'true'
      # Plugin configs are validated by a real Kong (control-plane integration tests). A step, not a service: the
      # image is read from the compose default so image-digests never has to edit this workflow.
      - name: Start the Kong validator (compose default image)
        if: env.RUN_CODE == 'true'
        run: |
          read -r kong_ref _ < <(node scripts/kong-image-ref.mjs)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name kong-validator -p 127.0.0.1:8011:8001 \
            -e KONG_DATABASE=off -e KONG_ADMIN_LISTEN=0.0.0.0:8001 -e KONG_PLUGINS=bundled "$kong_ref"
          for _ in $(seq 1 40); do docker exec kong-validator kong health >/dev/null 2>&1 && break; sleep 3; done
          docker exec kong-validator kong health
      - name: Generated UI client matches the contract
        if: env.RUN_CODE == 'true'
        run: |
          pnpm --filter @gromesh/ui gen:api
          git diff --exit-code -- apps/ui/src/api/schema.d.ts
      - run: pnpm lint:contracts
        if: env.RUN_CODE == 'true'
      - run: pnpm typecheck
        if: env.RUN_CODE == 'true'
      - run: pnpm test
        if: env.RUN_CODE == 'true'

  ui-acceptance:
    needs: changes
    if: needs.changes.outputs.all == 'true' || (needs.changes.outputs.bot != 'true' && needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/ui exec playwright install --with-deps chromium
      - name: UI acceptance against Prism
        run: pnpm --filter @gromesh/ui test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-acceptance-failure
          path: apps/ui/test-results/
          retention-days: 7
      # Services and the publish strip at 1440 and 390 (e2e/visual.spec.ts), for design review.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: apps/ui/test-results/screenshots/
          if-no-files-found: error
          retention-days: 30

  agent:
    needs: changes
    if: needs.changes.outputs.all == 'true' || (needs.changes.outputs.bot != 'true' && needs.changes.outputs.agent == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          # Standard library only: there is no go.sum to key a module cache on.
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, checks]
    # After checks when they run; on the bot's branches checks are skipped and this still runs.
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.bot == 'true' || needs.changes.outputs.heavy == 'true') }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/e2e exec playwright install --with-deps chromium
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
      - name: Build control-plane image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/control-plane/Dockerfile
          load: true
          push: false
          tags: gromesh-control-plane
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-control-plane
            type=gha,scope=ci-control-plane
          cache-to: type=gha,mode=max,scope=ci-control-plane,ignore-error=true
      - name: Build ui image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ui/Dockerfile
          load: true
          push: false
          tags: gromesh-ui
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-ui
            type=gha,scope=ci-ui
          cache-to: type=gha,mode=max,scope=ci-ui,ignore-error=true
      - name: Build agent image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/agent/Dockerfile
          load: true
          push: false
          tags: gromesh-agent
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-agent
            type=gha,scope=ci-agent
          cache-to: type=gha,mode=max,scope=ci-agent,ignore-error=true
      # The compose default Kong image is our own build, published privately on GHCR.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The three images above carry compose's default names, so up does not rebuild them.
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --wait
      # The gateway caches a failed lookup of gromesh-collector for about a minute, and the steps below send traffic
      # right away (the control-plane e2e even restarts the gateway): the collector must exist before any of them.
      - name: Start the collector before any gateway traffic
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile observability up -d --wait clickhouse
          docker compose -f deploy/compose/docker-compose.yml --profile observability run --rm --no-deps clickhouse-init
          docker compose -f deploy/compose/docker-compose.yml --profile observability up -d --wait --no-deps vector
      - name: Kong accepts the compiler output (contract example)
        run: pnpm smoke
      - name: Walking skeleton (API → compiler → Kong → upstream)
        run: pnpm --filter @gromesh/control-plane test:e2e
      - name: Product acceptance (UI → agent → proxy → rollback)
        run: pnpm test:e2e
      - name: Capture compose logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose -f deploy/compose/docker-compose.yml --profile observability logs --no-color > e2e/test-results/compose.log 2>&1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: product-e2e-failure
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - name: Stop acceptance stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down

  # The Helm install in kind (formerly also helm-e2e, whose extra checks now live in e2e/kind/run.sh).
  mvp-e2e:
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.all == 'true' || needs.changes.outputs.bot == 'true' || needs.changes.outputs.kind == 'true') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: gromesh-mvp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/e2e exec playwright install --with-deps chromium
      - name: Install pinned Helm, kind and kubectl
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/tools"
          curl -fsSLO --retry 3 https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO --retry 3 https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          install linux-amd64/helm "$RUNNER_TEMP/bin/helm"
          curl -fsSLo kind-linux-amd64 --retry 3 https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          curl -fsSLO --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          install kind-linux-amd64 "$RUNNER_TEMP/bin/kind"
          curl -fsSLo kubectl --retry 3 https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 --retry 3 https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          install kubectl "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
      - name: Build control-plane image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/control-plane/Dockerfile
          load: true
          push: false
          tags: gromesh-control-plane:ci
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-control-plane
            type=gha,scope=ci-control-plane
          cache-to: type=gha,mode=max,scope=ci-control-plane,ignore-error=true
      - name: Build ui image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ui/Dockerfile
          load: true
          push: false
          tags: gromesh-ui:ci
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-ui
            type=gha,scope=ci-ui
          cache-to: type=gha,mode=max,scope=ci-ui,ignore-error=true
      - name: Build agent image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/agent/Dockerfile
          load: true
          push: false
          tags: gromesh-agent:ci
          # The images workflow fills images-<name> on main; PR runs read it and keep their own scope.
          cache-from: |
            type=gha,scope=images-agent
            type=gha,scope=ci-agent
          cache-to: type=gha,mode=max,scope=ci-agent,ignore-error=true
      - name: Pull test dependencies
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          read -r kong_ref kong_tag < <(node scripts/kong-image-ref.mjs)
          docker pull "$kong_ref"
          docker tag "$kong_ref" "$kong_tag"
          echo "KONG_TAG=$kong_tag" >> "$GITHUB_ENV"
          docker pull postgres:16-alpine
          docker pull traefik/whoami:v1.10.3
          # Pulled by digest, then tagged: kind loads images by tag.
          docker pull clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
          docker tag clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146 clickhouse/clickhouse-server:25.8.33.6-alpine
          docker pull timberio/vector:0.57.0-alpine@sha256:19e3526faf4d4b1ed0c28a0d68d4cc3a1e13e437099986a5b7a768707907497c
          docker tag timberio/vector:0.57.0-alpine@sha256:19e3526faf4d4b1ed0c28a0d68d4cc3a1e13e437099986a5b7a768707907497c timberio/vector:0.57.0-alpine
      - name: Create kind cluster and preload images
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --image kindest/node:v1.32.2 --wait 120s
          images="gromesh-control-plane:ci gromesh-ui:ci gromesh-agent:ci $KONG_TAG postgres:16-alpine traefik/whoami:v1.10.3 clickhouse/clickhouse-server:25.8.33.6-alpine timberio/vector:0.57.0-alpine"
          # shellcheck disable=SC2086
          if ! kind load docker-image --name "$KIND_CLUSTER_NAME" $images; then
            # shellcheck disable=SC2086
            docker save --platform=linux/amd64 -o "$RUNNER_TEMP/images.tar" $images
            kind load image-archive --name "$KIND_CLUSTER_NAME" "$RUNNER_TEMP/images.tar"
            rm -f "$RUNNER_TEMP/images.tar"
          fi
          kubectl wait --for=condition=Ready nodes --all --timeout=60s
      - name: MVP acceptance (Helm install → UI → publish → converge → dashboard → rollback → audit)
        run: bash e2e/kind/run.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mvp-e2e-failure
          path: |
            e2e/test-results-kind/
            e2e/playwright-report-kind/
          retention-days: 7
      - name: Dump Kubernetes diagnostics
        if: failure()
        run: |
          bash deploy/helm/control-plane/ci/diagnostics.sh gromesh-mvp "$RUNNER_TEMP/kind-diagnostics"
          kind export logs --name "$KIND_CLUSTER_NAME" "$RUNNER_TEMP/kind-diagnostics/kind-logs" || true
      - name: Upload Kubernetes diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mvp-e2e-kind-diagnostics
          path: ${{ runner.temp }}/kind-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Delete throwaway cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER_NAME"

  # One check that is green when every job that had to run passed (skipped jobs are fine): what a ruleset should
  # require, since the per-job checks are skipped on docs-only PRs.
  ci-ok:
    needs: [changes, checks, ui-acceptance, agent, e2e, mvp-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then exit 1; fi

