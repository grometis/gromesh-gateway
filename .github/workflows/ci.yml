name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gromesh
          POSTGRES_PASSWORD: gromesh
          POSTGRES_DB: gromesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gromesh" --health-interval 5s --health-timeout 3s --health-retries 20
      # Plugin configs are validated by a real Kong (control-plane integration tests).
      kong:
        image: kong:3.9.3
        env:
          KONG_DATABASE: "off"
          KONG_ADMIN_LISTEN: "0.0.0.0:8001"
          KONG_PLUGINS: bundled
        ports: ["127.0.0.1:8011:8001"]
        options: >-
          --health-cmd "kong health" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gromesh:gromesh@127.0.0.1:5432/gromesh
      KONG_VALIDATOR_URL: http://127.0.0.1:8011
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated UI client matches the contract
        run: |
          pnpm --filter @gromesh/ui gen:api
          git diff --exit-code -- apps/ui/src/api/schema.d.ts
      - run: pnpm lint:contracts
      - run: pnpm typecheck
      - run: pnpm test

  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/ui exec playwright install --with-deps chromium
      - name: UI acceptance against Prism
        run: pnpm --filter @gromesh/ui test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-acceptance-failure
          path: apps/ui/test-results/
          retention-days: 7

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          # Standard library only: there is no go.sum to key a module cache on.
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gromesh/e2e exec playwright install --with-deps chromium
      - run: docker compose -f deploy/compose/docker-compose.yml build agent
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - name: Kong accepts the compiler output (contract example)
        run: pnpm smoke
      - name: Walking skeleton (API → compiler → Kong → upstream)
        run: pnpm --filter @gromesh/control-plane test:e2e
      - name: Product acceptance (UI → agent → proxy → rollback)
        run: pnpm test:e2e
      - name: Capture compose logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose -f deploy/compose/docker-compose.yml logs --no-color > e2e/test-results/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-e2e-failure
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - name: Stop acceptance stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down
