name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gromesh
          POSTGRES_PASSWORD: gromesh
          POSTGRES_DB: gromesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gromesh" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gromesh:gromesh@127.0.0.1:5432/gromesh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:contracts
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - name: Kong accepts the compiler output (contract example)
        run: node scripts/smoke.mjs
      - name: Walking skeleton (API → compiler → Kong → upstream)
        run: pnpm --filter @gromesh/control-plane test:e2e
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color
