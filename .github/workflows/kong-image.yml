name: kong-image

on:
  workflow_dispatch:
  push:
    tags: ["kong-v*"]

permissions:
  contents: read

concurrency:
  group: kong-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/kong-image-build.yml
    with:
      publish: true

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kong-digest-*
          path: ${{ runner.temp }}/kong-digests
          merge-multiple: true

      - name: Publish and inspect manifest list
        env:
          DIGEST_DIR: ${{ runner.temp }}/kong-digests
        run: |
          AMD64_DIGEST="$(cat "$DIGEST_DIR/amd64.txt")"
          ARM64_DIGEST="$(cat "$DIGEST_DIR/arm64.txt")"
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid amd64 digest: ${AMD64_DIGEST}" >&2; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid arm64 digest: ${ARM64_DIGEST}" >&2; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gromesh-kong"
          tag="3.9.4-${GITHUB_SHA}"
          docker buildx imagetools create -t "${image}:${tag}" \
            "${image}@${AMD64_DIGEST}" "${image}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${image}:${tag}"
          echo "manifest list digest: sha256:$(docker buildx imagetools inspect --raw "${image}:${tag}" | sha256sum | cut -d' ' -f1)"
