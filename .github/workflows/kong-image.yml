name: kong-image

on:
  workflow_dispatch:
  push:
    tags: ["kong-v*"]

permissions:
  contents: read

concurrency:
  group: kong-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: deploy/compose/docker-compose.yml
      COMPOSE_PROJECT_NAME: gromesh-kong-image
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify native runner and set image tag
        run: |
          case "${TARGET_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match ${TARGET_ARCH}" >&2; exit 1 ;;
          esac
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "KONG_IMAGE=ghcr.io/${owner}/gromesh-kong:3.9.4-${GITHUB_SHA}-${TARGET_ARCH}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kong-bazel-cache
          key: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-${{ hashFiles('images/kong/Dockerfile') }}
          restore-keys: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-

      # The amd64 runner ran out of disk while the Bazel cache mount was written back after a successful build.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      # BuildKit's layer cache does not export RUN cache mounts. Persisting the cache is best effort: its post step
      # must not fail a build whose image already passed every check and was published.
      - name: Restore and persist Bazel cache mount
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"${{ runner.temp }}/kong-bazel-cache": {"target": "/root/.cache/bazel", "sharing": "locked"}}'
          skip-extraction: ${{ steps.bazel-cache.outputs.cache-hit == 'true' }}
          utility-image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

      - name: Build and load image for acceptance tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kong
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.KONG_IMAGE }}
          cache-from: type=gha,scope=kong-3.9.4-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kong-3.9.4-${{ matrix.arch }}

      - name: Verify image architecture, Kong version and non-root user
        run: |
          platform="$(docker image inspect "$KONG_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          test "$platform" = "linux/${TARGET_ARCH}"
          version="$(docker run --rm "$KONG_IMAGE" kong version)"
          printf '%s\n' "$version"
          test "$version" = 3.9.4
          uid="$(docker run --rm "$KONG_IMAGE" id -u)"
          test "$uid" -ne 0

      - name: Compose acceptance test with the built image
        # The Admin API is not published on the host: the smoke runs inside the gateway's network namespace.
        run: |
          KONG_IMAGE="$KONG_IMAGE" docker compose up -d --wait kong echo
          KONG_IMAGE="$KONG_IMAGE" docker compose --profile tools run --rm --no-deps smoke

      - name: Scan image (block CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity CRITICAL --exit-code 1 "$KONG_IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact local image that passed version, smoke and vulnerability checks.
      - name: Publish tested image
        run: |
          docker push "$KONG_IMAGE"
          # The manifest digest is the sha256 of the raw manifest; --format is not honoured by every buildx release.
          digest="sha256:$(docker buildx imagetools inspect --raw "$KONG_IMAGE" | sha256sum | cut -d' ' -f1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected image digest: ${digest}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/kong-digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/kong-digests/${TARGET_ARCH}.txt"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kong-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/kong-digests/${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color kong echo

      - name: Clean up acceptance stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kong-digest-*
          path: ${{ runner.temp }}/kong-digests
          merge-multiple: true

      - name: Publish and inspect manifest list
        env:
          DIGEST_DIR: ${{ runner.temp }}/kong-digests
        run: |
          AMD64_DIGEST="$(cat "$DIGEST_DIR/amd64.txt")"
          ARM64_DIGEST="$(cat "$DIGEST_DIR/arm64.txt")"
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid amd64 digest: ${AMD64_DIGEST}" >&2; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid arm64 digest: ${ARM64_DIGEST}" >&2; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gromesh-kong"
          tag="3.9.4-${GITHUB_SHA}"
          docker buildx imagetools create -t "${image}:${tag}" \
            "${image}@${AMD64_DIGEST}" "${image}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${image}:${tag}"
          echo "manifest list digest: sha256:$(docker buildx imagetools inspect --raw "${image}:${tag}" | sha256sum | cut -d' ' -f1)"
