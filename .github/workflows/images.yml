name: images

on:
  push:
    branches: [main]
    tags: ['*']
    # Only application code produces a new image. Digest-bump PRs (deploy/**, ci.yml, checklist) and docs must not
    # rebuild, or image-digests would open another PR after every merge of its own PR.
    paths:
      - apps/**
      - packages/**
      - contracts/**
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [control-plane, ui, agent]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Image tag
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/gromesh-${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
      - name: Build and load image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=images-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.name }}
      - name: Generate SPDX JSON SBOM
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/dist/sbom:/out" \
            anchore/syft:v1.18.1@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b "docker:${IMAGE}" \
            -o "spdx-json=/out/gromesh-${IMAGE_NAME}.spdx.json"
      - name: Attach SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.name }}-${{ github.sha }}
          path: dist/sbom/*.spdx.json
          if-no-files-found: error
      - name: Scan image (block CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --image-src docker --scanners vuln \
            --severity CRITICAL --exit-code 1 --ignorefile /dev/null \
            --no-progress --timeout 15m "$IMAGE"
      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: docker push "$IMAGE"
