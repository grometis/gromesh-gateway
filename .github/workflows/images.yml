name: images

on:
  # Dispatched on a branch to prove a workflow change; image-digests pins only builds of main.
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*']
    # Only application code produces a new image. Digest-bump PRs (deploy/**, ci.yml, checklist) and docs must not
    # rebuild, or image-digests would open another PR after every merge of its own PR.
    paths:
      - apps/**
      - packages/**
      - contracts/**
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One native build per architecture (no emulation); the manifest job joins the two tested images under <sha>.
  build-scan-publish:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [control-plane, ui, agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner and set image tag
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          case "${TARGET_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match ${TARGET_ARCH}" >&2; exit 1 ;;
          esac
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/gromesh-${IMAGE_NAME}:${GITHUB_SHA}-${TARGET_ARCH}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.name }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=images-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.name }}-${{ matrix.arch }}
      - name: Verify image architecture
        run: test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/${TARGET_ARCH}"
      - name: Generate SPDX JSON SBOM
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/dist/sbom:/out" \
            anchore/syft:v1.18.1@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b "docker:${IMAGE}" \
            -o "spdx-json=/out/gromesh-${IMAGE_NAME}-${TARGET_ARCH}.spdx.json"
      - name: Attach SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/sbom/*.spdx.json
          if-no-files-found: error
      - name: Scan image (block CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --image-src docker --scanners vuln \
            --severity CRITICAL --exit-code 1 --ignorefile /dev/null \
            --no-progress --timeout 15m "$IMAGE"
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push the exact local image that passed the architecture check and the scan.
      - name: Publish tested image
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          docker push "$IMAGE"
          # The manifest digest is the sha256 of the raw manifest; --format is not honoured by every buildx release.
          digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE" | sha256sum | cut -d' ' -f1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected image digest: ${digest}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/${IMAGE_NAME}-${TARGET_ARCH}.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.name }}-${{ matrix.arch }}.txt
          if-no-files-found: error

  manifest:
    needs: build-scan-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [control-plane, ui, agent]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      # image-digests pins the digest of this manifest list, so the <sha> tag must exist only once both builds passed.
      - name: Publish and inspect manifest list
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          AMD64_DIGEST="$(cat "$DIGEST_DIR/${IMAGE_NAME}-amd64.txt")"
          ARM64_DIGEST="$(cat "$DIGEST_DIR/${IMAGE_NAME}-arm64.txt")"
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid amd64 digest: ${AMD64_DIGEST}" >&2; exit 1; }
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid arm64 digest: ${ARM64_DIGEST}" >&2; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gromesh-${IMAGE_NAME}"
          docker buildx imagetools create -t "${image}:${GITHUB_SHA}" \
            "${image}@${AMD64_DIGEST}" "${image}@${ARM64_DIGEST}"
          docker buildx imagetools inspect "${image}:${GITHUB_SHA}"
          platforms="$(docker buildx imagetools inspect --raw "${image}:${GITHUB_SHA}" \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          test "$platforms" = "linux/amd64,linux/arm64" || { echo "Unexpected platforms: ${platforms}" >&2; exit 1; }
          echo "manifest list digest: sha256:$(docker buildx imagetools inspect --raw "${image}:${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
