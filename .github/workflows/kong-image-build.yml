name: kong-image-build

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the tested image and upload its registry digest
        type: boolean
        default: false

# Inherit the caller's permissions: contents:read for candidates; packages:write only for publication.
# Do not inherit repository secrets or attach an environment here.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      COMPOSE_PROJECT_NAME: gromesh-kong-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      UI_URL: http://127.0.0.1:5174
      CP_URL: http://127.0.0.1:3000/api/v1
      CLICKHOUSE_URL: http://127.0.0.1:8123
      POSTGRES_PORT: "55442"
      KONG_PROXY_URL: http://127.0.0.1:8000
      KONG_STATUS_URL: http://127.0.0.1:8100/status/ready
      KONG_METRICS_URL: http://127.0.0.1:8100
      ECHO_URL: http://127.0.0.1:8080
      KONG_VALIDATOR_URL: http://127.0.0.1:8011
      KONG_PROXY_TLS_PORT: "8443"
      BOOTSTRAP_ADMIN_EMAIL: ci@example.test
      TARGET_ARCH: ${{ matrix.arch }}
      # A caller grants permissions; this switch cannot enable publication on a pull request.
      PUBLISH: ${{ inputs.publish && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure disposable acceptance run
        run: |
          echo "COMPOSE_FILE=$GITHUB_WORKSPACE/deploy/compose/docker-compose.yml:$GITHUB_WORKSPACE/deploy/compose/disposable.yml" >> "$GITHUB_ENV"
          echo "GROMESH_DISPOSABLE_ID=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          for key in POSTGRES_PASSWORD BOOTSTRAP_ADMIN_PASSWORD CLICKHOUSE_PASSWORD CLICKHOUSE_READER_PASSWORD CLICKHOUSE_WRITER_PASSWORD GROMESH_COLLECTOR_TOKEN; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          encryption="ci:$(openssl rand -base64 32)"
          fingerprint="$(openssl rand -base64 32)"
          echo "::add-mask::$encryption"
          echo "::add-mask::$fingerprint"
          echo "GROMESH_ENCRYPTION_KEY=$encryption" >> "$GITHUB_ENV"
          echo "GROMESH_FINGERPRINT_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify native runner and set image tag
        run: |
          case "${TARGET_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match ${TARGET_ARCH}" >&2; exit 1 ;;
          esac
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "KONG_IMAGE=ghcr.io/${owner}/gromesh-kong:3.9.4-${GITHUB_SHA}-${TARGET_ARCH}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.25.0
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e

      - name: Record candidate base image provenance
        if: env.PUBLISH != 'true'
        run: |
          while IFS= read -r from; do
            printf '%s\n' "$from"
            base="$(awk '{print $2}' <<< "$from")"
            [[ "$base" =~ ^ubuntu:[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]] || { echo "Expected a digest-pinned Ubuntu FROM" >&2; exit 1; }
            docker buildx imagetools inspect "$base"
            printf 'base index digest: %s\n' "${base##*@}"
          done < <(awk 'toupper($1) == "FROM"' images/kong/Dockerfile)

      # PRs may restore trusted branch caches, but never save Bazel or BuildKit caches.
      - name: Restore candidate Bazel cache (read only)
        if: env.PUBLISH != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kong-bazel-cache
          key: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-${{ hashFiles('images/kong/Dockerfile') }}
          restore-keys: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-

      - name: Restore Bazel cache
        if: env.PUBLISH == 'true'
        id: bazel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kong-bazel-cache
          key: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-${{ hashFiles('images/kong/Dockerfile') }}
          restore-keys: kong-bazel-${{ runner.os }}-${{ matrix.arch }}-3.9.4-

      # The amd64 runner ran out of disk while the Bazel cache mount was written back after a successful build.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      # BuildKit's layer cache does not export RUN cache mounts. Persisting the cache is best effort: its post step
      # must not fail a build whose image already passed every check and was published.
      - name: Restore and persist Bazel cache mount
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"${{ runner.temp }}/kong-bazel-cache": {"target": "/root/.cache/bazel", "sharing": "locked"}}'
          skip-extraction: ${{ env.PUBLISH != 'true' || steps.bazel-cache.outputs.cache-hit == 'true' }}
          utility-image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

      - name: Build and load image for acceptance tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kong
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.KONG_IMAGE }}
          cache-from: type=gha,scope=kong-3.9.4-${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope=kong-3.9.4-{0}', matrix.arch) || '' }}

      - name: Record candidate local image digest
        if: env.PUBLISH != 'true'
        run: |
          # A loaded image's Id is its local config digest, not a registry manifest digest.
          docker image inspect "$KONG_IMAGE" --format '{{.Id}}'

      - name: Verify image architecture, Kong version and non-root user
        run: |
          platform="$(docker image inspect "$KONG_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          test "$platform" = "linux/${TARGET_ARCH}"
          version="$(docker run --rm "$KONG_IMAGE" kong version)"
          printf '%s\n' "$version"
          test "$version" = 3.9.4
          uid="$(docker run --rm "$KONG_IMAGE" id -u)"
          test "$uid" -ne 0

      - name: Compose acceptance test with the built image
        # The host guard requires the full acceptance stack and image metadata for inactive profiles.
        # Only smokeInside runs in the gateway's namespace; the Admin API remains on a Unix socket.
        run: |
          docker compose --profile '*' pull --ignore-buildable --policy missing
          docker compose --profile '*' build
          docker compose up -d --wait kong echo ui
          docker compose --profile observability up -d --wait clickhouse
          docker compose --profile observability run --rm --no-deps clickhouse-init
          docker compose --profile observability up -d --wait --no-deps vector
          KONG_IMAGE="$KONG_IMAGE" node scripts/smoke.mjs

      - name: Scan image (block CRITICAL vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --scanners vuln --severity CRITICAL --exit-code 1 "$KONG_IMAGE"

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Push the exact local image that passed version, smoke and vulnerability checks.
      - name: Publish tested image
        id: publish
        if: env.PUBLISH == 'true'
        run: |
          docker push "$KONG_IMAGE"
          # The manifest digest is the sha256 of the raw manifest; --format is not honoured by every buildx release.
          digest="sha256:$(docker buildx imagetools inspect --raw "$KONG_IMAGE" | sha256sum | cut -d' ' -f1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected image digest: ${digest}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/kong-digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/kong-digests/${TARGET_ARCH}.txt"
          printf 'digest=%s\nsha=%s\narch=%s\nimage=%s\n' "$digest" "$GITHUB_SHA" "$TARGET_ARCH" "$KONG_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Validate published digest before any upload
        id: validate-supply-chain
        if: env.PUBLISH == 'true'
        env:
          IMAGE_NAME: kong
          EXPECTED_DIGEST: ${{ steps.publish.outputs.digest }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          PUBLISHED_ARCH: ${{ steps.publish.outputs.arch }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
        run: node scripts/ci-supply-chain.mjs kong-digest

      - name: Upload image digest
        if: success() && env.PUBLISH == 'true' && steps.validate-supply-chain.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kong-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/kong-digests/${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Compose diagnostics in the masked job log
        if: failure()
        run: docker compose --profile '*' logs --no-color

      - name: Generate structured candidate evidence
        id: generate-evidence
        if: always() && env.PUBLISH != 'true'
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
        run: node scripts/ci-evidence.mjs generate kong-image-build

      - name: Validate candidate artifact allowlist
        id: validate-evidence
        if: always() && env.PUBLISH != 'true' && steps.generate-evidence.outcome == 'success'
        run: node scripts/ci-evidence.mjs validate kong-image-build

      - name: Upload candidate evidence
        if: always() && env.PUBLISH != 'true' && steps.validate-evidence.outcome == 'success' && steps.validate-supply-chain.outcome != 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kong-candidate-${{ matrix.arch }}
          path: evidence/kong-image-build.json
          if-no-files-found: error
          retention-days: 7

      - name: Clean up acceptance stack
        if: always()
        run: docker compose --profile '*' down -v --remove-orphans

