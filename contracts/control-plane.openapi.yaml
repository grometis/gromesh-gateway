                    type: array
                    items: { $ref: "#/components/schemas/PluginCatalogEntry" }
  /plugin-schemas/{pluginName}:
    parameters:
      - name: pluginName
        in: path
        required: true
        schema: { type: string, example: rate-limiting }
    get:
      tags: [plugins]
      operationId: getPluginSchema
      x-required-role: viewer
      description: Raw Kong schema (as returned by Kong's GET /schemas/plugins/{name}) used by the UI to render forms.
      responses:
        "200":
          description: Kong plugin schema
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/publish-preview:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: previewPublish
      x-required-role: viewer
      description: Compiles the draft and diffs it against the current snapshot. 422 lists compile issues.
      responses:
        "200":
          description: What a publish would change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishPreview" }
              example: {"currentVersion": 3, "draftHash": "sha256:4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f", "hasChanges": true, "changes": [{"kind": "services", "id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "label": "orders", "change": "added", "after": {"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080}}, {"kind": "routes", "id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "label": "orders-api", "change": "added", "after": {"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "service": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "paths": ["/orders"]}}]}
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: listSnapshots
      x-required-role: viewer
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [snapshots]
      operationId: publish
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: editor
      description: |
        Compiles the draft, stores it as version N+1 and notifies agents.
        Returns 409 if the draft hash equals the current snapshot (nothing to publish)
        or if `expectedCurrentVersion` is stale; 422 when the draft has a forbidden destination (see the
        description of this API), with `path` naming the entity like other publish errors (`services[0].host`,
        `upstreams[0].name`, `targets[0].target`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
              example: {"version": 4, "hash": "sha256:4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f", "message": "Adiciona orders", "createdAt": "2026-10-15T12:00:00Z", "createdBy": {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "name": "Ana Editora"}, "rollbackOf": null, "isCurrent": true}
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: getSnapshot
      x-required-role: viewer
      description: |
        Full envelope with credential keys, JWT secrets, basic-auth password hashes, `encrypted` plugin fields and certificate
        keys replaced by `"REDACTED"`, for every role including admin. Only the agent endpoint (`GET /agent/v1/snapshots/current`) delivers the real values.
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "./snapshot.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/diff:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: diffSnapshot
      x-required-role: viewer
      parameters:
        - name: against
          in: query
          description: Version to compare with (default = version - 1)
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Entity-level changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EntityChange" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/rollback:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    post:
      tags: [snapshots]
      operationId: rollback
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: editor
      description: Restores the draft to this version's state and publishes it as a NEW version. 422, with nothing changed, when that state has a forbidden destination (see the description of this API).
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Target has the same configuration as the current version
        "422": { $ref: "#/components/responses/ValidationError" }

  /environments/{envId}/clusters:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [clusters]
      operationId: listClusters
      x-required-role: viewer
      responses:
        "200":
          description: Clusters with node status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [clusters]
      operationId: createCluster
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "201":
          description: Created. `registrationToken` is shown only here.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Cluster" }
                  - type: object
                    required: [registrationToken]
                    properties:
                      registrationToken: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
  /clusters/{clusterId}:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [clusters]
      operationId: getCluster
      x-required-role: viewer
      responses:
        "200":
          description: Cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [clusters]
      operationId: deleteCluster
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      description: Revokes registration and node tokens.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /clusters/{clusterId}/rotate-token:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    post:
      tags: [clusters]
      operationId: rotateClusterToken
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      description: New registration token; already-registered nodes keep working.
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [registrationToken]
                properties:
                  registrationToken: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Audit events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /environments/{envId}/analytics/summary:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      x-required-role: viewer
      description: |
        Traffic of the environment as seen by its gateways, from the `requests` table fed by the observability
        pipeline (7 days of retention). Totals for the period plus one point per `interval`; a bucket with no
        traffic is present with zero requests and null latencies. Latencies are total request time in ms.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - name: interval
          in: query
          schema: { type: string, enum: [1m, 5m, 15m, 1h, 1d], default: 5m }
          description: Bucket size; the period may hold at most 2000 buckets.
        - { $ref: "#/components/parameters/RouteFilter" }
        - { $ref: "#/components/parameters/ServiceFilter" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
              example:
                from: "2026-10-15T12:00:00Z"
                to: "2026-10-15T12:10:00Z"
                interval: 5m
                totals: { requests: 1250, errors4xx: 40, errors5xx: 3, errorRate: 0.0344, p50Ms: 12.4, p95Ms: 48.9, p99Ms: 120.0 }
                series:
                  - { ts: "2026-10-15T12:00:00Z", requests: 600, errors4xx: 18, errors5xx: 1, errorRate: 0.0317, p50Ms: 11.8, p95Ms: 45.2, p99Ms: 98.0 }
                  - { ts: "2026-10-15T12:05:00Z", requests: 650, errors4xx: 22, errors5xx: 2, errorRate: 0.0369, p50Ms: 13.0, p95Ms: 52.1, p99Ms: 131.5 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
  /environments/{envId}/analytics/top-routes:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: getTopRoutes
      x-required-role: viewer
      description: |
        The routes with the most traffic, the most errors or the slowest p95 over the period, from the same
        `requests` table as the summary (same 7-day limit). Traffic that matched no route is one row with null
        `routeId` and `serviceId`. Ordered by the chosen criterion descending, ties by `requests` descending then
        `routeId`.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - name: by
          in: query
          schema: { type: string, enum: [requests, errors, p95], default: requests }
          description: |
            `requests`: request count; `errors`: 4xx plus 5xx responses; `p95`: p95 of the total latency (routes
            without latency data come last).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Top routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopRoutes" }
              example:
                from: "2026-10-15T12:00:00Z"
                to: "2026-10-15T12:10:00Z"
                by: requests
                items:
                  - { routeId: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f", routeName: orders, serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", requests: 900, errors4xx: 30, errors5xx: 2, errorRate: 0.0356, p50Ms: 12.1, p95Ms: 47.0, p99Ms: 118.0 }
                  - { routeId: "8e1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b", routeName: null, serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", requests: 300, errors4xx: 10, errors5xx: 1, errorRate: 0.0367, p50Ms: 13.4, p95Ms: 55.2, p99Ms: 140.0 }
                  - { routeId: null, routeName: null, serviceId: null, requests: 50, errors4xx: 50, errors5xx: 0, errorRate: 1, p50Ms: 0.4, p95Ms: 0.9, p99Ms: 1.2 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
  /environments/{envId}/requests:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: listRequests
      x-required-role: viewer
      description: |
        Request explorer over the same `requests` table, newest first. Credentials never reach the table (the
        pipeline strips them), so a record carries no header or query values: only the path. `clientIp` is
        masked for every role but admin.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: status
          in: query
          schema: { type: integer, minimum: 100, maximum: 599 }
          description: Exact status code; mutually exclusive with `statusClass`.
        - name: statusClass
          in: query
          schema: { type: string, enum: [2xx, 3xx, 4xx, 5xx] }
        - { $ref: "#/components/parameters/RouteFilter" }
        - { $ref: "#/components/parameters/ServiceFilter" }
        - { name: consumerId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
              example:
                items:
                  - id: "7a1d0c2e-5b3f-4e6a-9c8d-0f1e2d3c4b5a"
                    ts: "2026-10-15T12:04:58.123Z"
                    environmentId: "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11"
                    clusterId: "9d7c5a3b-1e2f-4a6b-8c9d-0e1f2a3b4c5d"
                    serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c"
                    routeId: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f"
                    consumerId: "0b7c3c1e-1f2a-4f7e-9c41-0d3c1b2a9e11"
                    method: GET
                    path: /orders/42
                    status: 200
                    latencyKongMs: 1
                    latencyUpstreamMs: 11
                    latencyTotalMs: 12
                    clientIp: "203.0.113.0"
                    requestSize: 312
                    responseSize: 1804
                nextCursor: null
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gromesh_session
      description: Session cookie set by `POST /auth/login`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value of `GET /auth/csrf`, required together with the session cookie on every mutation.
    bearerApiToken:
      type: http
      scheme: bearer
      description: |
        An API token (`POST /users/me/tokens`), `Authorization: Bearer ggt_…`. Accepted wherever the session cookie is,
        except by the token and user management operations, which take a session only. A request with a bearer token
        ignores any cookie and needs no CSRF token. The effective role is the lower of the token's role and its owner's
        current role; a token of a deactivated user, an expired or a revoked token answers 401.
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Search:
      name: q
      in: query
      description: Case-insensitive match on name (and paths/hosts for routes)
      schema: { type: string }
    EnvId:
      name: envId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalyticsFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: Start of the period (inclusive). The period may span at most 7 days, the table's retention.
    AnalyticsTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: End of the period (exclusive); must be after `from`.
    RouteFilter:
      name: routeId
      in: query
      schema: { type: string, format: uuid }
    ServiceFilter:
      name: serviceId
      in: query
      schema: { type: string, format: uuid }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UpstreamId:
      name: upstreamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role too low, or missing/invalid `X-CSRF-Token` on a mutation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AnalyticsUnavailable:
      description: The analytics store (ClickHouse) is unreachable or not configured
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 60
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Uniqueness, reference or version conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Invalid payload or compile issues (`errors[]` carries paths)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    Name:
      type: string
      pattern: "^[A-Za-z0-9._~-]+$"
      maxLength: 128
    Tags:
      type: array
      items: { type: string, maxLength: 128 }
      maxItems: 32
    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [viewer, editor, admin]
    EnvironmentRole:
      type: string
      enum: [viewer, editor, admin, none]
      description: Replaces the global role in one environment; `none` hides the environment from the user.
    EnvironmentRoleAssignment:
      type: object
      additionalProperties: false
      required: [environmentId, role]
      properties:
        environmentId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/EnvironmentRole" }
    EnvironmentRoles:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/EnvironmentRoleAssignment" }
    Me:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          properties:
            environmentRoles:
              type: array
              description: The caller's environment roles (the same set as GET /users/{userId}/environment-roles).
              items: { $ref: "#/components/schemas/EnvironmentRoleAssignment" }
    User:
      allOf:
        - type: object
          required: [id, email, name, role, active]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string }
            role: { $ref: "#/components/schemas/Role" }
            active: { type: boolean }
        - { $ref: "#/components/schemas/Timestamps" }
    UserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, format: password, minLength: 12 }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        password: { type: string, format: password, minLength: 12 }
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        nextCursor: { type: [string, "null"] }
    ApiTokenCreate:
      type: object
      required: [name, role, expiresInDays]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        role: { $ref: "#/components/schemas/Role", description: At most the caller's role }
        expiresInDays: { type: integer, minimum: 1, maximum: 365 }
    ApiToken:
      type: object
      required: [id, name, role, tokenHint, createdAt, expiresAt, lastUsedAt, revokedAt, owner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        tokenHint: { type: string, description: "The last four characters, prefixed with …" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: Updated at most once a minute }
        revokedAt: { type: [string, "null"], format: date-time }
        owner:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    ApiTokenCreated:
      allOf:
        - { $ref: "#/components/schemas/ApiToken" }
        - type: object
          required: [token]
          properties:
            token: { type: string, pattern: "^ggt_[A-Za-z0-9_-]{43}$", description: "`ggt_` plus 32 random bytes in unpadded base64url (43 characters); shown only in this response" }
    ApiTokenPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        nextCursor: { type: [string, "null"] }
    Environment:
      allOf:
        - type: object
          required: [id, name, publishMode, currentVersion, hasUnpublishedChanges, autoPublishPausedReason]
          properties:
            id: { type: string, format: uuid }
            name: { $ref: "#/components/schemas/Name" }
            description: { type: [string, "null"] }
            publishMode: { type: string, enum: [manual, auto] }
            currentVersion: { type: [integer, "null"] }
            hasUnpublishedChanges: { type: boolean }
            autoPublishPausedReason:
              type: [string, "null"]
              enum: [import, null]
              readOnly: true
              description: |
                Why automatic publication is paused for this environment, or null when it is not. "import": the draft
                came from an import (POST /environments/{envId}/import), which never publishes by itself, so
                publishMode auto does not publish this draft, nor later edits to it. Automatic publication resumes
                after the next explicit publish (POST /environments/{envId}/snapshots). Always null with publishMode
                manual. Read-only: it cannot be set through EnvironmentWrite.
        - { $ref: "#/components/schemas/Timestamps" }
    EnvironmentWrite:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        description: { type: [string, "null"] }
        publishMode: { type: string, enum: [manual, auto], default: manual }
    ServiceWrite:
      type: object
      required: [name, protocol, host, port]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        protocol: { type: string, enum: [http, https, grpc, grpcs, tcp, tls] }
        host: { type: string, description: "An upstream's name balances across its targets; any other host is resolved by DNS. 422 at `host` for a forbidden destination (see the description of this API)." }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: [string, "null"], pattern: "^/" }
        retries: { type: integer, minimum: 0, maximum: 32767 }
        connectTimeoutMs: { type: integer, minimum: 1 }
        readTimeoutMs: { type: integer, minimum: 1 }
        writeTimeoutMs: { type: integer, minimum: 1 }
        enabled: { type: boolean, default: true }
        tags: { $ref: "#/components/schemas/Tags" }
    Service:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ServiceWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        nextCursor: { type: [string, "null"] }
    RouteWrite:
      type: object
      required: [name, serviceId]
      description: At least one of paths, hosts, methods or headers is required.
      properties:
        name: { $ref: "#/components/schemas/Name" }
        serviceId: { type: string, format: uuid }
        protocols:
          type: array
          items: { type: string, enum: [http, https, grpc, grpcs] }
          default: [http, https]
        methods: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string } }
        paths: { type: array, items: { type: string } }
        headers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        stripPath: { type: boolean, default: true }
        preserveHost: { type: boolean, default: false }
        analyticsRetentionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
          description: |
            How long this route's request analytics are kept, in days. Null or omitted uses the 7-day default;
            retention can never exceed 7 days. Responses and exports return `null` when unset (never the default).
            Applies only to rows written after the next publication, without changing retention for existing rows.
            Does not change path masking. The value reaches the data plane inside the compiled gateway
            configuration (compiler-internal); no other contract changes.
        tags: { $ref: "#/components/schemas/Tags" }
    Route:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/RouteWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    RoutePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Route" } }
        nextCursor: { type: [string, "null"] }
    ConsumerWrite:
      type: object
      description: username or customId is required.
      properties:
        username: { type: [string, "null"] }
        customId: { type: [string, "null"] }
        tags: { $ref: "#/components/schemas/Tags" }
    Consumer:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ConsumerWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ConsumerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Consumer" } }
        nextCursor: { type: [string, "null"] }
    KeyAuthCredential:
      type: object
      required: [id, consumerId, keyHint, createdAt]
      properties:
        id: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        keyHint: { type: string, description: Last 4 characters, example: "…k123" }
        tags: { $ref: "#/components/schemas/Tags" }
        createdAt: { type: string, format: date-time }
    JwtAlgorithm:
      type: string
      enum: [HS256, RS256, ES256]
    JwtCredentialCreate:
      type: object
      properties:
        key: { type: string, minLength: 1, maxLength: 256, description: "Matched against the token's `iss` claim; unique in the instance" }
        algorithm: { allOf: [{ $ref: "#/components/schemas/JwtAlgorithm" }], default: HS256 }
        secret: { type: string, minLength: 32, maxLength: 512, description: "HS256 only, write-only" }
        rsaPublicKey: { type: string, minLength: 1, maxLength: 16384, description: "RS256/ES256 only: PEM public key, at most 16 KiB" }
        tags: { $ref: "#/components/schemas/Tags" }
    JwtCredential:
      type: object
      required: [id, consumerId, key, algorithm, createdAt]
      properties:
        id: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        key: { type: string }
        algorithm: { $ref: "#/components/schemas/JwtAlgorithm" }
        rsaPublicKey: { type: string, description: "RS256/ES256 only; public, so it is returned" }
        tags: { $ref: "#/components/schemas/Tags" }
        createdAt: { type: string, format: date-time }
    BasicAuthCredentialCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 256, description: Unique in the instance }
        password: { type: string, minLength: 8, maxLength: 256, description: Write-only }
        tags: { $ref: "#/components/schemas/Tags" }
    BasicAuthCredential:
      type: object
      required: [id, consumerId, username, createdAt]
      properties:
        id: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        username: { type: string }
        tags: { $ref: "#/components/schemas/Tags" }
        createdAt: { type: string, format: date-time }
    AclGroups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9_-]{1,64}$" }
    HashOn:
      type: string
      enum: [none, consumer, ip, header, cookie]
    UpstreamWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 253, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$", description: "A lowercase hostname, unique in the environment. 422 at `name` for a forbidden destination (see the description of this API)." }
        algorithm: { type: string, enum: [round-robin, least-connections, consistent-hashing, latency], default: round-robin }
        hashOn: { allOf: [{ $ref: "#/components/schemas/HashOn" }], default: none, description: Only with consistent-hashing }
        hashFallback: { allOf: [{ $ref: "#/components/schemas/HashOn" }], default: none, description: Only with consistent-hashing; must be none when hashOn is cookie }
        hashOnHeader: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9-]+$", description: Required when hashOn is header }
        hashFallbackHeader: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9-]+$", description: Required when hashFallback is header }
        hashOnCookie: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$", description: Required when hashOn is cookie }
        hashOnCookiePath: { type: string, pattern: "^/", default: "/" }
        healthchecks: { $ref: "#/components/schemas/Healthchecks" }
        tags: { $ref: "#/components/schemas/Tags" }
    Healthchecks:
      type: object
      description: Both checks are off unless present (null or absent = off).
      properties:
        active:
          type: [object, "null"]
          required: [type]
          properties:
            type: { type: string, enum: [http, https, tcp] }
            httpPath: { type: string, pattern: "^/", default: "/", description: Ignored for tcp }
            intervalSeconds: { type: integer, minimum: 1, maximum: 3600, default: 10 }
            healthyThreshold: { type: integer, minimum: 1, maximum: 255, default: 2, description: Consecutive successes to mark a target healthy }
            unhealthyThreshold: { type: integer, minimum: 1, maximum: 255, default: 3, description: Consecutive failures (HTTP errors or timeouts) to mark it unhealthy }
            timeoutSeconds: { type: number, exclusiveMinimum: 0, maximum: 60, default: 1 }
        passive:
          type: [object, "null"]
          properties:
            unhealthyHttpFailures: { type: integer, minimum: 1, maximum: 255, default: 5, description: 5xx responses in proxied traffic before a target is marked unhealthy }
            unhealthyTimeouts: { type: integer, minimum: 1, maximum: 255, default: 3 }
    Upstream:
      allOf:
        - type: object
          required: [id, algorithm, hashOn, hashFallback, healthchecks]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/UpstreamWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    UpstreamPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Upstream" } }
        nextCursor: { type: [string, "null"] }
    TargetWrite:
      type: object
      required: [target]
      properties:
        target: { type: string, maxLength: 260, pattern: "^(\\[[0-9A-Fa-f:.]+\\]|[A-Za-z0-9.-]+):[0-9]{1,5}$", description: "host:port, IPv6 in brackets; unique in the upstream. 422 at `target` when the host is a forbidden destination (see the description of this API)." }
        weight: { type: integer, minimum: 0, maximum: 65535, default: 100, description: 0 takes the target out of the balancing }
        tags: { $ref: "#/components/schemas/Tags" }
    Target:
      allOf:
        - type: object
          required: [id, upstreamId, weight]
          properties:
            id: { type: string, format: uuid }
            upstreamId: { type: string, format: uuid }
        - { $ref: "#/components/schemas/TargetWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    TargetPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        nextCursor: { type: [string, "null"] }
    CertificateWrite:
      type: object
      required: [cert, key, snis]
      properties:
        cert: { type: string, minLength: 1, maxLength: 65536, description: "PEM certificate chain, leaf first, at most 64 KiB" }
        key: { type: string, minLength: 1, maxLength: 16384, description: "PEM private key of the leaf, at most 16 KiB, write-only; REDACTED on a PUT keeps the stored one" }
        snis:
          type: array
          maxItems: 100
          description: Server names this certificate answers, unique in the instance; a wildcard only as the `*.` prefix
          items: { type: string, maxLength: 253, pattern: "^(\\*\\.)?[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" }
        tags: { $ref: "#/components/schemas/Tags" }
    Certificate:
      allOf:
        - type: object
          required: [id, subject, issuer, notBefore, notAfter, fingerprintSha256]
          properties:
            id: { type: string, format: uuid }
            key: { const: REDACTED }
            subject: { type: string, readOnly: true }
            issuer: { type: string, readOnly: true }
            notBefore: { type: string, format: date-time, readOnly: true }
            notAfter: { type: string, format: date-time, readOnly: true }
            fingerprintSha256: { type: string, readOnly: true, pattern: "^([0-9A-F]{2}:){31}[0-9A-F]{2}$" }
        - { $ref: "#/components/schemas/CertificateWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    CertificatePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
        nextCursor: { type: [string, "null"] }
    PluginScope:
      type: object
      description: Empty scope = global plugin.
      properties:
        serviceId: { type: [string, "null"], format: uuid }
        routeId: { type: [string, "null"], format: uuid }
        consumerId: { type: [string, "null"], format: uuid }
    PluginWrite:
      type: object
      required: [name, config]
      properties:
        name: { type: string, example: rate-limiting }
        enabled: { type: boolean, default: true }
        scope: { $ref: "#/components/schemas/PluginScope" }
        config: { type: object }
        protocols: { type: array, items: { type: string } }
        tags: { $ref: "#/components/schemas/Tags" }
    Plugin:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/PluginWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    PluginPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
        nextCursor: { type: [string, "null"] }
    PluginCatalogEntry:
      type: object
      required: [name, category, source]
      properties:
        name: { type: string }
        category:
          type: string
          enum: [authentication, security, traffic-control, transformation, logging, observability, serverless, ai, other]
        source: { type: string, enum: [bundled, custom] }
        supportedInDbless:
          type: boolean
          description: False for plugins that need Kong's database (e.g. oauth2).
    GromeshConfigV1:
      type: object
      additionalProperties: false
      required: [apiVersion, services, routes, consumers, plugins, upstreams, certificates]
      description: |
        Gromesh's own declarative draft format. All six top-level collections are required, even if empty,
        so replace cannot accidentally interpret an omitted collection as a request to keep it.
        References use natural keys, not database foreign keys. Only credentials and certificates carry optional
        source ids for matching otherwise unidentifiable redacted entities. New ids are always generated by the
        target control plane. Timestamps and computed certificate metadata are excluded. Unknown fields at any
        depth are validation errors, including healthcheck and plugin config fields validated against their schemas.
        Secret properties support input values and the literal REDACTED; see the import operation for preservation
        rules. Export further restricts this schema to GromeshConfigV1Export.
      properties:
        apiVersion: { type: string, const: gromesh/v1 }
        services: { type: array, items: { $ref: "#/components/schemas/GromeshConfigService" } }
        routes: { type: array, items: { $ref: "#/components/schemas/GromeshConfigRoute" } }
        consumers: { type: array, items: { $ref: "#/components/schemas/GromeshConfigConsumer" } }
        plugins: { type: array, items: { $ref: "#/components/schemas/GromeshConfigPlugin" } }
        upstreams: { type: array, items: { $ref: "#/components/schemas/GromeshConfigUpstream" } }
        certificates: { type: array, items: { $ref: "#/components/schemas/GromeshConfigCertificate" } }
    GromeshConfigService:
      allOf: [{ $ref: "#/components/schemas/ServiceWrite" }]
      unevaluatedProperties: false
    GromeshConfigRoute:
      type: object
      additionalProperties: false
      required: [name, service]
      description: Same route attributes and match requirements as RouteWrite; service is the service name.
      properties:
        name: { $ref: "#/components/schemas/Name" }
        service: { $ref: "#/components/schemas/Name" }
        protocols: { $ref: "#/components/schemas/RouteWrite/properties/protocols" }
        methods: { $ref: "#/components/schemas/RouteWrite/properties/methods" }
        hosts: { $ref: "#/components/schemas/RouteWrite/properties/hosts" }
        paths: { $ref: "#/components/schemas/RouteWrite/properties/paths" }
        headers: { $ref: "#/components/schemas/RouteWrite/properties/headers" }
        stripPath: { $ref: "#/components/schemas/RouteWrite/properties/stripPath" }
        preserveHost: { $ref: "#/components/schemas/RouteWrite/properties/preserveHost" }
        analyticsRetentionDays:
          $ref: "#/components/schemas/RouteWrite/properties/analyticsRetentionDays"
        tags: { $ref: "#/components/schemas/Tags" }
    GromeshConfigConsumerRef:
      type: object
      additionalProperties: false
      description: At least one non-empty identifier; if both are supplied they must identify the same consumer.
      allOf:
        - anyOf:
            - type: object
              required: [username]
              properties: { username: { type: string, minLength: 1 } }
            - type: object
              required: [customId]
              properties: { customId: { type: string, minLength: 1 } }
      properties:
        username: { type: [string, "null"], minLength: 1 }
        customId: { type: [string, "null"], minLength: 1 }
    GromeshConfigConsumer:
      allOf:
        - { $ref: "#/components/schemas/ConsumerWrite" }
        - type: object
          required: [aclGroups, keyAuthCredentials, jwtCredentials, basicAuthCredentials]
          properties:
            aclGroups: { $ref: "#/components/schemas/AclGroups/properties/groups" }
            keyAuthCredentials: { type: array, items: { $ref: "#/components/schemas/GromeshConfigKeyAuthCredential" } }
            jwtCredentials: { type: array, items: { $ref: "#/components/schemas/GromeshConfigJwtCredential" } }
            basicAuthCredentials: { type: array, items: { $ref: "#/components/schemas/GromeshConfigBasicAuthCredential" } }
        - anyOf:
            - type: object
              required: [username]
              properties: { username: { type: string, minLength: 1 } }
            - type: object
              required: [customId]
              properties: { customId: { type: string, minLength: 1 } }
      unevaluatedProperties: false
    GromeshConfigKeyAuthCredential:
      type: object
      additionalProperties: false
      description: Import matches by id or a supplied full key, never by keyHint. Export omits key entirely.
      properties:
        id: { type: string, format: uuid }
        keyHint: { type: string, description: Display-only hint; not a secret or a matching key }
        key:
          type: string
          writeOnly: true
          oneOf:
            - { const: REDACTED }
            - { minLength: 16, not: { const: REDACTED } }
          description: Import only; required for a new credential, omitted or REDACTED preserves a matched key
        tags: { $ref: "#/components/schemas/Tags" }
    GromeshConfigJwtCredential:
      type: object
      additionalProperties: false
      required: [key, algorithm]
      description: HS256 exports secret as REDACTED; RS256/ES256 export only their public key and no secret.
      properties:
        id: { type: string, format: uuid }
        key: { $ref: "#/components/schemas/JwtCredentialCreate/properties/key" }
        algorithm: { $ref: "#/components/schemas/JwtAlgorithm" }
        secret:
          type: string
          oneOf:
            - { const: REDACTED }
            - { minLength: 32, maxLength: 512, not: { const: REDACTED } }
        rsaPublicKey: { $ref: "#/components/schemas/JwtCredentialCreate/properties/rsaPublicKey" }
        tags: { $ref: "#/components/schemas/Tags" }
      allOf:
        - if: { properties: { algorithm: { const: HS256 } } }
          then: { not: { required: [rsaPublicKey] } }
          else:
            required: [rsaPublicKey]
            not: { required: [secret] }
    GromeshConfigBasicAuthCredential:
      type: object
      additionalProperties: false
      required: [username]
      description: Export omits password entirely. Hashes are neither exported nor accepted.
      properties:
        id: { type: string, format: uuid }
        username: { $ref: "#/components/schemas/BasicAuthCredentialCreate/properties/username" }
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 256
          description: Import only; a new credential requires plaintext, omitted or REDACTED preserves a matched password
        tags: { $ref: "#/components/schemas/Tags" }
    GromeshConfigPluginScope:
      type: object
      additionalProperties: false
      description: Empty or absent scope is global; references resolve by service/route name and consumer identifiers.
      properties:
        service: { $ref: "#/components/schemas/Name" }
        route: { $ref: "#/components/schemas/Name" }
        consumer: { $ref: "#/components/schemas/GromeshConfigConsumerRef" }
    GromeshConfigPlugin:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: { $ref: "#/components/schemas/PluginWrite/properties/name" }
        enabled: { $ref: "#/components/schemas/PluginWrite/properties/enabled" }
        scope: { $ref: "#/components/schemas/GromeshConfigPluginScope" }
        config:
          type: object
          additionalProperties: true
          description: |
            Validated against the pinned catalog schema for name, including unknown fields at every depth.
            Fields marked encrypted are always REDACTED on export. Import accepts actual secrets or REDACTED;
            missing/REDACTED required secrets on new plugins fail at the exact config field path.
        protocols: { $ref: "#/components/schemas/PluginWrite/properties/protocols" }
        tags: { $ref: "#/components/schemas/Tags" }
    GromeshConfigUpstream:
      allOf:
        - { $ref: "#/components/schemas/UpstreamWrite" }
        - type: object
          required: [targets]
          properties:
            healthchecks: { $ref: "#/components/schemas/GromeshConfigHealthchecks" }
            targets: { type: array, items: { $ref: "#/components/schemas/GromeshConfigTarget" } }
      unevaluatedProperties: false
    GromeshConfigHealthchecks:
      allOf:
        - { $ref: "#/components/schemas/Healthchecks" }
        - type: object
          properties:
            active:
              allOf: [{ $ref: "#/components/schemas/Healthchecks/properties/active" }]
              unevaluatedProperties: false
            passive:
              allOf: [{ $ref: "#/components/schemas/Healthchecks/properties/passive" }]
              unevaluatedProperties: false
      unevaluatedProperties: false
    GromeshConfigTarget:
      allOf: [{ $ref: "#/components/schemas/TargetWrite" }]
      unevaluatedProperties: false
    GromeshConfigCertificate:
      type: object
      additionalProperties: false
      required: [cert, snis]
      description: |
        Match by an existing target id or exact non-empty SNI set. Export includes id and REDACTED key.
        Import requires a real key for a new certificate; on a match, omitted or REDACTED keeps the current key.
      properties:
        id: { type: string, format: uuid }
        cert: { $ref: "#/components/schemas/CertificateWrite/properties/cert" }
        key: { $ref: "#/components/schemas/CertificateWrite/properties/key" }
        snis: { $ref: "#/components/schemas/CertificateWrite/properties/snis" }
        tags: { $ref: "#/components/schemas/Tags" }
    GromeshConfigV1Export:
      description: Secret-safe export view of GromeshConfigV1, identical for YAML and JSON responses.
      allOf:
        - { $ref: "#/components/schemas/GromeshConfigV1" }
        - type: object
          properties:
            consumers:
              type: array
              items:
                type: object
                properties:
                  keyAuthCredentials:
                    type: array
                    items:
                      type: object
                      required: [id, keyHint]
                      additionalProperties: true
                      properties:
                        id: { type: string, format: uuid }
                        keyHint: { type: string }
                      not: { required: [key] }
                  jwtCredentials:
                    type: array
                    items:
                      type: object
                      required: [id]
                      additionalProperties: true
                      properties:
                        id: { type: string, format: uuid }
                        secret: { type: string, const: REDACTED }
                      if: { properties: { algorithm: { const: HS256 } } }
                      then: { required: [secret] }
                  basicAuthCredentials:
                    type: array
                    items:
                      type: object
                      required: [id]
                      additionalProperties: true
                      properties:
                        id: { type: string, format: uuid }
                      not: { required: [password] }
            certificates:
              type: array
              items:
                type: object
                required: [id, key]
                additionalProperties: true
                properties:
                  id: { type: string, format: uuid }
                  key: { type: string, const: REDACTED }
    KongDeclarativeConfigV3:
      type: object
      required: [_format_version]
      additionalProperties: true
      description: |
        Alternative source document, not the Gromesh export format. Source fields are retained for conversion
        diagnostics; additionalProperties does NOT authorize ignoring unknown data. Only fields representable
        by GromeshConfigV1 are accepted semantically. Unsupported entities/fields at any depth produce errors[]
        at their original paths; with dryRun false any such error aborts the entire import with 422.
      properties:
        _format_version: { type: string, const: "3.0" }
        _transform:
          type: boolean
          description: |
            Defaults to true; absent/true means plaintext basic-auth passwords. False accepts supplied
            basic-auth password hashes matching ^[0-9a-f]{40}$ only when their source consumer has a UUID id
            preserved exactly under importEnvironmentConfig's global-id rules. Otherwise the real import is
            422 at the credential's password path because the hash is salted with the consumer id; invalid
            UUIDs and cross-environment id collisions also report the consumer's id path.
    SerializedConfigDocument:
      type: string
      minLength: 1
      maxLength: 5242880
      description: |
        A single YAML mapping or JSON object encoded as a string. maxLength is a character ceiling; the import
        operation also enforces the stricter 5 MiB UTF-8 byte and decoded size limits. Parsed content must conform
        to GromeshConfigV1 or KongDeclarativeConfigV3 according to sourceFormat, with no duplicate keys or YAML aliases.
    GromeshConfigSourceFormat:
      type: string
      const: gromesh/v1
      default: gromesh/v1
    EnvironmentImportRequest:
      description: |
        Import envelope for the selected source model. Only kong-declarative-3.0 with _transform false
        accepts prehashed basic-auth passwords (40 lowercase hex), and only for source consumers with a UUID
        id preserved exactly: match that id in the target environment, reject an id used in another environment,
        or create with that id when globally unused. Natural identifiers cannot select a different consumer.
        See importEnvironmentConfig for conflicts, original error paths and secret handling. All other consumers
        keep today's matching and control-plane-generated ids for creation; absent/true _transform keeps
        plaintext handling.
      oneOf:
        - type: object
          additionalProperties: false
          required: [document, mode, dryRun]
          properties:
            sourceFormat: { $ref: "#/components/schemas/GromeshConfigSourceFormat" }
            document:
              oneOf:
                - { $ref: "#/components/schemas/GromeshConfigV1" }
                - { $ref: "#/components/schemas/SerializedConfigDocument" }
            mode: { $ref: "#/components/schemas/EnvironmentImportMode" }
            dryRun: { type: boolean }
        - type: object
          additionalProperties: false
          required: [sourceFormat, document, mode, dryRun]
          properties:
            sourceFormat: { type: string, const: kong-declarative-3.0 }
            document:
              oneOf:
                - { $ref: "#/components/schemas/KongDeclarativeConfigV3" }
                - { $ref: "#/components/schemas/SerializedConfigDocument" }
            mode: { $ref: "#/components/schemas/EnvironmentImportMode" }
            dryRun: { type: boolean }
    EnvironmentImportMode:
      type: string
      enum: [merge, replace]
      description: Merge never deletes; replace makes the draft exactly the document, preserving matched secrets and ids.
    EnvironmentImportFailure:
      description: |
        The 422 of an import: problem details plus the import report. Nothing was written (all or nothing), so the
        change arrays are empty and errors[] lists every error found, at its document path.
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [added, modified, removed, errors]
          properties:
            added: { type: array, maxItems: 0 }
            modified: { type: array, maxItems: 0 }
            removed: { type: array, maxItems: 0 }
            errors: { type: array, minItems: 1, items: { $ref: "#/components/schemas/FieldError" } }
    EnvironmentImportReport:
      type: object
      additionalProperties: false
      required: [added, modified, removed, errors]
      description: |
        Diff against the current draft. Each array contains EntityChange items whose change value matches the
        array name. Merge always has removed empty. Secrets are redacted as in publish diff; basic-auth passwords
        and hashes are never included. On semantic errors in dry-run all change arrays are empty.
        Ids for proposed additions in a dry-run are provisional and do not reserve persisted ids.
        Additions under the prehashed basic-auth consumer-id exception report the exact source
        consumer UUID, but dry-run still never reserves it; a real import rechecks global id availability.
      allOf:
        - if:
            properties:
              errors: { minItems: 1 }
          then:
            properties:
              added: { maxItems: 0 }
              modified: { maxItems: 0 }
              removed: { maxItems: 0 }
              errors: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
      properties:
        added:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EntityChange" }
              - type: object
                properties:
                  change: { const: added }
        modified:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EntityChange" }
              - type: object
                properties:
                  change: { const: modified }
        removed:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EntityChange" }
              - type: object
                properties:
                  change: { const: removed }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    EntityChange:
      type: object
      required: [kind, id, label, change]
      properties:
        kind: { type: string, enum: [services, routes, consumers, keyauth_credentials, jwt_secrets, basicauth_credentials, acls, plugins, upstreams, targets, certificates] }
        id: { type: string, format: uuid }
        label: { type: string }
        change: { type: string, enum: [added, removed, modified] }
        before: { type: object }
        after: { type: object }
    PublishPreview:
      type: object
      required: [currentVersion, draftHash, hasChanges, changes]
      properties:
        currentVersion: { type: [integer, "null"] }
        draftHash: { type: string }
        hasChanges: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/EntityChange" } }
    PublishRequest:
      type: object
      properties:
        message: { type: string, maxLength: 500 }
        expectedCurrentVersion:
          type: [integer, "null"]
          description: Optimistic check; omit to skip it, null means "nothing published yet".
    SnapshotSummary:
      type: object
      required: [version, hash, createdAt, createdBy, isCurrent]
      properties:
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        rollbackOf: { type: [integer, "null"], description: Version restored by this publish }
        isCurrent: { type: boolean }
        changeCount: { type: integer }
    SnapshotPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SnapshotSummary" } }
        nextCursor: { type: [string, "null"] }
    ClusterNode:
      type: object
      required: [nodeId, hostname, state, kongHealthy, lastSeenAt, online]
      properties:
        nodeId: { type: string }
        hostname: { type: string }
        kongVersion: { type: string }
        agentVersion: { type: string }
        state: { type: string, enum: [applying, applied, failed, idle] }
        appliedVersion: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        kongHealthy: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        online:
          type: boolean
          description: lastSeenAt within 3 heartbeat intervals
    Cluster:
      type: object
      required: [id, environmentId, name, status, nodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/Name" }
        status:
          type: string
          enum: [no-nodes, converged, converging, degraded]
          description: converged = every online node applied the current version
        nodes: { type: array, items: { $ref: "#/components/schemas/ClusterNode" } }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, at, actor, action, entityType]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, system, agent] }
            id: { type: string }
            name: { type: string }
            via: { type: string, enum: [session, token], description: How a user authenticated; absent for system and agent }
            tokenId: { type: string, format: uuid, description: Present when `via` is token }
            tokenName: { type: string, description: Present when `via` is token }
        action:
          type: string
          example: route.update
          description: "<entity>.<create|update|delete> | snapshot.publish | snapshot.rollback | auth.login | cluster.rotate-token"
        environmentId: { type: [string, "null"], format: uuid }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        ip:
          type: [string, "null"]
          description: Client address of the request behind the event (see "Client address" in the API description); null when there was no request.
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }
    TrafficStats:
      type: object
      required: [requests, errors4xx, errors5xx, errorRate, p50Ms, p95Ms, p99Ms]
      properties:
        requests: { type: integer, minimum: 0 }
        errors4xx: { type: integer, minimum: 0 }
        errors5xx: { type: integer, minimum: 0 }
        errorRate: { type: number, minimum: 0, maximum: 1, description: "(errors4xx + errors5xx) / requests; 0 without traffic" }
        p50Ms: { type: [number, "null"], description: Null without traffic }
        p95Ms: { type: [number, "null"] }
        p99Ms: { type: [number, "null"] }
    AnalyticsSummary:
      type: object
      required: [from, to, interval, totals, series]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval: { type: string, enum: [1m, 5m, 15m, 1h, 1d] }
        totals: { $ref: "#/components/schemas/TrafficStats" }
        series:
          type: array
          description: One point per bucket from `from` (inclusive) to `to` (exclusive), oldest first
          items:
            allOf:
              - type: object
                required: [ts]
                properties:
                  ts: { type: string, format: date-time, description: Start of the bucket }
              - { $ref: "#/components/schemas/TrafficStats" }
    TopRoutes:
      type: object
      required: [from, to, by, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        by: { type: string, enum: [requests, errors, p95] }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/TopRoute" }
    TopRoute:
      allOf:
        - type: object
          required: [routeId, routeName, serviceId]
          properties:
            routeId: { type: [string, "null"], format: uuid, description: Null for traffic that matched no route }
            routeName: { type: [string, "null"], description: Current name in the control plane; null when the route was deleted or no route matched }
            serviceId: { type: [string, "null"], format: uuid }
        - { $ref: "#/components/schemas/TrafficStats" }
    RequestRecord:
      type: object
      required: [id, ts, environmentId, clusterId, serviceId, routeId, consumerId, method, path, status, latencyKongMs, latencyUpstreamMs, latencyTotalMs, clientIp, requestSize, responseSize]
      properties:
        id: { type: string, format: uuid, description: Assigned by the pipeline; makes the cursor stable }
        ts: { type: string, format: date-time }
        environmentId: { type: string, format: uuid }
        clusterId: { type: string, format: uuid }
        serviceId: { type: [string, "null"], format: uuid, description: Null when no route matched }
        routeId: { type: [string, "null"], format: uuid }
        consumerId: { type: [string, "null"], format: uuid, description: Null for anonymous traffic }
        method: { type: string }
        path: { type: string, description: Request path without the query string }
        status: { type: integer, minimum: 100, maximum: 599 }
        latencyKongMs: { type: integer, minimum: 0 }
        latencyUpstreamMs: { type: [integer, "null"], minimum: 0, description: Null when the request never reached an upstream }
        latencyTotalMs: { type: integer, minimum: 0 }
        clientIp:
          type: string
          description: |
            The client address as the gateway saw it: the TCP peer, or, when the data plane trusts the peer
            (`kong.trustedIps`) and names a header (`kong.realIpHeader`), that header's value.
            Full address for admins only. Viewers and editors get it masked: IPv4 with the last octet zeroed
            (203.0.113.10 → 203.0.113.0), IPv6 truncated to its /48 (2001:db8:1234:5678::1 → 2001:db8:1234::).
        requestSize: { type: integer, minimum: 0, description: Bytes }
        responseSize: { type: integer, minimum: 0, description: Bytes }
    RequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RequestRecord" } }
        nextCursor: { type: [string, "null"] }
