openapi: 3.1.0
info:
  title: Gromesh Gateway — Control plane API
  version: 0.1.0
  description: |
    API consumed by the Gromesh UI (and later by CLI/automation). Kong is never called from here;
    changes reach the data planes only through published snapshots (see agent-protocol.openapi.yaml).

    Conventions:
      - JSON in camelCase; ids are UUIDs generated by the control plane.
      - Lists are cursor-paginated: `?limit=50&cursor=<opaque>` → `{ items, nextCursor }`.
      - Errors are RFC 9457 problem details (`application/problem+json`).
      - `x-required-role` is the minimum role: viewer < editor < admin. Enforced by the API, not only by the UI.
      - Every mutation is written to the audit log in the same transaction.
      - Edits change the environment's draft state. Traffic only changes after a publish
        (or automatically when the environment has `publishMode: auto`).
      - Authentication is a session cookie set by `POST /auth/login` (`httpOnly; Secure; SameSite=Strict`).
        Every mutation also needs the `X-CSRF-Token` header, obtained from `GET /auth/csrf`; a missing or
        wrong token is a 403. Agents authenticate differently (see agent-protocol.openapi.yaml).
      - Secrets are write-only: credential keys and `encrypted` plugin fields read back as `"REDACTED"`
        for every role. Only the agent endpoint delivers the real values.
servers:
  - url: http://localhost:3000/api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: users
  - name: environments
  - name: services
  - name: routes
  - name: consumers
  - name: plugins
  - name: snapshots
  - name: clusters
  - name: audit
  - name: analytics
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      description: |
        Starts a session. The session id travels only in the `gromesh_session` cookie; the body never carries a token.
        Repeated failures for the same e-mail or client address answer 429 with `Retry-After`.
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`gromesh_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Strict`"
              schema: { type: string }
              example: "gromesh_session=example-session-id; Path=/; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
              example: {"user": {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "email": "editor@gromesh.dev", "name": "Ana Editora", "role": "editor", "active": true, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: viewer
      description: Ends the session and clears the cookie. Idempotent.
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema: { type: string }
              example: "gromesh_session=; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=0"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      x-required-role: viewer
      description: |
        Token bound to the current session, to send as `X-CSRF-Token` on every mutation. Stable for the session's
        lifetime; the client keeps it in memory, never in storage.
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
              example: {"csrfToken": "example-csrf-token"}
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      x-required-role: viewer
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "email": "editor@gromesh.dev", "name": "Ana Editora", "role": "editor", "active": true, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      x-required-role: admin
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [users]
      operationId: updateUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [users]
      operationId: deleteUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      x-required-role: viewer
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
              example: {"items": [{"id": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "name": "producao", "description": "Tráfego de produção", "publishMode": "manual", "currentVersion": 3, "hasUnpublishedChanges": true, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}]}
    post:
      tags: [environments]
      operationId: createEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [environments]
      operationId: getEnvironment
      x-required-role: viewer
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
              example: {"id": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "name": "producao", "description": "Tráfego de produção", "publishMode": "manual", "currentVersion": 3, "hasUnpublishedChanges": true, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [environments]
      operationId: updateEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      description: Refused with 409 while clusters are registered.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{envId}/services:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [services]
      operationId: listServices
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePage" }
              example: {"items": [{"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080, "path": null, "enabled": true, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}], "nextCursor": null}
    post:
      tags: [services]
      operationId: createService
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
              example: {"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080, "path": null, "enabled": true, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/services/{serviceId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ServiceId" }]
    get:
      tags: [services]
      operationId: getService
      x-required-role: viewer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
              example: {"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080, "path": null, "enabled": true, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [services]
      operationId: replaceService
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
              example: {"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080, "path": null, "enabled": true, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [services]
      operationId: deleteService
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      description: Refused with 409 while routes or plugins reference the service.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{envId}/routes:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [routes]
      operationId: listRoutes
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutePage" }
              example: {"items": [{"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "serviceId": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "protocols": ["http", "https"], "paths": ["/orders"], "stripPath": true, "preserveHost": false, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}], "nextCursor": null}
    post:
      tags: [routes]
      operationId: createRoute
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
              example: {"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "serviceId": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "protocols": ["http", "https"], "paths": ["/orders"], "stripPath": true, "preserveHost": false, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/routes/{routeId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/RouteId" }]
    get:
      tags: [routes]
      operationId: getRoute
      x-required-role: viewer
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
              example: {"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "serviceId": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "protocols": ["http", "https"], "paths": ["/orders"], "stripPath": true, "preserveHost": false, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [routes]
      operationId: replaceRoute
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
              example: {"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "serviceId": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "protocols": ["http", "https"], "paths": ["/orders"], "stripPath": true, "preserveHost": false, "tags": [], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [routes]
      operationId: deleteRoute
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      responses:
        "204": { description: Deleted (route-scoped plugins are deleted with it) }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/consumers:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [consumers]
      operationId: listConsumers
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Consumers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPage" }
    post:
      tags: [consumers]
      operationId: createConsumer
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumerWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/consumers/{consumerId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ConsumerId" }]
    get:
      tags: [consumers]
      operationId: getConsumer
      x-required-role: viewer
      responses:
        "200":
          description: Consumer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [consumers]
      operationId: replaceConsumer
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumerWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [consumers]
      operationId: deleteConsumer
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      responses:
        "204": { description: Deleted (credentials and consumer-scoped plugins are deleted with it) }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/consumers/{consumerId}/key-auth:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ConsumerId" }]
    get:
      tags: [consumers]
      operationId: listKeyAuthCredentials
      x-required-role: viewer
      responses:
        "200":
          description: Credentials (keys are masked, only the last 4 characters are returned)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KeyAuthCredential" }
    post:
      tags: [consumers]
      operationId: createKeyAuthCredential
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      description: If `key` is omitted a random 32-byte key is generated. The full key is returned only in this response.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, minLength: 16 }
                tags: { $ref: "#/components/schemas/Tags" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/KeyAuthCredential" }
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: "Full key, shown once" }
        "409": { $ref: "#/components/responses/Conflict" }
  /environments/{envId}/consumers/{consumerId}/key-auth/{credentialId}:
    parameters:
      - { $ref: "#/components/parameters/EnvId" }
      - { $ref: "#/components/parameters/ConsumerId" }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [consumers]
      operationId: deleteKeyAuthCredential
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/plugins:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [plugins]
      operationId: listPlugins
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: serviceId, in: query, schema: { type: string, format: uuid } }
        - { name: routeId, in: query, schema: { type: string, format: uuid } }
        - { name: consumerId, in: query, schema: { type: string, format: uuid } }
        - { name: global, in: query, description: Only plugins with no scope, schema: { type: boolean } }
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginPage" }
    post:
      tags: [plugins]
      operationId: createPlugin
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      description: "`config` is validated against the plugin schema of the Kong version pinned by the platform."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/plugins/{pluginId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/PluginId" }]
    get:
      tags: [plugins]
      operationId: getPlugin
      x-required-role: viewer
      responses:
        "200":
          description: Plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [plugins]
      operationId: replacePlugin
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [plugins]
      operationId: deletePlugin
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /plugin-schemas:
    get:
      tags: [plugins]
      operationId: listPluginSchemas
      x-required-role: viewer
      description: Plugins available on the pinned Kong version (bundled + custom), with display metadata.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [kongVersion, items]
                properties:
                  kongVersion: { type: string, example: "3.9.4" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PluginCatalogEntry" }
  /plugin-schemas/{pluginName}:
    parameters:
      - name: pluginName
        in: path
        required: true
        schema: { type: string, example: rate-limiting }
    get:
      tags: [plugins]
      operationId: getPluginSchema
      x-required-role: viewer
      description: Raw Kong schema (as returned by Kong's GET /schemas/plugins/{name}) used by the UI to render forms.
      responses:
        "200":
          description: Kong plugin schema
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/publish-preview:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: previewPublish
      x-required-role: viewer
      description: Compiles the draft and diffs it against the current snapshot. 422 lists compile issues.
      responses:
        "200":
          description: What a publish would change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishPreview" }
              example: {"currentVersion": 3, "draftHash": "sha256:4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f", "hasChanges": true, "changes": [{"kind": "services", "id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "label": "orders", "change": "added", "after": {"id": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "name": "orders", "protocol": "http", "host": "orders.internal", "port": 8080}}, {"kind": "routes", "id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "label": "orders-api", "change": "added", "after": {"id": "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d", "name": "orders-api", "service": "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", "paths": ["/orders"]}}]}
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/snapshots:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: listSnapshots
      x-required-role: viewer
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
    post:
      tags: [snapshots]
      operationId: publish
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      description: |
        Compiles the draft, stores it as version N+1 and notifies agents.
        Returns 409 if the draft hash equals the current snapshot (nothing to publish)
        or if `expectedCurrentVersion` is stale.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
              example: {"version": 4, "hash": "sha256:4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f", "message": "Adiciona orders", "createdAt": "2026-10-15T12:00:00Z", "createdBy": {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "name": "Ana Editora"}, "rollbackOf": null, "isCurrent": true}
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/snapshots/{version}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: getSnapshot
      x-required-role: viewer
      description: |
        Full envelope with credential keys and `encrypted` plugin fields replaced by `"REDACTED"`, for every role
        including admin. Only the agent endpoint (`GET /agent/v1/snapshots/current`) delivers the real values.
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "./snapshot.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/diff:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: diffSnapshot
      x-required-role: viewer
      parameters:
        - name: against
          in: query
          description: Version to compare with (default = version - 1)
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Entity-level changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EntityChange" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/rollback:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    post:
      tags: [snapshots]
      operationId: rollback
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: editor
      description: Restores the draft to this version's state and publishes it as a NEW version.
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Target has the same configuration as the current version

  /environments/{envId}/clusters:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [clusters]
      operationId: listClusters
      x-required-role: viewer
      responses:
        "200":
          description: Clusters with node status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
    post:
      tags: [clusters]
      operationId: createCluster
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "201":
          description: Created. `registrationToken` is shown only here.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Cluster" }
                  - type: object
                    required: [registrationToken]
                    properties:
                      registrationToken: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
  /clusters/{clusterId}:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [clusters]
      operationId: getCluster
      x-required-role: viewer
      responses:
        "200":
          description: Cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [clusters]
      operationId: deleteCluster
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      description: Revokes registration and node tokens.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /clusters/{clusterId}/rotate-token:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    post:
      tags: [clusters]
      operationId: rotateClusterToken
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      description: New registration token; already-registered nodes keep working.
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [registrationToken]
                properties:
                  registrationToken: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Audit events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /environments/{envId}/analytics/summary:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: getAnalyticsSummary
      x-required-role: viewer
      description: |
        Traffic of the environment as seen by its gateways, from the `requests` table fed by the observability
        pipeline (7 days of retention). Totals for the period plus one point per `interval`; a bucket with no
        traffic is present with zero requests and null latencies. Latencies are total request time in ms.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - name: interval
          in: query
          schema: { type: string, enum: [1m, 5m, 15m, 1h, 1d], default: 5m }
          description: Bucket size; the period may hold at most 2000 buckets.
        - { $ref: "#/components/parameters/RouteFilter" }
        - { $ref: "#/components/parameters/ServiceFilter" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
              example:
                from: "2026-10-15T12:00:00Z"
                to: "2026-10-15T12:10:00Z"
                interval: 5m
                totals: { requests: 1250, errors4xx: 40, errors5xx: 3, errorRate: 0.0344, p50Ms: 12.4, p95Ms: 48.9, p99Ms: 120.0 }
                series:
                  - { ts: "2026-10-15T12:00:00Z", requests: 600, errors4xx: 18, errors5xx: 1, errorRate: 0.0317, p50Ms: 11.8, p95Ms: 45.2, p99Ms: 98.0 }
                  - { ts: "2026-10-15T12:05:00Z", requests: 650, errors4xx: 22, errors5xx: 2, errorRate: 0.0369, p50Ms: 13.0, p95Ms: 52.1, p99Ms: 131.5 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
  /environments/{envId}/analytics/top-routes:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: getTopRoutes
      x-required-role: viewer
      description: |
        The routes with the most traffic, the most errors or the slowest p95 over the period, from the same
        `requests` table as the summary (same 7-day limit). Traffic that matched no route is one row with null
        `routeId` and `serviceId`. Ordered by the chosen criterion descending, ties by `requests` descending then
        `routeId`.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - name: by
          in: query
          schema: { type: string, enum: [requests, errors, p95], default: requests }
          description: |
            `requests`: request count; `errors`: 4xx plus 5xx responses; `p95`: p95 of the total latency (routes
            without latency data come last).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Top routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopRoutes" }
              example:
                from: "2026-10-15T12:00:00Z"
                to: "2026-10-15T12:10:00Z"
                by: requests
                items:
                  - { routeId: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f", routeName: orders, serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", requests: 900, errors4xx: 30, errors5xx: 2, errorRate: 0.0356, p50Ms: 12.1, p95Ms: 47.0, p99Ms: 118.0 }
                  - { routeId: "8e1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b", routeName: null, serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c", requests: 300, errors4xx: 10, errors5xx: 1, errorRate: 0.0367, p50Ms: 13.4, p95Ms: 55.2, p99Ms: 140.0 }
                  - { routeId: null, routeName: null, serviceId: null, requests: 50, errors4xx: 50, errors5xx: 0, errorRate: 1, p50Ms: 0.4, p95Ms: 0.9, p99Ms: 1.2 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }
  /environments/{envId}/requests:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [analytics]
      operationId: listRequests
      x-required-role: viewer
      description: |
        Request explorer over the same `requests` table, newest first. Credentials never reach the table (the
        pipeline strips them), so a record carries no header or query values: only the path. `clientIp` is
        masked for every role but admin.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsFrom" }
        - { $ref: "#/components/parameters/AnalyticsTo" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: status
          in: query
          schema: { type: integer, minimum: 100, maximum: 599 }
          description: Exact status code; mutually exclusive with `statusClass`.
        - name: statusClass
          in: query
          schema: { type: string, enum: [2xx, 3xx, 4xx, 5xx] }
        - { $ref: "#/components/parameters/RouteFilter" }
        - { $ref: "#/components/parameters/ServiceFilter" }
        - { name: consumerId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
              example:
                items:
                  - id: "7a1d0c2e-5b3f-4e6a-9c8d-0f1e2d3c4b5a"
                    ts: "2026-10-15T12:04:58.123Z"
                    environmentId: "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11"
                    clusterId: "9d7c5a3b-1e2f-4a6b-8c9d-0e1f2a3b4c5d"
                    serviceId: "6f1d2c3b-4a5e-4f60-8b7c-1d2e3f4a5b6c"
                    routeId: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f"
                    consumerId: "0b7c3c1e-1f2a-4f7e-9c41-0d3c1b2a9e11"
                    method: GET
                    path: /orders/42
                    status: 200
                    latencyKongMs: 1
                    latencyUpstreamMs: 11
                    latencyTotalMs: 12
                    clientIp: "203.0.113.0"
                    requestSize: 312
                    responseSize: 1804
                nextCursor: null
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/AnalyticsUnavailable" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gromesh_session
      description: Session cookie set by `POST /auth/login`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value of `GET /auth/csrf`, required together with the session cookie on every mutation.
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Search:
      name: q
      in: query
      description: Case-insensitive match on name (and paths/hosts for routes)
      schema: { type: string }
    EnvId:
      name: envId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnalyticsFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: Start of the period (inclusive). The period may span at most 7 days, the table's retention.
    AnalyticsTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: End of the period (exclusive); must be after `from`.
    RouteFilter:
      name: routeId
      in: query
      schema: { type: string, format: uuid }
    ServiceFilter:
      name: serviceId
      in: query
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role too low, or missing/invalid `X-CSRF-Token` on a mutation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AnalyticsUnavailable:
      description: The analytics store (ClickHouse) is unreachable or not configured
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          example: 60
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Uniqueness, reference or version conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Invalid payload or compile issues (`errors[]` carries paths)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    Name:
      type: string
      pattern: "^[A-Za-z0-9._~-]+$"
      maxLength: 128
    Tags:
      type: array
      items: { type: string, maxLength: 128 }
      maxItems: 32
    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [viewer, editor, admin]
    User:
      allOf:
        - type: object
          required: [id, email, name, role, active]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string }
            role: { $ref: "#/components/schemas/Role" }
            active: { type: boolean }
        - { $ref: "#/components/schemas/Timestamps" }
    UserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, format: password, minLength: 12 }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        password: { type: string, format: password, minLength: 12 }
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        nextCursor: { type: [string, "null"] }
    Environment:
      allOf:
        - type: object
          required: [id, name, publishMode, currentVersion, hasUnpublishedChanges]
          properties:
            id: { type: string, format: uuid }
            name: { $ref: "#/components/schemas/Name" }
            description: { type: [string, "null"] }
            publishMode: { type: string, enum: [manual, auto] }
            currentVersion: { type: [integer, "null"] }
            hasUnpublishedChanges: { type: boolean }
        - { $ref: "#/components/schemas/Timestamps" }
    EnvironmentWrite:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        description: { type: [string, "null"] }
        publishMode: { type: string, enum: [manual, auto], default: manual }
    ServiceWrite:
      type: object
      required: [name, protocol, host, port]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        protocol: { type: string, enum: [http, https, grpc, grpcs, tcp, tls] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: [string, "null"], pattern: "^/" }
        retries: { type: integer, minimum: 0, maximum: 32767 }
        connectTimeoutMs: { type: integer, minimum: 1 }
        readTimeoutMs: { type: integer, minimum: 1 }
        writeTimeoutMs: { type: integer, minimum: 1 }
        enabled: { type: boolean, default: true }
        tags: { $ref: "#/components/schemas/Tags" }
    Service:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ServiceWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        nextCursor: { type: [string, "null"] }
    RouteWrite:
      type: object
      required: [name, serviceId]
      description: At least one of paths, hosts, methods or headers is required.
      properties:
        name: { $ref: "#/components/schemas/Name" }
        serviceId: { type: string, format: uuid }
        protocols:
          type: array
          items: { type: string, enum: [http, https, grpc, grpcs] }
          default: [http, https]
        methods: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string } }
        paths: { type: array, items: { type: string } }
        headers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        stripPath: { type: boolean, default: true }
        preserveHost: { type: boolean, default: false }
        tags: { $ref: "#/components/schemas/Tags" }
    Route:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/RouteWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    RoutePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Route" } }
        nextCursor: { type: [string, "null"] }
    ConsumerWrite:
      type: object
      description: username or customId is required.
      properties:
        username: { type: [string, "null"] }
        customId: { type: [string, "null"] }
        tags: { $ref: "#/components/schemas/Tags" }
    Consumer:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ConsumerWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ConsumerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Consumer" } }
        nextCursor: { type: [string, "null"] }
    KeyAuthCredential:
      type: object
      required: [id, consumerId, keyHint, createdAt]
      properties:
        id: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        keyHint: { type: string, description: Last 4 characters, example: "…k123" }
        tags: { $ref: "#/components/schemas/Tags" }
        createdAt: { type: string, format: date-time }
    PluginScope:
      type: object
      description: Empty scope = global plugin.
      properties:
        serviceId: { type: [string, "null"], format: uuid }
        routeId: { type: [string, "null"], format: uuid }
        consumerId: { type: [string, "null"], format: uuid }
    PluginWrite:
      type: object
      required: [name, config]
      properties:
        name: { type: string, example: rate-limiting }
        enabled: { type: boolean, default: true }
        scope: { $ref: "#/components/schemas/PluginScope" }
        config: { type: object }
        protocols: { type: array, items: { type: string } }
        tags: { $ref: "#/components/schemas/Tags" }
    Plugin:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/PluginWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    PluginPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
        nextCursor: { type: [string, "null"] }
    PluginCatalogEntry:
      type: object
      required: [name, category, source]
      properties:
        name: { type: string }
        category:
          type: string
          enum: [authentication, security, traffic-control, transformation, logging, observability, serverless, ai, other]
        source: { type: string, enum: [bundled, custom] }
        supportedInDbless:
          type: boolean
          description: False for plugins that need Kong's database (e.g. oauth2).
    EntityChange:
      type: object
      required: [kind, id, label, change]
      properties:
        kind: { type: string, enum: [services, routes, consumers, keyauth_credentials, plugins] }
        id: { type: string, format: uuid }
        label: { type: string }
        change: { type: string, enum: [added, removed, modified] }
        before: { type: object }
        after: { type: object }
    PublishPreview:
      type: object
      required: [currentVersion, draftHash, hasChanges, changes]
      properties:
        currentVersion: { type: [integer, "null"] }
        draftHash: { type: string }
        hasChanges: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/EntityChange" } }
    PublishRequest:
      type: object
      properties:
        message: { type: string, maxLength: 500 }
        expectedCurrentVersion:
          type: [integer, "null"]
          description: Optimistic check; omit to skip it, null means "nothing published yet".
    SnapshotSummary:
      type: object
      required: [version, hash, createdAt, createdBy, isCurrent]
      properties:
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        rollbackOf: { type: [integer, "null"], description: Version restored by this publish }
        isCurrent: { type: boolean }
        changeCount: { type: integer }
    SnapshotPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SnapshotSummary" } }
        nextCursor: { type: [string, "null"] }
    ClusterNode:
      type: object
      required: [nodeId, hostname, state, kongHealthy, lastSeenAt, online]
      properties:
        nodeId: { type: string }
        hostname: { type: string }
        kongVersion: { type: string }
        agentVersion: { type: string }
        state: { type: string, enum: [applying, applied, failed, idle] }
        appliedVersion: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        kongHealthy: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        online:
          type: boolean
          description: lastSeenAt within 3 heartbeat intervals
    Cluster:
      type: object
      required: [id, environmentId, name, status, nodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/Name" }
        status:
          type: string
          enum: [no-nodes, converged, converging, degraded]
          description: converged = every online node applied the current version
        nodes: { type: array, items: { $ref: "#/components/schemas/ClusterNode" } }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, at, actor, action, entityType]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, system, agent] }
            id: { type: string }
            name: { type: string }
        action:
          type: string
          example: route.update
          description: "<entity>.<create|update|delete> | snapshot.publish | snapshot.rollback | auth.login | cluster.rotate-token"
        environmentId: { type: [string, "null"], format: uuid }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        ip: { type: [string, "null"] }
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }
    TrafficStats:
      type: object
      required: [requests, errors4xx, errors5xx, errorRate, p50Ms, p95Ms, p99Ms]
      properties:
        requests: { type: integer, minimum: 0 }
        errors4xx: { type: integer, minimum: 0 }
        errors5xx: { type: integer, minimum: 0 }
        errorRate: { type: number, minimum: 0, maximum: 1, description: "(errors4xx + errors5xx) / requests; 0 without traffic" }
        p50Ms: { type: [number, "null"], description: Null without traffic }
        p95Ms: { type: [number, "null"] }
        p99Ms: { type: [number, "null"] }
    AnalyticsSummary:
      type: object
      required: [from, to, interval, totals, series]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval: { type: string, enum: [1m, 5m, 15m, 1h, 1d] }
        totals: { $ref: "#/components/schemas/TrafficStats" }
        series:
          type: array
          description: One point per bucket from `from` (inclusive) to `to` (exclusive), oldest first
          items:
            allOf:
              - type: object
                required: [ts]
                properties:
                  ts: { type: string, format: date-time, description: Start of the bucket }
              - { $ref: "#/components/schemas/TrafficStats" }
    TopRoutes:
      type: object
      required: [from, to, by, items]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        by: { type: string, enum: [requests, errors, p95] }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/TopRoute" }
    TopRoute:
      allOf:
        - type: object
          required: [routeId, routeName, serviceId]
          properties:
            routeId: { type: [string, "null"], format: uuid, description: Null for traffic that matched no route }
            routeName: { type: [string, "null"], description: Current name in the control plane; null when the route was deleted or no route matched }
            serviceId: { type: [string, "null"], format: uuid }
        - { $ref: "#/components/schemas/TrafficStats" }
    RequestRecord:
      type: object
      required: [id, ts, environmentId, clusterId, serviceId, routeId, consumerId, method, path, status, latencyKongMs, latencyUpstreamMs, latencyTotalMs, clientIp, requestSize, responseSize]
      properties:
        id: { type: string, format: uuid, description: Assigned by the pipeline; makes the cursor stable }
        ts: { type: string, format: date-time }
        environmentId: { type: string, format: uuid }
        clusterId: { type: string, format: uuid }
        serviceId: { type: [string, "null"], format: uuid, description: Null when no route matched }
        routeId: { type: [string, "null"], format: uuid }
        consumerId: { type: [string, "null"], format: uuid, description: Null for anonymous traffic }
        method: { type: string }
        path: { type: string, description: Request path without the query string }
        status: { type: integer, minimum: 100, maximum: 599 }
        latencyKongMs: { type: integer, minimum: 0 }
        latencyUpstreamMs: { type: [integer, "null"], minimum: 0, description: Null when the request never reached an upstream }
        latencyTotalMs: { type: integer, minimum: 0 }
        clientIp:
          type: string
          description: |
            Full address for admins only. Viewers and editors get it masked: IPv4 with the last octet zeroed
            (203.0.113.10 → 203.0.113.0), IPv6 truncated to its /48 (2001:db8:1234:5678::1 → 2001:db8:1234::).
        requestSize: { type: integer, minimum: 0, description: Bytes }
        responseSize: { type: integer, minimum: 0, description: Bytes }
    RequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RequestRecord" } }
        nextCursor: { type: [string, "null"] }
