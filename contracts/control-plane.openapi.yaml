  /environments/{envId}/certificates:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [certificates]
      operationId: listCertificates
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Certificates; `key` is always "REDACTED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificatePage" }
              example: {"items": [{"id": "0c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f", "cert": "-----BEGIN CERTIFICATE-----\nMIIBszCCAVmgAwIBAgIUExample\n-----END CERTIFICATE-----\n", "key": "REDACTED", "snis": ["api.example.com", "*.example.com"], "tags": [], "subject": "CN=api.example.com", "issuer": "CN=Example CA", "notBefore": "2026-10-01T00:00:00Z", "notAfter": "2027-10-01T00:00:00Z", "fingerprintSha256": "3A:7F:1C:9D:4E:2B:8A:6F:0D:5C:1E:9B:7A:3F:2D:8C:6E:4B:1A:9F:0C:7D:5E:3B:2A:8F:6C:4D:1B:9E:0F:7A", "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}], "nextCursor": null}
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [certificates]
      operationId: createCertificate
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: editor
      description: |
        A TLS certificate with its private key and the server names (SNIs) it answers. `cert` may be a PEM chain, leaf
        first then intermediates; the whole chain is served. The key is checked against the leaf, and `subject`,
        `issuer`, `notBefore`, `notAfter` and `fingerprintSha256` describe the leaf. The key is write-only: it is
        stored encrypted and reads back as "REDACTED". 422 with `path`: `cert` when it is not a PEM certificate chain or
        its leaf has expired; `key` when it is not a PEM private key, does not match the leaf, or is "REDACTED" here;
        `snis.<i>` when a name is repeated in the request or has a wildcard anywhere but as the `*.` prefix. 409 when a
        name already belongs to another certificate of the instance (any environment; the message never names it).
        Expiry is judged only when `cert` is created or replaced: publishing, rolling back and editing only the `snis`
        of a certificate that has since expired keep working.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertificateWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
              example: {"id": "0c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f", "cert": "-----BEGIN CERTIFICATE-----\nMIIBszCCAVmgAwIBAgIUExample\n-----END CERTIFICATE-----\n", "key": "REDACTED", "snis": ["api.example.com", "*.example.com"], "tags": [], "subject": "CN=api.example.com", "issuer": "CN=Example CA", "notBefore": "2026-10-01T00:00:00Z", "notAfter": "2027-10-01T00:00:00Z", "fingerprintSha256": "3A:7F:1C:9D:4E:2B:8A:6F:0D:5C:1E:9B:7A:3F:2D:8C:6E:4B:1A:9F:0C:7D:5E:3B:2A:8F:6C:4D:1B:9E:0F:7A", "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/certificates/{certificateId}:
