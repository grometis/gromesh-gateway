openapi: 3.1.0
info:
  title: Gromesh Gateway — Control plane API
  version: 0.1.0
  description: |
    API consumed by the Gromesh UI (and later by CLI/automation). Kong is never called from here;
    changes reach the data planes only through published snapshots (see agent-protocol.openapi.yaml).

    Conventions:
      - JSON in camelCase; ids are UUIDs generated by the control plane.
      - Lists are cursor-paginated: `?limit=50&cursor=<opaque>` → `{ items, nextCursor }`.
      - Errors are RFC 9457 problem details (`application/problem+json`).
      - `x-required-role` is the minimum role: viewer < editor < admin. Enforced by the API, not only by the UI.
      - Every mutation is written to the audit log in the same transaction.
      - Edits change the environment's draft state. Traffic only changes after a publish
        (or automatically when the environment has `publishMode: auto`).
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: environments
  - name: services
  - name: routes
  - name: consumers
  - name: plugins
  - name: snapshots
  - name: clusters
  - name: audit
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: seconds }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      x-required-role: viewer
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      x-required-role: admin
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [users]
      operationId: updateUser
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [users]
      operationId: deleteUser
      x-required-role: admin
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      x-required-role: viewer
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
    post:
      tags: [environments]
      operationId: createEnvironment
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [environments]
      operationId: getEnvironment
      x-required-role: viewer
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [environments]
      operationId: updateEnvironment
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      x-required-role: admin
      description: Refused with 409 while clusters are registered.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{envId}/services:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [services]
      operationId: listServices
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePage" }
    post:
      tags: [services]
      operationId: createService
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/services/{serviceId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ServiceId" }]
    get:
      tags: [services]
      operationId: getService
      x-required-role: viewer
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [services]
      operationId: replaceService
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [services]
      operationId: deleteService
      x-required-role: editor
      description: Refused with 409 while routes or plugins reference the service.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{envId}/routes:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [routes]
      operationId: listRoutes
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
        - name: serviceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutePage" }
    post:
      tags: [routes]
      operationId: createRoute
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/routes/{routeId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/RouteId" }]
    get:
      tags: [routes]
      operationId: getRoute
      x-required-role: viewer
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [routes]
      operationId: replaceRoute
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [routes]
      operationId: deleteRoute
      x-required-role: editor
      responses:
        "204": { description: Deleted (route-scoped plugins are deleted with it) }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/consumers:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [consumers]
      operationId: listConsumers
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Search" }
      responses:
        "200":
          description: Consumers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPage" }
    post:
      tags: [consumers]
      operationId: createConsumer
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumerWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/consumers/{consumerId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ConsumerId" }]
    get:
      tags: [consumers]
      operationId: getConsumer
      x-required-role: viewer
      responses:
        "200":
          description: Consumer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [consumers]
      operationId: replaceConsumer
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumerWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [consumers]
      operationId: deleteConsumer
      x-required-role: editor
      responses:
        "204": { description: Deleted (credentials and consumer-scoped plugins are deleted with it) }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/consumers/{consumerId}/key-auth:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/ConsumerId" }]
    get:
      tags: [consumers]
      operationId: listKeyAuthCredentials
      x-required-role: viewer
      responses:
        "200":
          description: Credentials (keys are masked, only the last 4 characters are returned)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KeyAuthCredential" }
    post:
      tags: [consumers]
      operationId: createKeyAuthCredential
      x-required-role: editor
      description: If `key` is omitted a random 32-byte key is generated. The full key is returned only in this response.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, minLength: 16 }
                tags: { $ref: "#/components/schemas/Tags" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/KeyAuthCredential" }
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: "Full key, shown once" }
        "409": { $ref: "#/components/responses/Conflict" }
  /environments/{envId}/consumers/{consumerId}/key-auth/{credentialId}:
    parameters:
      - { $ref: "#/components/parameters/EnvId" }
      - { $ref: "#/components/parameters/ConsumerId" }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [consumers]
      operationId: deleteKeyAuthCredential
      x-required-role: editor
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/plugins:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [plugins]
      operationId: listPlugins
      x-required-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: serviceId, in: query, schema: { type: string, format: uuid } }
        - { name: routeId, in: query, schema: { type: string, format: uuid } }
        - { name: consumerId, in: query, schema: { type: string, format: uuid } }
        - { name: global, in: query, description: Only plugins with no scope, schema: { type: boolean } }
      responses:
        "200":
          description: Plugins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginPage" }
    post:
      tags: [plugins]
      operationId: createPlugin
      x-required-role: editor
      description: "`config` is validated against the plugin schema of the Kong version pinned by the platform."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/plugins/{pluginId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/PluginId" }]
    get:
      tags: [plugins]
      operationId: getPlugin
      x-required-role: viewer
      responses:
        "200":
          description: Plugin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [plugins]
      operationId: replacePlugin
      x-required-role: editor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginWrite" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [plugins]
      operationId: deletePlugin
      x-required-role: editor
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /plugin-schemas:
    get:
      tags: [plugins]
      operationId: listPluginSchemas
      x-required-role: viewer
      description: Plugins available on the pinned Kong version (bundled + custom), with display metadata.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [kongVersion, items]
                properties:
                  kongVersion: { type: string, example: "3.9.4" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PluginCatalogEntry" }
  /plugin-schemas/{pluginName}:
    parameters:
      - name: pluginName
        in: path
        required: true
        schema: { type: string, example: rate-limiting }
    get:
      tags: [plugins]
      operationId: getPluginSchema
      x-required-role: viewer
      description: Raw Kong schema (as returned by Kong's GET /schemas/plugins/{name}) used by the UI to render forms.
      responses:
        "200":
          description: Kong plugin schema
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/publish-preview:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: previewPublish
      x-required-role: viewer
      description: Compiles the draft and diffs it against the current snapshot. 422 lists compile issues.
      responses:
        "200":
          description: What a publish would change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishPreview" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/snapshots:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [snapshots]
      operationId: listSnapshots
      x-required-role: viewer
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
    post:
      tags: [snapshots]
      operationId: publish
      x-required-role: editor
      description: |
        Compiles the draft, stores it as version N+1 and notifies agents.
        Returns 409 if the draft hash equals the current snapshot (nothing to publish)
        or if `expectedCurrentVersion` is stale.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/snapshots/{version}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: getSnapshot
      x-required-role: viewer
      description: Full envelope. Credential keys are masked for non-admin roles.
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "./snapshot.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/diff:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    get:
      tags: [snapshots]
      operationId: diffSnapshot
      x-required-role: viewer
      parameters:
        - name: against
          in: query
          description: Version to compare with (default = version - 1)
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Entity-level changes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EntityChange" }
        "404": { $ref: "#/components/responses/NotFound" }
  /environments/{envId}/snapshots/{version}/rollback:
    parameters: [{ $ref: "#/components/parameters/EnvId" }, { $ref: "#/components/parameters/Version" }]
    post:
      tags: [snapshots]
      operationId: rollback
      x-required-role: editor
      description: Restores the draft to this version's state and publishes it as a NEW version.
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments/{envId}/clusters:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [clusters]
      operationId: listClusters
      x-required-role: viewer
      responses:
        "200":
          description: Clusters with node status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Cluster" }
    post:
      tags: [clusters]
      operationId: createCluster
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/Name" }
      responses:
        "201":
          description: Created. `registrationToken` is shown only here.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Cluster" }
                  - type: object
                    required: [registrationToken]
                    properties:
                      registrationToken: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
  /clusters/{clusterId}:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    get:
      tags: [clusters]
      operationId: getCluster
      x-required-role: viewer
      responses:
        "200":
          description: Cluster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [clusters]
      operationId: deleteCluster
      x-required-role: admin
      description: Revokes registration and node tokens.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /clusters/{clusterId}/rotate-token:
    parameters: [{ $ref: "#/components/parameters/ClusterId" }]
    post:
      tags: [clusters]
      operationId: rotateClusterToken
      x-required-role: admin
      description: New registration token; already-registered nodes keep working.
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [registrationToken]
                properties:
                  registrationToken: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Audit events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Search:
      name: q
      in: query
      description: Case-insensitive match on name (and paths/hosts for routes)
      schema: { type: string }
    EnvId:
      name: envId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role too low
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Uniqueness, reference or version conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Invalid payload or compile issues (`errors[]` carries paths)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    Name:
      type: string
      pattern: "^[A-Za-z0-9._~-]+$"
      maxLength: 128
    Tags:
      type: array
      items: { type: string, maxLength: 128 }
      maxItems: 32
    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: string
      enum: [viewer, editor, admin]
    User:
      allOf:
        - type: object
          required: [id, email, name, role, active]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string }
            role: { $ref: "#/components/schemas/Role" }
            active: { type: boolean }
        - { $ref: "#/components/schemas/Timestamps" }
    UserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, format: password, minLength: 12 }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        password: { type: string, format: password, minLength: 12 }
    UserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        nextCursor: { type: [string, "null"] }
    Environment:
      allOf:
        - type: object
          required: [id, name, publishMode, currentVersion, hasUnpublishedChanges]
          properties:
            id: { type: string, format: uuid }
            name: { $ref: "#/components/schemas/Name" }
            description: { type: [string, "null"] }
            publishMode: { type: string, enum: [manual, auto] }
            currentVersion: { type: [integer, "null"] }
            hasUnpublishedChanges: { type: boolean }
        - { $ref: "#/components/schemas/Timestamps" }
    EnvironmentWrite:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        description: { type: [string, "null"] }
        publishMode: { type: string, enum: [manual, auto], default: manual }
    ServiceWrite:
      type: object
      required: [name, protocol, host, port]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        protocol: { type: string, enum: [http, https, grpc, grpcs, tcp, tls] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: [string, "null"], pattern: "^/" }
        retries: { type: integer, minimum: 0, maximum: 32767 }
        connectTimeoutMs: { type: integer, minimum: 1 }
        readTimeoutMs: { type: integer, minimum: 1 }
        writeTimeoutMs: { type: integer, minimum: 1 }
        enabled: { type: boolean, default: true }
        tags: { $ref: "#/components/schemas/Tags" }
    Service:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ServiceWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ServicePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        nextCursor: { type: [string, "null"] }
    RouteWrite:
      type: object
      required: [name, serviceId]
      description: At least one of paths, hosts, methods or headers is required.
      properties:
        name: { $ref: "#/components/schemas/Name" }
        serviceId: { type: string, format: uuid }
        protocols:
          type: array
          items: { type: string, enum: [http, https, grpc, grpcs] }
          default: [http, https]
        methods: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string } }
        paths: { type: array, items: { type: string } }
        headers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        stripPath: { type: boolean, default: true }
        preserveHost: { type: boolean, default: false }
        tags: { $ref: "#/components/schemas/Tags" }
    Route:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/RouteWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    RoutePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Route" } }
        nextCursor: { type: [string, "null"] }
    ConsumerWrite:
      type: object
      description: username or customId is required.
      properties:
        username: { type: [string, "null"] }
        customId: { type: [string, "null"] }
        tags: { $ref: "#/components/schemas/Tags" }
    Consumer:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/ConsumerWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    ConsumerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Consumer" } }
        nextCursor: { type: [string, "null"] }
    KeyAuthCredential:
      type: object
      required: [id, consumerId, keyHint, createdAt]
      properties:
        id: { type: string, format: uuid }
        consumerId: { type: string, format: uuid }
        keyHint: { type: string, description: Last 4 characters, example: "…k123" }
        tags: { $ref: "#/components/schemas/Tags" }
        createdAt: { type: string, format: date-time }
    PluginScope:
      type: object
      description: Empty scope = global plugin.
      properties:
        serviceId: { type: [string, "null"], format: uuid }
        routeId: { type: [string, "null"], format: uuid }
        consumerId: { type: [string, "null"], format: uuid }
    PluginWrite:
      type: object
      required: [name, config]
      properties:
        name: { type: string, example: rate-limiting }
        enabled: { type: boolean, default: true }
        scope: { $ref: "#/components/schemas/PluginScope" }
        config: { type: object }
        protocols: { type: array, items: { type: string } }
        tags: { $ref: "#/components/schemas/Tags" }
    Plugin:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - { $ref: "#/components/schemas/PluginWrite" }
        - { $ref: "#/components/schemas/Timestamps" }
    PluginPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
        nextCursor: { type: [string, "null"] }
    PluginCatalogEntry:
      type: object
      required: [name, category, source]
      properties:
        name: { type: string }
        category:
          type: string
          enum: [authentication, security, traffic-control, transformation, logging, observability, serverless, ai, other]
        source: { type: string, enum: [bundled, custom] }
        supportedInDbless:
          type: boolean
          description: False for plugins that need Kong's database (e.g. oauth2).
    EntityChange:
      type: object
      required: [kind, id, label, change]
      properties:
        kind: { type: string, enum: [services, routes, consumers, keyauth_credentials, plugins] }
        id: { type: string, format: uuid }
        label: { type: string }
        change: { type: string, enum: [added, removed, modified] }
        before: { type: object }
        after: { type: object }
    PublishPreview:
      type: object
      required: [currentVersion, draftHash, hasChanges, changes]
      properties:
        currentVersion: { type: [integer, "null"] }
        draftHash: { type: string }
        hasChanges: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/EntityChange" } }
    PublishRequest:
      type: object
      properties:
        message: { type: string, maxLength: 500 }
        expectedCurrentVersion:
          type: [integer, "null"]
          description: Optimistic check; omit to skip it, null means "nothing published yet".
    SnapshotSummary:
      type: object
      required: [version, hash, createdAt, createdBy, isCurrent]
      properties:
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        rollbackOf: { type: [integer, "null"], description: Version restored by this publish }
        isCurrent: { type: boolean }
        changeCount: { type: integer }
    SnapshotPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SnapshotSummary" } }
        nextCursor: { type: [string, "null"] }
    ClusterNode:
      type: object
      required: [nodeId, hostname, state, kongHealthy, lastSeenAt, online]
      properties:
        nodeId: { type: string }
        hostname: { type: string }
        kongVersion: { type: string }
        agentVersion: { type: string }
        state: { type: string, enum: [applying, applied, failed, idle] }
        appliedVersion: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        kongHealthy: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        online:
          type: boolean
          description: lastSeenAt within 3 heartbeat intervals
    Cluster:
      type: object
      required: [id, environmentId, name, status, nodes, createdAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/Name" }
        status:
          type: string
          enum: [no-nodes, converged, converging, degraded]
          description: converged = every online node applied the current version
        nodes: { type: array, items: { $ref: "#/components/schemas/ClusterNode" } }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, at, actor, action, entityType]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, system, agent] }
            id: { type: string }
            name: { type: string }
        action:
          type: string
          example: route.update
          description: "<entity>.<create|update|delete> | snapshot.publish | snapshot.rollback | auth.login | cluster.rotate-token"
        environmentId: { type: [string, "null"], format: uuid }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        ip: { type: [string, "null"] }
    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }
