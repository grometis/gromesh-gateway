openapi: 3.1.0
info:
  title: Gromesh Gateway — Control plane API
  version: 0.1.0
  description: |
    API consumed by the Gromesh UI (and later by CLI/automation). Kong is never called from here;
    changes reach the data planes only through published snapshots (see agent-protocol.openapi.yaml).

    Conventions:
      - JSON in camelCase; ids are UUIDs generated by the control plane.
      - Lists are cursor-paginated: `?limit=50&cursor=<opaque>` → `{ items, nextCursor }`.
      - Errors are RFC 9457 problem details (`application/problem+json`).
      - `x-required-role` is the minimum role: viewer < editor < admin. Enforced by the API, not only by the UI.
      - Roles per environment: a user has a global role and may have, per environment, a role that
        replaces it in that environment (`viewer`, `editor`, `admin`, or `none` = no access). The role checked
        against `x-required-role` is the effective role:
          * operations with `{envId}` in the path, and those on a resource that belongs to one environment
            (`/clusters/{clusterId}`, `/clusters/{clusterId}/rotate-token`): the environment's role if the user has
            one, otherwise the global role. A user whose effective role there is `none` does not see the environment:
            every such operation answers 404, never 403, so its existence is not revealed. A visible environment
            where the effective role is below `x-required-role` answers 403.
          * every other operation (users, API tokens, audit events, creating environments, `/me`, the plugin
            catalog): the global role only. An environment `admin` does not manage users or other users' tokens.
          * a global `admin` is `admin` in every environment; environment roles cannot be assigned to one.
          * an API token acts with min(the token's role, its owner's effective role for that operation): in an
            operation with `{envId}` (or on a resource of one environment), the owner's role in that environment;
            in every other operation, the owner's global role. A token may be created with a role up to the owner's
            highest role anywhere (the global role or any environment role), so a global viewer who is editor in one
            environment can hold an editor token that edits only there.
        `GET /environments` lists only the environments where the caller's effective role is at least `viewer`
        (a global admin sees all).
      - Every mutation is written to the audit log in the same transaction.
      - Migration to v2 (control-plane-v2.openapi.yaml, decision H-9): each environment is the workspace with the same
        id. Every operation here runs on the same services and the same authorization as v2: the roles above are
        translated to v2 permissions, and no role or token reaches here what v2 would refuse. The uniqueness rules are
        the same (credentials and SNIs in the instance). What v1 keeps until the cut: routes created here are
        legacy-preserved (`stripPath` defaults to true, a path is optional), exactly as today; a route without a path
        is listed in the migration report, because the N2 composition refuses it until it gets one, and a route only
        becomes the workspace default through v2 (convertRoutePathCompatibility). A service still balances across the
        upstream whose name is its `host`. The administrative
        operations under `/environments/{envId}` and `/clusters/{clusterId}`, and `GET`/`POST /environments`, are cut
        (410) only after the UI no longer calls them, no API token called them for 30 days and the migration
        regression is green; that cut is a contract change of its own. Login, sessions, CSRF, `/me`, users, API
        tokens, the plugin catalog, the audit log and the agent protocol stay here.
      - Edits change the environment's draft state. Traffic only changes after a publish
        (or automatically when the environment has `publishMode: auto`).
      - Authentication is a session cookie set by `POST /auth/login` (`httpOnly; Secure; SameSite=Strict`).
        Every mutation also needs the `X-CSRF-Token` header, obtained from `GET /auth/csrf`; a missing or
        wrong token is a 403. Agents authenticate differently (see agent-protocol.openapi.yaml).
      - Client address (the per-address login lockout, `ip` in audit events and in API token use): the TCP peer, or
        the `X-Forwarded-For` hop written by a proxy the deployment trusts (`TRUST_PROXY`). When the deployment names
        a client address header (`CLIENT_IP_HEADER`, e.g. `CF-Connecting-IP`, set by a CDN or tunnel in front of the
        ingress), that header's value is the client address instead, but only on a request whose TCP peer is one of
        those trusted proxies. From an untrusted peer, or when the header is absent or not a single valid IP address,
        it is ignored and the rule above applies. Unset (the default) keeps the rule above.
      - Forbidden destinations. Proxied traffic must not reach the data plane node itself, link-local addresses
        (cloud metadata) or this installation's internal services. A service `host`, an upstream `name` and a target
        `target` host answer 422 with that `path` when they are:
          * loopback or unspecified: 127.0.0.0/8, ::1, 0.0.0.0, ::, `localhost` and names ending in `.localhost`;
          * link-local: 169.254.0.0/16 (includes 169.254.169.254), fe80::/10, and fd00:ec2::254;
          * the same addresses written as IPv4-mapped IPv6 (`::ffff:127.0.0.1`), or a numeric host that is not a
            canonical dotted-quad IPv4 (`127.1`, `2130706433`, `0x7f000001`, `0177.0.0.1`);
          * an internal host of the installation: the hosts of this control plane's validator, database, ClickHouse
            and platform http-log (collector) URLs, plus every entry of `FORBIDDEN_DESTINATIONS` (comma-separated
            host names, `*.suffix` patterns, IP addresses or CIDRs, set by the operator; empty by default). A name
            without dots also matches its Kubernetes forms (`<name>.<namespace>`, `<name>.<namespace>.svc[...]`).
        Host names are compared lowercased and without a trailing dot. The same rule makes publish, rollback and
        import answer 422 when the resulting state has such a destination (rows written before the rule existed).
        The control plane does not resolve DNS: a name that resolves to one of these addresses is not detected here,
        which is why the data plane must not expose privileged listeners over TCP.
      - Secrets are write-only: credential keys, JWT secrets, `encrypted` plugin fields and certificate private keys
        read back as `"REDACTED"` for every role. Only the agent endpoint delivers the real values. Basic-auth
        passwords are never returned anywhere; the control plane keeps only Kong's salted hash, which is a secret too:
        encrypted at rest and `"REDACTED"` outside the agent endpoint.
servers:
  - url: http://localhost:3000/api/v1
security:
  - cookieAuth: []
  - bearerApiToken: []
tags:
  - name: auth
  - name: users
  - name: tokens
  - name: environments
  - name: services
  - name: routes
  - name: consumers
  - name: plugins
  - name: upstreams
  - name: certificates
  - name: snapshots
  - name: clusters
  - name: audit
  - name: analytics
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      description: |
        Starts a session. The session id travels only in the `gromesh_session` cookie; the body never carries a token.
        Repeated failures for the same e-mail or client address (see "Client address" in the API description)
        answer 429 with `Retry-After`.
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`gromesh_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Strict`"
              schema: { type: string }
              example: "gromesh_session=example-session-id; Path=/; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
              example: {"user": {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "email": "editor@gromesh.dev", "name": "Ana Editora", "role": "editor", "active": true, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: viewer
      description: Ends the session and clears the cookie. Idempotent.
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              description: Expires the session cookie
              schema: { type: string }
              example: "gromesh_session=; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=0"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      security: [{ cookieAuth: [] }]
      x-required-role: viewer
      description: |
        Token bound to the current session, to send as `X-CSRF-Token` on every mutation. Stable for the session's
        lifetime; the client keeps it in memory, never in storage.
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
              example: {"csrfToken": "example-csrf-token"}
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      x-required-role: viewer
      description: The caller, with the roles that replace the global one in specific environments.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example: {"id": "3c2b1a09-8f7e-4d6c-9b5a-4f3e2d1c0b9a", "email": "editor@gromesh.dev", "name": "Ana Editora", "role": "editor", "active": true, "environmentRoles": [{"environmentId": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "role": "viewer"}], "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      security: [{ cookieAuth: [] }]
      x-required-role: admin
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{userId}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [users]
      operationId: updateUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [users]
      operationId: deleteUser
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/environment-roles:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      tags: [users]
      operationId: getUserEnvironmentRoles
      security: [{ cookieAuth: [] }]
      x-required-role: admin
      description: The roles that replace the user's global role in specific environments. Global role only (an environment admin cannot read this).
      responses:
        "200":
          description: Environment roles (environments without an entry use the global role)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentRoles" }
              example: {"items": [{"environmentId": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "role": "editor"}, {"environmentId": "7d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f4a", "role": "none"}]}
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [users]
      operationId: replaceUserEnvironmentRoles
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      description: |
        Replaces the whole set; an environment left out goes back to the global role, `{ "items": [] }` clears every
        override. One entry per environment. Audited with the set before and after. 422 with `path`: an unknown
        environment (`items.N.environmentId`), a repeated environment, or a user whose global role is `admin`
        (`(body)`: a global admin is admin in every environment).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentRoles" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentRoles" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/tokens:
    get:
      tags: [tokens]
      operationId: listMyTokens
      security: [{ cookieAuth: [] }]
      x-required-role: viewer
      description: The caller's API tokens, newest first, revoked ones included.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenPage" }
              example:
                items:
                  - { id: "5f0c1d2e-3a4b-4c5d-8e6f-7a8b9c0d1e2f", name: ci-deploy, role: editor, tokenHint: "…Ubok", createdAt: "2026-10-16T12:00:00Z", expiresAt: "2027-01-14T12:00:00Z", lastUsedAt: "2026-10-16T13:05:00Z", revokedAt: null, owner: { id: "33333333-3333-4333-8333-333333333333", name: Ana } }
                nextCursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tokens]
      operationId: createMyToken
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: viewer
      description: |
        Creates an API token for the caller. The token itself is returned once, here, and never again: the server keeps
        only a keyed hash and the hint. `role` may not exceed the caller's highest role: the global role or the
        highest of the caller's environment roles (`none` counts as nothing), 422 on `role` otherwise. In an
        operation of one environment the token acts with min(its role, the owner's effective role there); in any
        other operation, with min(its role, the owner's global role). A user may hold at most
        50 active tokens (neither revoked nor expired): the 51st answers 422 with path `(body)` and a message saying so.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
      responses:
        "201":
          description: Created; `token` is shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
              example:
                id: "5f0c1d2e-3a4b-4c5d-8e6f-7a8b9c0d1e2f"
                name: ci-deploy
                role: editor
                tokenHint: "…Ubok"
                createdAt: "2026-10-16T12:00:00Z"
                expiresAt: "2027-01-14T12:00:00Z"
                lastUsedAt: null
                revokedAt: null
                owner: { id: "33333333-3333-4333-8333-333333333333", name: Ana }
                token: "ggt_iCXWerLvtnlqVo5U92Mo6dN-H6L0ZWmq1HCVAjMUbok"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/me/tokens/{tokenId}:
    parameters: [{ $ref: "#/components/parameters/TokenId" }]
    delete:
      tags: [tokens]
      operationId: revokeMyToken
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: viewer
      description: |
        Revokes one of the caller's tokens; it stops working immediately. Idempotent on an already revoked token.
        Another user's token is not visible here: 404, never 403.
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      security: [{ cookieAuth: [] }]
      x-required-role: admin
      description: Every user's API tokens, newest first, revoked ones included.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tokens/{tokenId}:
    parameters: [{ $ref: "#/components/parameters/TokenId" }]
    delete:
      tags: [tokens]
      operationId: revokeToken
      security: [{ cookieAuth: [], csrfToken: [] }]
      x-required-role: admin
      description: Revokes any user's token.
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      tags: [environments]
      operationId: listEnvironments
      x-required-role: viewer
      description: The environments where the caller's effective role is at least viewer. A global admin sees all.
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
              example: {"items": [{"id": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "name": "producao", "description": "Tráfego de produção", "publishMode": "manual", "currentVersion": 3, "hasUnpublishedChanges": true, "autoPublishPausedReason": null, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}]}
    post:
      tags: [environments]
      operationId: createEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [environments]
      operationId: getEnvironment
      x-required-role: viewer
      responses:
        "200":
          description: Environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
              example: {"id": "0b3c6b5e-8d1f-4a51-9c64-2f0f6d1f8a11", "name": "producao", "description": "Tráfego de produção", "publishMode": "manual", "currentVersion": 3, "hasUnpublishedChanges": true, "autoPublishPausedReason": null, "createdAt": "2026-10-15T12:00:00Z", "updatedAt": "2026-10-15T12:00:00Z"}
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [environments]
      operationId: updateEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      x-required-role: admin
      description: |
        Refused with 409 while clusters are registered. Only a global admin: an environment admin answers 403 (an
        environment is a workspace, and a workspace admin never deletes the workspace).
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /environments/{envId}/export:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    get:
      tags: [environments]
      operationId: exportEnvironmentConfig
      x-required-role: viewer
      security: [{ cookieAuth: [] }, { bearerApiToken: [] }]
      summary: Export the current draft as a Gromesh configuration document
      description: |
        Exports every managed draft entity, without pagination, as `apiVersion: gromesh/v1`.
        This is Gromesh's declarative model, not a Kong config or a published snapshot. Environment settings,
        users, API tokens, clusters, audit events and platform-injected plugins are outside this document.
        `format` selects both serialization and Content-Type, independently of Accept; the default is yaml.
        Both representations conform to GromeshConfigV1Export. No state is changed.
        Plugin fields marked `encrypted` by the plugin schema, certificate private keys and HS256 JWT secrets
        are always the literal `REDACTED`, for every role. Key-auth credentials contain only identity, tags
        and `keyHint`, never `key`. Basic-auth credentials never contain a password or its hash.
        Reimporting an export into the same environment preserves matched secrets; importing it into another
        environment requires supplying real secrets for new entities. The output has no document size limit;
        a document larger than the import limit must be split before import.
      parameters:
        - name: format
          in: query
          description: Serialization of the response document
          schema: { type: string, enum: [yaml, json], default: yaml }
      responses:
        "200":
          description: Complete draft with secrets redacted
          content:
            application/yaml:
              schema: { $ref: "#/components/schemas/GromeshConfigV1Export" }
              examples:
                draft: { externalValue: ./examples/gromesh-config-v1.example.yaml }
            application/json:
              schema: { $ref: "#/components/schemas/GromeshConfigV1Export" }
              examples:
                draft: { externalValue: ./examples/gromesh-config-v1.example.json }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /environments/{envId}/import:
    parameters: [{ $ref: "#/components/parameters/EnvId" }]
    post:
      tags: [environments]
      operationId: importEnvironmentConfig
      x-required-role: editor
      security: [{ cookieAuth: [], csrfToken: [] }, { bearerApiToken: [] }]
      summary: Validate, preview or import configuration into the draft
      description: |
        Accepts a parsed document object or a UTF-8 YAML/JSON document string inside the JSON request envelope.
        `sourceFormat` defaults to `gromesh/v1`; it selects the model, not the serialization. Reject multiple
        YAML documents, duplicate mapping keys, custom YAML tags and alias expansion. The document limit is
        5 MiB (5,242,880 bytes): UTF-8 bytes of a string before parsing, or UTF-8 bytes of compact JSON for an
        object, and of the decoded compact JSON in either case. Exceeding either limit returns 422 at `document`.

        Merge upserts services, routes and upstreams by name; consumers by username or customId. When both
        consumer identifiers are supplied, either may match an existing consumer; if both resolve, they must resolve
        to the same consumer. Resolving to different consumers is a conflict. Certificates match by an existing target-environment id or by
        their exact non-empty SNI set (order-independent); disagreeing matches are a conflict. An empty SNI set has
        no natural key and requires an existing id to update. SNI overlap with another certificate that would remain
        in the resulting draft is a uniqueness conflict.
        Plugins match by (name, resolved service, route, consumer scope), targets by (upstream, target), JWT
        credentials by issuer key and basic-auth credentials by username (both unique in the instance, across environments).
        Key-auth matches by existing id within the resolved consumer or by the supplied full key; `keyHint`
        is display-only and MUST NOT be used to match a credential. A credential belonging to another consumer,
        or an id disagreeing with a natural-key match, is a conflict. Credential ids only match within the resolved
        consumer; unmatched ids are source identities, not requested ids for creation. New ids are generated
        by the control plane, except for the consumer-id preservation rule for prehashed basic-auth below.
        Matched entities retain their ids. ACL membership matches by (consumer, group).
        Merge never deletes, including nested credentials, targets and ACL groups: omitted entities remain,
        and supplied ACL groups are unioned. Supplied entities replace their non-secret attributes, with omitted
        optional attributes taking the same defaults as their write schemas (nullable values default to null,
        arrays to empty, plugin scope to global, and plugin protocols to the plugin schema's default).
        A removed ACL membership requires replace mode or the existing ACL API.

        Replace uses the same matching rules but makes the draft exactly the document, deleting every entity
        and nested membership absent from it, subject only to retained ids and preserved secrets of matched
        entities. References in replace must resolve inside the document; in merge they may also resolve to
        existing draft entities. Unknown references are 422 with their source path. A service host matching
        an upstream name keeps the existing upstream-resolution semantics; other hosts use DNS.

        A supplied `REDACTED`, or an omitted secret on a matched entity, keeps the current secret in either mode,
        as with certificate PUT. For a NEW credential/certificate/plugin secret, `REDACTED` or a missing value
        is 422 at that secret path; import never auto-generates credentials. This applies to key-auth keys,
        basic-auth passwords, HS256 JWT secrets, certificate keys and plugin fields marked `encrypted` that
        the selected plugin configuration requires. Optional inactive plugin secret fields may remain absent.
        A secret slot without a stored value is new even on a matched plugin or credential.
        RS256/ES256 JWT credentials require a valid public key and must not supply a secret. Existing certificate
        keys must still match the leaf; all current entity write validations, including certificate expiry on
        creation or a changed cert, apply. Basic-auth hashes are never accepted in the Gromesh document.

        For `kong-declarative-3.0`, `_format_version` must be the string `3.0`. Normalize only entities and fields
        representable in GromeshConfigV1, including nested or flat services/routes/plugins, consumers with
        keyauth_credentials/jwt_secrets/basicauth_credentials/acls, upstreams/targets and certificates/snis.
        Resolve source ids and named references before assigning target ids. Translate supported snake_case
        fields and relationships to the Gromesh model; do not pass this config directly to the data plane.
        Every unsupported entity or field, including nested fields and unknown plugin config fields, produces
        an `errors[]` entry at its original document path; nothing is silently ignored, even default-valued fields.
        `_transform` may be absent or true for plaintext basic-auth passwords. Such passwords keep today's
        plaintext handling even if they happen to contain 40 lowercase hex characters. `_transform` is
        document-wide, not per credential; `_transform: false` without basic-auth credentials is accepted.

        Accept prehashed `basicauth_credentials` only for `sourceFormat: kong-declarative-3.0` with
        `_transform: false`. Each supplied password must match `^[0-9a-f]{40}$` and is already Kong's
        `sha1(password + consumer_id)` hash; store it unchanged, without hashing it again. Acceptance requires
        the credential's consumer to be present in the source document with an `id` in lowercase canonical UUID
        form (`^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$`; the salt is that exact string, so
        any other form is rejected as invalid), and that exact id to be preserved as the consumer's id in the
        target environment. This applies to nested credentials and to flat credentials whose consumer reference
        resolves to a consumer entry of the same document carrying such an `id`. A reference to an existing
        target consumer that is not in the document does not suffice.

        For each such consumer, in both merge and replace, resolve its UUID globally before any
        username/customId matching. If that id exists in the TARGET environment, that consumer is the match
        and retains its id; normal merge/replace updates and uniqueness checks still apply. Any supplied
        username/customId resolving to a different consumer is a conflict, never a fallback match. If that id
        exists in ANOTHER environment, it cannot be preserved because consumer ids are global primary keys:
        reject with 422 at the source consumer's id path (e.g. `document.consumers.0.id`), without disclosing
        the other environment or consumer. If no consumer anywhere has that id, create a NEW consumer with
        exactly that id; a username/customId already matching another target consumer is a conflict, even
        in replace mode. Never substitute a generated id or another consumer's id to accept the hash.
        This exception applies only to source consumers carrying prehashed basic-auth credentials in this
        format. All other consumers and entities keep today's matching and id-generation rules.

        An invalid hash, a missing/invalid consumer UUID, or any inability to preserve that id rejects
        a real import with 422 and an error at the credential's original password path, e.g.
        `document.consumers.0.basicauth_credentials.0.password` or `document.basicauth_credentials.0.password`.
        The message explains that Kong's hash is salted with the consumer id and requires preserving that id,
        without echoing the hash or submitted password. Invalid UUIDs and cross-environment id collisions also
        produce an error at the source consumer's id path. Existing omitted/REDACTED-secret preservation on
        matched credentials still applies; it does not authorize creating a credential without a valid hash
        or bypassing the consumer-id rule: under `_transform: false`, an omitted or REDACTED password still requires
        its consumer's id to be preserved. All-or-nothing and dry-run error/report semantics below still apply.

        error paths, with one error per affected credential at its password path and no other paths:
          * hash not 40 lowercase hex: the password path.
          * consumer without `id`: the password path.
          * `id` not a lowercase canonical UUID: the password path and `document.consumers.N.id`.
          * `id` used by a consumer of another environment: the password path and `document.consumers.N.id`.
          * `id` repeated by two source consumers: the password path and `document.consumers.N.id` of the repeat.
          * username/customId resolving to another consumer: the password path and that identifier's path.
        The message at the id path is fixed ("consumer id cannot be preserved because it is already in use" for an
        id in use) and reveals only that the id is unavailable, never where; this availability signal, also
        visible through dry-run, is accepted since consumer ids are random UUIDs.

        Imported hashes are sealed at rest with `enc:v2`, bound to table `basicauth_credentials`,
        column `password_hash` and the target credential's id, like other basic-auth hashes. They are treated
        as secrets and REDACTED everywhere except the agent endpoint (including API, diff, preview and snapshot
        envelope); exports continue omitting basic-auth passwords and hashes entirely. Reports, errors, logs
        and audit events never echo the hash or submitted password. Plaintext imports with `_transform`
        absent/true and the Gromesh document's prohibition on importing hashes are unchanged.

        Conflicts (the matching conflicts above and uniqueness violations in the resulting draft) are errors like any
        other: an `errors[]` entry at the conflicting path, never a separate 409. A forbidden destination (see the
        description of this API) in the resulting draft is a semantic error at its document path, e.g.
        `document.services.0.host`, `document.upstreams.0.targets.1.target`.

        A real import (`dryRun: false`) is ALL OR NOTHING. With any error (invalid envelope, malformed
        serialization, schema violation, conversion or semantic error, conflict, size limit) NOTHING is written:
        no entity, draft revision, audit event or snapshot. The response is then 422 with the same report
        `{ added, modified, removed, errors[] }` (EnvironmentImportFailure, inside a problem+json body), where
        errors[] lists every error found and the change arrays are empty because there is no valid plan; never a
        partial success. On success the entire change, draft revision update and a redacted import audit event
        commit in ONE transaction and the response is 200 with errors[] empty.

        `dryRun: true` never writes anything (including audit, draft revision or snapshots) and returns the same
        redacted diff a real import would apply. Its document/conversion/semantic errors and conflicts return a 200
        report with errors[] (change arrays empty); an invalid request envelope, malformed serialization or a
        document schema violation is the same 422 EnvironmentImportFailure as a real import. Import NEVER publishes or notifies
        agents, even when publishMode is auto; a separate explicit publish is required.
        Reports diff against the current draft, not the published snapshot. Diff labels/before/after and errors
        never expose secrets, plaintext passwords, password hashes or submitted secret values. Error paths use
        dot-separated properties and zero-based indexes rooted at `document`, e.g. `document.consumers.0.jwtCredentials.0.secret`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentImportRequest" }
      responses:
        "200":
          description: Successful draft import, or a dry-run report; a real import always has an empty errors array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentImportReport" }
              examples:
                unchanged:
                  value: { added: [], modified: [], removed: [], errors: [] }
                invalidDryRun:
                  value:
                    added: []
                    modified: []
                    removed: []
                    errors: [{ path: document.consumers.0.jwtCredentials.0.secret, message: A new HS256 credential requires a secret }]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Nothing was written (all or nothing); errors[] lists every error and the change arrays are empty
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/EnvironmentImportFailure" }
              examples:
                missingSecret:
                  value:
                    type: https://gromesh.dev/problems/422
                    title: Unprocessable Content
                    status: 422
                    detail: The import was not applied
                    added: []
                    modified: []
                    removed: []
                    errors: [{ path: document.consumers.0.jwtCredentials.0.secret, message: A new HS256 credential requires a secret }]
