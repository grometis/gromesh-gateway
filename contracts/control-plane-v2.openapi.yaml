      responses:
        "200": { description: Confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/Promotion" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /promotions/{promotionId}/approvals:
    parameters: [ { $ref: "#/components/parameters/PromotionId" } ]
    post:
      tags: [ promotions ]
      operationId: approvePromotion
      x-gromesh-requirements: [ GW-APR-01, GW-APR-03, GW-APR-04, GW-APR-05, GW-APR-07, GW-PUB-02, GW-PUB-05, GW-M2M-03 ]
