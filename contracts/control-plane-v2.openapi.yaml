          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Top routes
          content:
            application/json:
              schema:
                $ref: ./control-plane.openapi.yaml#/components/schemas/TopRoutes
