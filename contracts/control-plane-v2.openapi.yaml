        arrived by promotion, with a valid historical attestation). On dev it executes directly as a NEW release
        (origin rollback). On hml/prd it creates a promotion of kind rollback (requester = this session) that goes
        through validation, approval and execution with the normal policy. emergency = true (see "Rollback" in info):
        requires rollback.emergency, a justification, content not revoked whose contentFirstActivatedAt is newer
        than emergencyMaxReleaseAgeDays (a copy made by an earlier rollback never renews it); creates kind
        emergency-rollback;
