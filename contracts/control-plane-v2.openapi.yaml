        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
        - rollback.emergency
        - m2m.read-state
        - m2m.submit
        - m2m.read-own-promotion
        - m2m.validate-own-promotion
        - m2m.pull
        - m2m.ack
        - m2m.attestation
    GrantablePermission:
      enum:
        - instance.read
        - platform.admin
        - workspace.read
        - workspace.create
        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
        - rollback.emergency
      description: M2M permissions belong only to M2M clients, never to a binding.
    RolePermission:
      enum:
        - instance.read
        - platform.admin
        - workspace.read
        - workspace.create
        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
      description: rollback.emergency is never part of a role.
    RoleName:
      oneOf:
        - enum:
            - viewer
            - editor
            - publisher
            - approver
            - workspace-admin
            - platform-admin
        - type: string
          pattern: ^[a-z][a-z0-9-]{1,39}$
          not:
            enum:
              - viewer
              - editor
              - publisher
              - approver
              - workspace-admin
              - platform-admin
          x-gromesh-phase: L3
          description: Custom role (createRole, L3).
    M2mValidationSummary:
      type: object
      additionalProperties: false
      required:
        - result
        - checks
        - at
      properties:
        result:
          enum:
            - passed
            - blocked
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - result
            properties:
              name:
                $ref: "#/components/schemas/ValidationReport/properties/checks/items/properties/name"
              result:
                enum:
                  - passed
                  - blocked
                  - warning
        at:
          type: string
          format: date-time
      description: "Check names and results only: no detail, no content, no values. A conflict with another workspace is reported only as the check `conflicts` blocked."
    M2mPromotionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - packageId
        - status
        - kind
        - contentDigest
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PromotionStatus"
        kind:
          enum:
            - full
            - partial
        contentDigest:
          $ref: "#/components/schemas/Digest"
        validation:
          oneOf:
            - $ref: "#/components/schemas/M2mValidationSummary"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
      description: "What an M2M client may read about a promotion it submitted: never the diff, content, values, policy, approvals or identities."
    PromotionRecovery:
      type: object
      additionalProperties: false
      required:
        - kind
        - deploymentRevision
        - at
      properties:
        kind:
          enum:
            - rollback
            - emergency-rollback
            - reapply
        promotionId:
          type:
            - string
            - "null"
          format: uuid
          description: The rollback promotion (null for a reapply, which is a reconciliation).
        deploymentRevision:
          type: integer
        at:
          type: string
          format: date-time
      description: "How a failed promotion was recovered: a separate operation, linked here and in the audit of both. The execution keeps its original result: converged after a failed execution only through reapply, rolled-back only through a rollback promotion."
      allOf:
        - if:
            required:
              - kind
            properties:
              kind:
                enum:
                  - rollback
                  - emergency-rollback
          then:
            required:
              - promotionId
            properties:
              promotionId:
                type: string
          else:
            properties:
              promotionId:
                type: "null"
    EmergencyPostReviewStatus:
      enum:
        - pending
        - in-review
        - no-findings
        - findings
        - corrective-action
      description: Governance of an executed emergency rollback; independent of PromotionStatus.
      x-gromesh-transitions:
        initial:
          - pending
        terminal:
          - no-findings
          - findings
          - corrective-action
        transitions:
          - - pending
            - in-review
            - an eligible reviewer starts it (startEmergencyPostReview)
          - - in-review
            - pending
            - the reviewer withdraws, or loses eligibility (identity or binding change)
          - - in-review
            - no-findings
            - concluded without irregularities
          - - in-review
            - findings
            - concluded with irregularities, no corrective action applicable
          - - in-review
            - corrective-action
            - concluded with irregularities and a corrective action referenced
    EmergencyPostReview:
      type: object
      additionalProperties: false
      required:
        - id
        - promotionId
        - status
        - openedAt
        - reviewer
        - justification
        - correctiveAction
        - decidedAt
      description: Opened in the same transaction in which the emergency rollback starts executing, whatever the outcome. Every transition writes an audit event in its transaction. Pending and in-review post-reviews are alerted and listed until concluded.
      allOf:
        - if:
            properties:
              status:
                enum:
                  - in-review
                  - no-findings
                  - findings
                  - corrective-action
          then:
            properties:
              reviewer:
                type: object
        - if:
            properties:
              status:
                enum:
                  - no-findings
                  - findings
                  - corrective-action
          then:
            properties:
              justification:
                type: string
              decidedAt:
                type: string
          else:
            properties:
              justification:
                type: "null"
              decidedAt:
                type: "null"
        - if:
            properties:
              status:
                const: corrective-action
          then:
            properties:
              correctiveAction:
                type: string
                minLength: 1
          else:
            properties:
              correctiveAction:
                type: "null"
      properties:
        id:
          type: string
          format: uuid
        promotionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EmergencyPostReviewStatus"
        openedAt:
          type: string
          format: date-time
        reviewer:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - userId
                - personId
                - startedAt
              properties:
                userId:
                  type: string
                  format: uuid
                personId:
                  type: string
                  format: uuid
                startedAt:
                  type: string
                  format: date-time
            - type: "null"
        justification:
          type:
            - string
            - "null"
          minLength: 10
        correctiveAction:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Reference to the corrective action (ticket, follow-up promotion).
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
    WorkspaceGlobalPlugin:
      type: object
      required:
        - id
        - name
        - enabled
        - config
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        config:
          type: object
        protocols:
          type: array
          items:
            type: string
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceHealthchecks:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks
      type: object
      unevaluatedProperties: false
      properties:
        active:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks/properties/active
              type: object
              unevaluatedProperties: false
        passive:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks/properties/passive
              type: object
              unevaluatedProperties: false
      description: Healthchecks of v1, closed at every level.
