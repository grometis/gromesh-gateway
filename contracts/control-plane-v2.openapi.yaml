openapi: 3.1.0
info:
  title: Gromesh Gateway — Control plane API v2 (Workspaces, planned)
  version: 0.2.0-planned
  description: |
    PLANNED (phase N0, from the approved W0 design). NOT implemented: every operation carries x-gromesh-planned: true
    and has no handler; the implementation phases (N1 to N7) remove the mark operation by operation. The running
    product serves control-plane.openapi.yaml (v1). Authentication, users, API tokens, /me and the plugin catalog
    stay in v1 until N1 settles the compatibility of the paths (v1 alias or cut, decision H-9). This contract is
    normative on its own: every rule an implementation or a test needs is written here, in the schemas, or in the
    agent protocol and snapshot v2 contracts. References such as "B §3.5.3" or "R7-2" only record where a rule came
    from in the approved W0 design and its reviews (kept outside the repository); they never define it.

    Conventions (in addition to the current contract):
      - Each Gromesh instance (dev, hml, prd) exposes this API independently. There is no central instance.
      - x-required-permission replaces x-required-role: the guard evaluates the caller's effective permissions in the
        scope of the request (instance or {workspaceId}), deny by default (mandatory policies, then explicit denies,
        then individual grants, then group grants).
      - Workspace-scoped operations answer 404 when the workspace does not exist or is invisible to the caller, 403
        when visible but the permission is missing (same rule as environments today).
      - Promotions are decided and executed by the TARGET instance. M2M identities (bearer m2mAssertion) may only
        submit packages, ask for validation and read their own promotions; they never approve nor execute.
      - API tokens act with the intersection of the token's scopes and the owner's current permissions (checked on
        every request; a revoked owner permission applies at once). Deciding operations accept only a session with
        CSRF, never an API token nor an M2M identity: decideWorkspaceRequest, confirmPromotionRequester,
        approvePromotion, executePromotion, startEmergencyPostReview and decideEmergencyPostReview.
      - Approvals are bound to (promotionId, contentDigest, diffDigest, baseRevision, policyVersion, valuesDigest,
        candidateDigest) and consumed once by the execution. "Relevant change" on the target has this closed
        definition: any difference in baseRevision, the active deployment revision, the set of clusters,
        policyVersion, valuesDigest, diffDigest or candidateDigest (hash of the workspace's part of the candidate
        composed configuration) from what the approvals recorded. A difference in diffDigest, policyVersion,
        valuesDigest or candidateDigest invalidates the approvals; any other one blocks until revalidation. Nothing
        else is relevant, and approval adds no exception to a divergent target.
      - Target validation checks only what the target's API can prove: authentication and provenance of the package
        (signature, stage chain, anti-replay), active release and baseRevision, integrity of the target (active
        deployment = last approved one, applied hash = recorded hash), dependencies, conflicts (instance-wide
        uniqueness, slug, names, reserved plugins, routes without path, forbidden destinations), compilation and
        Kong schema validation of the candidate, convergence and health of every expected node of the current
        deployment (heartbeat <= 45 s), environment values present and frozen (valuesDigest), the confirmed
        requester's promotion.request, and the effective policy. It never calls business backends. A divergent target
        (active deployment != last approved, node hash mismatch, active release != baseRevision, node offline) blocks
        the promotion with the reason; recovery is a separate reconciliation.
      - x-scope declares how the guard resolves the authorization scope before checking the permission: instance,
        workspace ({workspaceId}), promotion ({promotionId} -> target workspace, or instance while provisioning),
        binding ({bindingId} -> the binding's stored scope), request ({requestId} -> instance), m2m (the calling
        peer instance's M2M client, never a user binding) and public (m2m token exchange only). Listings are filtered
        by the same rule; an object outside the caller's scope answers 404.
      - The requester of a promotion is the user who confirms it AUTHENTICATED ON THE TARGET
        (requester-confirmation). The requester and authors declared in the package are recorded for audit only.
      - Session mutations require cookieAuth plus csrfToken (X-CSRF-Token), as in the current contract.
      - x-gromesh-phase names the phase after the core (L1 to L10) that delivers what it marks: an operation, a
        schema, a oneOf alternative, a property or a const value. Until then the core answers 422 (value) or does
        not expose the operation. x-gromesh-core-exception names the only core use of a marked part. Core profile
        derivation (the N0 contract test does it and the core validates requests with the result): a marked
        operation or oneOf alternative is removed; a marked property is forbidden in its parent (not: required),
        replaced by its x-gromesh-core-profile schema when it has one (the exact core exception, applied to the
        parent); every core request schema then rejects every marked part. The N0 contract test
        (workspaces-v2-contract.test.ts) derives it and checks the rejections.
      - x-required-permission-alternatives: when its condition holds, either the main permission or the alternative
        authorizes. x-required-permission-when: when its condition holds, the listed permission REPLACES the main
        one (the main one is then neither required nor sufficient). No other x-required-permission-* key exists.
      - Every operation declares its error responses: 401 and 403 (non-public), 404 (path parameters), 422 (request
        body; 400 where the protocol defines it). Request bodies are closed: an unknown property answers 422.
      - Authentication in the core (B §3.1, E5): at most ONE effective authentication mechanism per route,
        counted by the compiler on the composed configuration after Kong's precedence (route > service > global
        for the same plugin name; different names all run): route, service, workspace globals and mandatory
        platform plugins. A write or a publication that yields two or more answers 422 with the path of the plugin
        that adds the second one. `anonymous` only on that single mechanism and only with a consumer of the same
        workspace. AND/OR chains, the `session` plugin and `ldap-auth` (its credential carries no workspace binding,
        rodada 4 F-2): x-gromesh-phase L10 (AuthenticationProfile); in the core a workspace may only use key-auth,
        basic-auth and jwt (hmac-auth once its credential is modelled), any other authenticator answers 422, and an
        effective ldap-auth or session on a workspace route, including one of the platform, blocks the composition.
        No tag creates an exception.
      - Privileged plugin capabilities (B §3.4; already in the current product, hotfix F-1): pre-function,
        post-function, file-log, custom_fields_by_lua, and plugins that would use the pod's cloud credentials
        (aws-lambda without its own keys, ai-* with gcp_use_service_account or bedrock without keys) are
        platform-admin only, on write, import, publication, promotion and rollback; a workspace admin never gets
        them. `{vault://` in user configuration answers 422 for everyone.
      - Trust in hml keys (B §4.5, rodadas 5 e 6, F-4): one predicate keyTrust(kid, use, signedAt, now), with
        PeerKey.validFrom, validUntil, retiredAt and revokedAt. Always: not revoked (revokedAt null) and
        validFrom <= signedAt <= validUntil. use=new (package or attestation arriving with a promotion): status
        `active` and now <= validUntil. use=historical (attestation stored with a release when accepted): status
        `active` or `retired`, signedAt < retiredAt when retired, and now is not checked against validUntil (an
        expired key keeps proving what it signed while valid, like a retired one). Each operation has a fixed
        use, recorded on the promotion at creation (Promotion.proofUse) and applied unchanged at validation,
        approval, execution and recovery (re-execution after a restart): promotion → new; rollback, emergency
        rollback and reconciliation → historical. A key that changes state between steps is re-evaluated with the
        same use at execution (revoked → blocked).
      - Content identity and revocation (B §10, rodada 6 G-2): the identity of a workspace's content on an instance
        is its contentDigest. A release created by rollback copies the content and keeps its provenance: the same
        contentDigest, contentOriginVersion (the first release with that digest here), contentFirstActivatedAt and
        the authorization that first brought it (originPromotionId). Age limits are measured from
        contentFirstActivatedAt, never from the copy. Revocation is per (workspace, contentDigest), append-only
        (POST /workspaces/{workspaceId}/content-revocations), never an update of a release, and covers every release
        with that digest, past and future; a revoked digest can no longer be the target of any operation.
      - Four operations, never interchangeable (B §10, rodadas 5 e 6, F-3/G-1). (1) Reconciliation (reconcile):
        only `reapply` of the instance's CURRENT deployment as a new revision; it chooses no version and never
        changes the desired state; refused when a member's content is revoked. (2) Normal rollback
        (rollbackRelease, emergency=false): on hml/prd a promotion of kind rollback with the full policy
        (validation, approvals, requester != approvers, executor separation). (3) Emergency rollback
        (rollbackRelease, emergency=true): kind emergency-rollback; target = content previously active on this
        instance, not revoked, contentFirstActivatedAt newer than emergencyMaxReleaseAgeDays, in prd with a valid
        historical attestation; never new content; current environment values; approval deferred to a mandatory
        post-review. Requires `rollback.emergency`, granted only directly to a user with expiresAt (at most 7 days),
        justification and scope; at execution the requester's grant is re-checked (still valid, not expired,
        covering the scope) together with the target. A second verified person holding `rollback.emergency` or
        `promotion.execute` executes, unless the INSTANCE policy sets `emergencySelfExecution: true`. Its
        operational state follows the same machine as any promotion (executing, deploying, converged or failed with
        Execution.failureReason; never overwritten). Starting the execution opens, in the same transaction, a
        mandatory EmergencyPostReview with its own identity, state machine, reviewer, outcome, justification and
        audit (pending, in-review, no-findings, findings, corrective-action); the requester never reviews it, nor
        does the executor unless executorMayApprove. The post-review never changes the promotion, its execution or
        the deployment; a later recovery is its own operation, linked by Promotion.recoveredBy. (4) New publication
        (dev) or promotion (hml/prd). Only (3) may supersede a converging deployment.
      - Fail-closed isolation (B §3.5.3, decision P1, R7-1, R7-2, R8-1, R8-3, R9-1, R9-2): Kong runs only while the
        pod holds a valid isolation lease written by its isolation-probe (every 15 s, valid 33 s), measured in the
        node's CLOCK_BOOTTIME and bound to its boot id (wall clock never decides validity; any doubt = invalid). The
        lease depends only on a CP admission for the pod UID and boot and a conclusive network proof, never on Kong;
        the guard canary is checked after start. agent, isolation-probe and collector are native sidecars
        (Kubernetes >= 1.33, or an earlier minor with recorded N2 evidence). Layers: route guard 503; a supervisor
        (PID 1 of the kong container) and, outside pod deletion, Kong's liveness kill the whole process (open
        connections, healthchecks, timers); readiness. Budgets from the loss: detection <= 18 s, 503 <= 19 s, Kong
        stopped <= 20 s (supervisor) or <= 24 s (liveness, effective kubelet grace 2 s), NotReady <= 20 s; during
        pod deletion liveness is suspended, so the supervisor bound applies and the independent ceiling is the pod
        grace (30 s from the deletion start); kubelet or node failure with a stuck supervisor has no time bound.
        Probe reports are signed by a per-pod probe key, numbered without gaps and carry the cluster's admission
        challenge. A new admission is granted only when no blocking pendency is open in scope and every other open
        admission of the cluster has answered the current challenge without violation; no timeout grants it. An
        admission closes only with a final report confirming Kong stopped (or a node-reboot report of the previous
        boot). confirmed-violation and unconfirmed-isolation accept releaseIsolationContainment;
        communication-failure (60 s) is an alert only. Agent, CP or collector outages never contain admitted pods
        that keep proving isolation.
      - Analytics collector in workspaces mode (B §3.5.2, decision P2): a sidecar listening only on 127.0.0.1, token per
        cluster (never repeated across clusters), cluster and instance pinned by the collector, dedup by
        (cluster, pod, request.id), workspace attributed by route_id against the active deployment.
      - Identity in the core (B §4.7): each instance authenticates only its own local accounts; one local login
        identity per person; deciding (confirm, approve, execute) requires a person verified by platform-admin with
        a corporateId unique in the instance. OIDC login and cross-instance correlation: x-gromesh-phase L5. The
        identity declared by a source instance is audit data; the target only uses it to REFUSE (mismatch), never to
        grant. Separation of duties by verified person and by account: approver != confirmed requester; executor !=
        confirmed requester; executor != approvers unless the policy sets executorMayApprove. The confirmed
        requester's promotion.request is evaluated at confirmation and again at execution.
      - Workspace identity: id (per instance), key (the same workspace on every instance) and slug. The slug is
        derived from the name when absent: Unicode NFKD, diacritics removed, lowercase, every run of
        non-alphanumerics → one `-`, `-` trimmed at both ends; 2 to 40 characters, starting with a letter; unique in
        the instance (a collision answers 409; the caller picks another, nothing is suffixed silently); immutable
        after the first release (renaming the workspace keeps it). Reserved slugs (422): api, admin, agent, status,
        metrics, health, healthz, ready, gromesh, kong, well-known, static, assets. Names of services, routes and
        upstreams are unique in the workspace; on the node they become `<slug>~<name>`, and an upstream's host
        becomes `<name>.<slug>.gromesh.internal` (a service refers to its upstream only by upstreamId; the suffix
        `.gromesh.internal` is refused as a free host of a service, target or plugin URL). Entity ids are UUIDs
        generated on dev and preserved on hml and prd; nothing is created directly on hml or prd.
      - Credential secrets (decision H-14): the server generates every key-auth key and HS256 JWT secret, in both
        APIs and in an import (a supplied value answers 422 at its field; an imported credential gets a generated one,
        listed without its value). Delivered by task N1-X6.
      - Consumer identity (decision H-5): username and customId are unique in the WORKSPACE. Two workspaces may each
        have a consumer app-sky; they are independent consumers. On the node the compiler emits username
        `<slug>~<username>` and custom_id `<slug>~<customId>` (unique in the instance because the slug is); the API,
        audit, export, releases and packages carry only the logical value, and gromesh-workspace sends the logical
        values to the upstream in X-Consumer-Username and X-Consumer-Custom-ID (proven with the real Kong in N2).
      - Instance-wide uniqueness (across workspaces, because Kong looks a credential up across the whole node): key-auth
        key (by its HMAC), JWT key, basic-auth username, SNI. Every conflict (these and the per-workspace ones) is
        found before any composition, with a generic message that never names the other workspace, and is reported
        the same way everywhere: 409 on a single-entity write; an errors[] entry at the conflicting path of the 422 of
        an import (never a separate 409); a blocked `conflicts` check of the promotion validation. Keys are
        server-generated by default and failed attempts are limited and audited.
      - Consumer isolation (decision H-1): the compiler emits the platform plugin gromesh-workspace on every
        configuration (global, tag gromesh-platform; the name is reserved). After every authenticator it compares the
        tag gromesh-ws:<id> of the final consumer (anonymous included) with the route's; a different tag, or a
        credential without a consumer, answers 401 with the same body as an invalid credential. A credential of one
        workspace never authenticates on a route of another; a route prefix is never taken as isolation. anonymous
        and consumer-scoped plugins refer only to consumers of the same workspace (422). Proven with the real Kong in
        N2 (GW-WS-06) before any second workspace exists on an instance. hmac-auth stays unavailable to workspaces until its
        credential is modelled.
      - Routes of a workspace always have paths (no exception). The compiler emits a literal path as
        `/<slug><path>` and a regex path as `~/<slug>(?:<regex>)`. A regex path starts with `/`, has no inline flags,
        no backreferences and no `\Q…\E`, at most 1024 characters (422 at the path). gromesh-route-guard runs
        before every authenticator and answers 404 when the normalized path is neither `/<slug>` nor under
        `/<slug>/`. By default the full path, prefix included, reaches the upstream; stripPath true keeps Kong's
        semantics (the whole matched part is removed). Isolation and authorization follow the route's workspace,
        never the text of the path.
      - Plugins. A mandatory platform plugin's name is reserved in every workspace scope (422). Its only exception
        is a platform-administered instance for an exact route or service of one workspace (full configuration,
        digest, reason, expiry), created and changed only by platform-admin and audited; at expiry a persistent
        schedule creates a deployment (reason mandatory-plugins) without it, retrying while the lease is busy.
        Names gromesh-* are reserved. Workspace-wide plugins (L9) are emulated by one instance per route or service:
        stateless request plugins (cors, ip-restriction, bot-detection, request-size-limiting, request-termination,
        request/response-transformer, correlation-id, redirect, grpc-gateway, grpc-web, standard-webhooks, key-auth,
        basic-auth, jwt, acl, ai-prompt-decorator, ai-prompt-guard, ai-prompt-template and the ai-* transformers
        and proxy with their own credentials) and logging plugins (http-log, tcp-log, udp-log, syslog, loggly,
        datadog, statsd, opentelemetry, zipkin, prometheus; endpoints under the destination rules) are allowed;
        rate-limiting, response-ratelimiting and proxy-cache change meaning (counter or cache per route), so their
        workspace-wide use is decided by H-8 before L9 and refused (422) until then; ldap-auth and session are L10;
        acme and the privileged capabilities are platform-only; oauth2 is not supported.
      - Environment values. Only these fields accept a VarRef: service protocol, host, port and path; upstream
        target; certificate cert and key; plugin fields marked secret or referenceable by the plugin catalog, and
        logging endpoints. Anywhere else 422 (a value never changes policy, e.g. rate-limiting config.minute).
        Values live on each instance, are versioned, audited and never leave it; consumer credentials are values
        too (never promoted). valuesDigest = HMAC-SHA256 with a key of the instance over the list of (name,
        version, SHA-256 of the value) of the variables the candidate uses, ordered by name; approvals and the
        execution are bound to it and the execution composes exactly those versions. A required value missing on
        the target blocks the validation (check values). Before a workspace exists, values are prepared by
        workspaceKey (setProvisioningValue) and moved into the workspace by the provisioning transaction.
      - Content and package. contentDigest is defined by WorkspaceContent (JCS, arrays ordered by id). The package
        payload is the JCS form of PackagePayload; the signature covers its bytes (SignedPackage). Each instance has
        its own signing key, generated there, the private part sealed with the instance's encryption key (enc:v2)
        and never exported; the public part is published in the peers' trust store by stage (PeerKey). Rotation
        overlaps (two active keys); revoking a key blocks every package and attestation it signed not executed yet.
      - M2M. One identity per connection direction, each with its own aud: push dev→hml (registered on hml) and
        hml→prd (registered on prd); pull (L1) prd→hml (registered on hml, only m2m.pull, m2m.ack, m2m.attestation).
        Authentication is only OAuth2 client credentials with private_key_jwt: aud = the called instance,
        exp − iat <= 60 s, accepted while iat − 120 s <= now <= exp + 120 s, jti unique and kept until exp + 120 s.
        An M2M identity reads only the summary of the workspace state and of the promotions it submitted
        (M2mPromotionSummary), submits packages and asks for validation; it never confirms, approves, executes,
        reads secrets or other workspaces (a conflict is reported only as the check conflicts).
      - Full publication carries the whole workspace; the target diffs it against its active release, deletions
        included (explicit items, high risk), and only that workspace's entities change: every other workspace of
        the composition stays byte for byte (the deployment records each member's digest). Partial publication
        (L7): the target computes the dependency closure over the source release, directly (route → service;
        service → upstream and the certificate of its SNI; plugin → its scope; consumer-scoped plugin → consumer;
        config.anonymous → consumer) and inversely for safety (a selected route or service brings every plugin that
        applies to it in the source release, so an authenticated route never arrives public); deletions are explicit
        items (change removed); a dependency already on the target with the same id and content is not a change,
        with different content it is an explicit change in the diff. The result is a new complete release; the rest
        of the workspace is untouched.
      - Effective policy = instance ∪ workspace ∪ risk (L6), the most restrictive: the highest minApprovals, the
        union of requiredRoles, the shortest validity; authorMayApprove and executorMayApprove are true only when
        every source allows it; emergencySelfExecution and emergencyMaxReleaseAgeDays come only from the instance. A
        workspace policy can only tighten.
      - Granting: only permissions the grantor holds in the same scope, with expiresAt no later than that of the
        grant that supports it; a temporary grant never includes members.manage. Revoking: a deny binding or one
        granted by the platform only by the platform; others by a holder of members.manage in that scope who holds
        the binding's permissions. Changing a custom role's permissions is platform-only.
      - Provisioning (first promotion of a workspace to a target): inside `executing`, ONE transaction of the target
        creates the workspace (same key and slug, the target's mandatory policies, and none of the source's members,
        groups, permissions, values or credentials), moves the prepared values, and creates the release and the
        deployment. If the composition fails, everything rolls back: there is no partially active workspace.
        Validating, confirming, approving and executing a provisioning use instance bindings.
  x-gromesh-permissions: [ instance.read, platform.admin, workspace.read, workspace.create, workspace.admin, workspace.request, gateway.write, values.write, members.read, members.manage, groups.read, groups.manage, release.publish, release.rollback, release.revoke, reconcile.execute, promotion.read, promotion.request, promotion.approve, promotion.execute, promotion.import, rollback.emergency, m2m.read-state, m2m.submit, m2m.read-own-promotion, m2m.validate-own-promotion, m2m.pull, m2m.ack, m2m.attestation ]
  x-gromesh-builtin-roles:
    viewer: [ workspace.read, members.read, promotion.read ]
    editor: [ workspace.read, members.read, promotion.read, gateway.write ]
    publisher: [ workspace.read, members.read, promotion.read, gateway.write, release.publish, release.rollback, promotion.request ]
    approver: [ workspace.read, members.read, promotion.read, promotion.approve ]
    workspace-admin: [ workspace.read, members.read, promotion.read, gateway.write, release.publish, release.rollback, promotion.request, workspace.admin, members.manage, values.write, release.revoke ]
    platform-admin: [ instance.read, platform.admin, workspace.read, workspace.create, workspace.admin, workspace.request, gateway.write, values.write, members.read, members.manage, groups.read, groups.manage, release.publish, release.rollback, release.revoke, reconcile.execute, promotion.read, promotion.request, promotion.approve, promotion.execute, promotion.import ]
  x-gromesh-m2m-permissions: [ m2m.read-state, m2m.submit, m2m.read-own-promotion, m2m.validate-own-promotion, m2m.pull, m2m.ack, m2m.attestation ]
  x-gromesh-deferred-proofs:
    GW-WS-06:
      phase: N2
      proof: "e2e with the real Kong: for key-auth, basic-auth and jwt, with and without anonymous, a credential of workspace A on a route of B answers 401 with the body of an invalid credential and on a route of A answers 200; the upstream receives the logical X-Consumer-Username (H-1, H-5)."
    GW-PLG-06:
      phase: N2
      proof: "e2e in CI with the images/kong image and the product plugins (gromesh-route-guard, gromesh-workspace): every behavior this contract assigns to the data plane is exercised on the real Kong."
    GW-AUTH-04:
      phase: L5
      proof: "integration: break-glass access is protected, audited and expires; it has its own contract in L5."
  # rollback.emergency is never part of a role (direct grant with expiresAt and justification); m2m.* only for M2M clients.
servers:
  - url: http://localhost:3000/api/v2
security:
  - cookieAuth: []
  - bearerApiToken: []
# Global default applies to reads only; every mutation declares { cookieAuth + csrfToken } or bearer explicitly.
tags:
  - name: instance
  - name: workspaces
  - name: access
  - name: releases
  - name: deployments
  - name: promotions
  - name: m2m
  - name: trust
paths:
  /instance:
    get:
      tags: [ instance ]
      operationId: getInstance
      x-scope: instance
      x-gromesh-requirements: [ GW-ENV-01 ]
      x-required-permission: instance.read
      x-gromesh-planned: true
      summary: Identity of this instance (id, stage, signing key ids).
      responses:
        "200": { description: Instance, content: { application/json: { schema: { $ref: "#/components/schemas/Instance" } } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
  /instance/workspace-migration:
    get:
      tags: [ instance ]
      operationId: getWorkspaceMigrationReport
      x-scope: instance
      x-gromesh-requirements: [ GW-WS-02, GW-WS-10, GW-WS-14, GW-RBAC-05 ]
      x-required-permission: platform.admin
      x-gromesh-planned: true
      description: |
        What the N1 migration (each environment becomes the workspace with the same id) did and what still needs a
        person: slugs derived from environment names that were adjusted (collision, reserved, invalid) and must be
        reviewed before the first release, access that changed when the v1 roles moved (in N1 the environment roles
        become bindings, none a deny no grant overrides, and the global roles stay v1 roles: nothing is dropped or
        widened in N1; the list names every active global editor or viewer, who keeps every current workspace but
        reaches no workspace created from N2 on, since a new workspace grants no implicit access: only
        platform-admin and whoever is bound to it), and the routes kept legacy-preserved, with those without a path that the composition of N2 will refuse.
        It is also the pre-check of the uniqueness the instance needs (decision H-5): a key-auth key, JWT key,
        basic-auth username or SNI repeated across environments, in a draft, an active snapshot or a snapshot that a
        rollback could restore, is a blocker; each names only the workspaces, entities and snapshot versions involved,
        never a key, hash, username or server name. The instance-wide unique index of a kind is in force as soon as no
        two drafts repeat a value of that kind (until then the service checks every write and refuses a repetition as
        a conflict); a version holding a value another workspace holds is never restored (the rollback is a conflict).
        While any blocker exists the status is blocked and no second workspace can be composed on an instance; once
        the last one is gone the status becomes complete. Reading the report changes nothing: each replica puts in force
        the indexes no blocker holds back when it starts, under the lock that serializes the replicas, waiting at most
        2 s for writers and leaving it to the next start otherwise.
      responses:
        "200": { description: Report, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceMigrationReport" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /instance/api-v1-usage:
    get:
      tags: [ instance ]
      operationId: getApiV1Usage
      x-scope: instance
      x-gromesh-requirements: [ GW-RBAC-05 ]
      x-required-permission: platform.admin
      x-gromesh-planned: true
      description: |
        Calls to the administrative operations of v1 that the controlled migration (decision H-9) will cut (those
        under /environments/{envId} and /clusters/{clusterId}, and GET and POST /environments) in the last 30 days,
        per API token, plus the calls made by sessions (the current UI). The cut requires zero token calls in the
        window. Counted by day; never carries a token value, a path parameter or a body.
      responses:
        "200": { description: Usage, content: { application/json: { schema: { $ref: "#/components/schemas/ApiV1Usage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspaces:
    get:
      tags: [ workspaces ]
      operationId: listWorkspaces
      x-scope: instance
