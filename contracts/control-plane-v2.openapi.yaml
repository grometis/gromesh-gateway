    WorkspaceGlobalPluginWrite:
      type: object
      additionalProperties: false
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          not:
            pattern: ^gromesh-
          enum:
            - cors
            - ip-restriction
            - bot-detection
            - request-size-limiting
            - request-termination
            - request-transformer
            - response-transformer
            - correlation-id
            - redirect
            - grpc-gateway
            - grpc-web
            - standard-webhooks
            - key-auth
            - basic-auth
            - jwt
            - acl
            - ai-prompt-decorator
            - ai-prompt-guard
            - ai-prompt-template
            - ai-request-transformer
            - ai-response-transformer
            - ai-proxy
            - http-log
            - tcp-log
            - udp-log
            - syslog
            - loggly
            - datadog
            - statsd
            - opentelemetry
            - zipkin
            - prometheus
          description: Eligibility is necessary but not sufficient; mandatory platform names and privileged config remain forbidden to L9 as described in info.
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: Pinned catalog schema and semantic validation apply; secrets are write-only and references may resolve only within this Workspace. A new secret cannot be REDACTED.
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ http, https, grpc, grpcs, tcp, tls, tls_passthrough, udp ]
          description: Omission uses the pinned plugin defaults; supplied protocols must be supported by that plugin and preserve the effective per-route coverage.
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
      description: |
        A logical fallback for every current and future route of this Workspace, emulated only by the compiler
        (info, "Plugins" and "L9 composition"). No scope/serviceId/routeId/consumerId/workspaceId is accepted in
        the body: the URL owns the scope. One name per Workspace, including disabled records. enabled false
        disables only this logical record, never a mandatory platform plugin or a more specific instance.
    WorkspaceGlobalPluginConflict:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [ code ]
          properties:
            status: { const: 409 }
            code:
              enum: [ auto-publish, workspace-archived, concurrent-update, plugin-scope-conflict ]
              description: "auto-publish: v1 publishMode auto (switch to manual); workspace-archived: read-only; concurrent-update: bounded Workspace lock/retry exhausted (retry the request); plugin-scope-conflict: name already exists in this Workspace, enabled or disabled. No other Workspace is disclosed."
          if: { properties: { code: { const: plugin-scope-conflict } } }
          then:
            required: [ errors ]
            properties:
              errors:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [ path, message ]
                  properties:
                    path: { const: name }
                    message: { type: string }
    WorkspaceGlobalPluginValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [ code, errors ]
          properties:
            status: { const: 422 }
            code:
              enum: [ invalid-plugin, plugin-not-workspace-global, reserved-plugin, unsafe-auth-composition, consumer-required, foreign-consumer ]
              description: |
                invalid-plugin: body, pinned config/protocol/schema, tag, destination, reference or secret error;
                path is the offending field (config.<field>, protocols[i], tags[i], scope or name).
                plugin-not-workspace-global: name cannot preserve the admitted L9 semantics (path name), including
                rate-limiting, response-ratelimiting, proxy-cache, hmac-auth, ldap-auth/session (L10), oauth2,
                aws-lambda/azure-functions pending policy. reserved-plugin: mandatory platform name, gromesh-* or
                acme (path name), even when disabled; privileged capabilities separately require platform admin (403).
                unsafe-auth-composition: more than one effective mechanism on an affected route (path name);
                consumer-required: ACL has no effective same-Workspace consumer authenticator (path name).
                foreign-consumer: anonymous cannot resolve within this Workspace (path config.anonymous); the
                response never confirms whether a consumer exists in another Workspace. Paths use dot/index
                notation, never Kong's derived route ids; messages and paths contain no secret values.
            errors:
              type: array
              minItems: 1
              items:
                type: object
                required: [ path, message ]
                properties:
                  path: { type: string, minLength: 1 }
                  message: { type: string }
    ClusterAnalytics:
      type: object
      additionalProperties: false
      description: |
        The cluster's analytics as its agents report it (agent-protocol-v2 "Analytics guarantees"). state: degraded when
        a node's analyticsHealth is degraded in its latest status received within 60 s; unknown when a node has none
        that recent, or reports unknown; idle when every node is idle; healthy otherwise. Opening and clearing
        degraded are audited (cluster.analytics.degraded / cluster.analytics.cleared). Fingerprints count only from
        online nodes (latest status within 45 s, not deregistered); a replaced or stopped pod stops counting.
        collectorTokenShared: a current fingerprint of an online node of this cluster equals a current one of an
        online node of another cluster; collectorTokenUnverified: an online node of this cluster reported no
        fingerprints (both block the activation gate only); collectorTokenRotating: without a share, a match involves
        a previous fingerprint. Never affects convergence, containment or readiness.
      required: [state, collectorTokenShared, collectorTokenUnverified, collectorTokenRotating, nodes]
      properties:
        state: { enum: [healthy, idle, degraded, unknown] }
        collectorTokenShared: { type: boolean }
        collectorTokenUnverified: { type: boolean }
        collectorTokenRotating: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nodeId, state, reasons, observedAt]
            properties:
              nodeId: { type: string }
              state: { enum: [healthy, idle, degraded, unknown] }
              reasons: { type: array, items: { enum: [collector-unreachable, delivery-failing, backlog, events-missing, auth-refusals] } }
              observedAt: { type: [string, "null"], format: date-time }
              collectorTokenKeyHint: { type: [string, "null"], pattern: "^[0-9a-f]{8}$", description: "First 8 hex digits of the current fingerprint; never the token" }
    UnattributedAnalytics:
      type: object
      additionalProperties: false
      required: [from, to, total, byReason]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total: { type: integer, minimum: 0, description: Distinct request ids }
        byReason:
          type: object
          additionalProperties: false
          required: [conflicting-copies, foreign-instance, unknown-cluster, no-route, before-first-revision, route-not-deployed, ambiguous-route]
          properties:
            conflicting-copies: { type: integer, minimum: 0, description: "Ids whose stored copies differ; never attributed to a workspace" }
            foreign-instance: { type: integer, minimum: 0 }
            unknown-cluster: { type: integer, minimum: 0 }
            no-route: { type: integer, minimum: 0 }
            before-first-revision: { type: integer, minimum: 0 }
            route-not-deployed: { type: integer, minimum: 0 }
            ambiguous-route: { type: integer, minimum: 0 }
    InstanceCluster:
      type: object
      required:
        - id
        - name
        - status
        - nodes
        - createdAt
        - deliveryProtocol
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Name
        status:
          enum:
            - no-nodes
            - converged
            - converging
            - degraded
          description: converged = every EXPECTED node (registered and not deregistered) confirmed the current deployment revision with its hash; a node offline for more than 45 s makes the cluster degraded, never converged.
        nodes:
          type: array
          items:
            type: object
            required:
              - nodeId
              - hostname
              - state
              - appliedRevision
              - kongHealthy
              - lastSeenAt
              - online
            properties:
              nodeId:
                type: string
              hostname:
                type: string
              state:
                enum:
                  - applying
                  - applied
                  - failed
                  - idle
              epoch:
                type:
                  - integer
                  - "null"
              appliedRevision:
                type:
                  - integer
                  - "null"
              appliedHash:
                oneOf:
                  - $ref: "#/components/schemas/Digest"
                  - type: "null"
              kongHealthy:
                type: boolean
              lastSeenAt:
                type: string
                format: date-time
              online:
                type: boolean
              kongConfigHash:
                type: [ string, "null" ]
                pattern: ^[0-9a-f]{32}$
              evidence:
                $ref: "#/components/schemas/ConvergenceEvidence"
        analytics:
          $ref: "#/components/schemas/ClusterAnalytics"
        createdAt:
          type: string
          format: date-time
        deliveryProtocol:
          $ref: "#/components/schemas/DeliveryProtocolState"
        environmentId:
          type: [ string, "null" ]
          format: uuid
          description: Environment the cluster was created under (v1); selects its snapshots only while deliveryProtocol is v1.
      description: "A cluster belongs to the instance, not to a workspace: with deliveryProtocol v2 it receives the composition of every workspace; status refers to the flow of its deliveryProtocol."
    PackageService:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceServiceWrite"
    PackageRoute:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceRouteWrite"
    PackageConsumer:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
        - aclGroups
      properties:
        id:
          type: string
          format: uuid
        aclGroups:
          $ref: ./control-plane.openapi.yaml#/components/schemas/AclGroups/properties/groups
        spec:
          $ref: "#/components/schemas/WorkspaceConsumerWrite"
    PackagePlugin:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          oneOf:
            - $ref: "#/components/schemas/WorkspacePluginWrite"
            - allOf:
                - $ref: "#/components/schemas/WorkspaceGlobalPluginWrite"
              x-gromesh-phase: L9
    PackageUpstream:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceUpstreamWrite"
    PackageTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
        - upstreamId
      properties:
        id:
          type: string
          format: uuid
        upstreamId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceTargetWrite"
    PackageCertificate:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          allOf:
            - $ref: "#/components/schemas/WorkspaceCertificateWrite"
            - properties:
                key:
                  $ref: "#/components/schemas/VarRef"
    WorkspaceContent:
      type: object
      additionalProperties: false
      required:
        - services
        - routes
        - consumers
        - credentials
        - plugins
        - upstreams
        - targets
        - certificates
        - variables
      description: "Content of a release in the Gromesh model (never Kong's format): every entity of the workspace with its id, references by id inside the same content, secrets as VarRef. Every array is ordered by id (variables by name); contentDigest = \"sha256:\" + hex(SHA-256(UTF-8 bytes of the RFC 8785 JCS form of this object))."
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/PackageService"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PackageRoute"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/PackageConsumer"
        credentials:
          type: array
          maxItems: 0
          description: "Always empty: consumer credentials are environment values, created on each instance and never promoted."
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PackagePlugin"
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/PackageUpstream"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PackageTarget"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/PackageCertificate"
        variables:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/WorkspaceVariableDeclaration"
              - required:
                  - name
    Permission:
      enum:
        - instance.read
        - platform.admin
        - workspace.read
        - workspace.create
        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
        - rollback.emergency
        - m2m.read-state
        - m2m.submit
        - m2m.read-own-promotion
        - m2m.validate-own-promotion
        - m2m.pull
        - m2m.ack
        - m2m.attestation
    GrantablePermission:
      enum:
        - instance.read
        - platform.admin
        - workspace.read
        - workspace.create
        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
        - rollback.emergency
      description: M2M permissions belong only to M2M clients, never to a binding.
    RolePermission:
      enum:
        - instance.read
        - platform.admin
        - workspace.read
        - workspace.create
        - workspace.admin
        - workspace.request
        - gateway.write
        - values.write
        - members.read
        - members.manage
        - groups.read
        - groups.manage
        - release.publish
        - release.rollback
        - release.revoke
        - reconcile.execute
        - promotion.read
        - promotion.request
        - promotion.approve
        - promotion.execute
        - promotion.import
      description: rollback.emergency is never part of a role.
    RoleName:
      oneOf:
        - enum:
            - viewer
            - editor
            - publisher
            - approver
            - workspace-admin
            - platform-admin
        - type: string
          pattern: ^[a-z][a-z0-9-]{1,39}$
          not:
            enum:
              - viewer
              - editor
              - publisher
              - approver
              - workspace-admin
              - platform-admin
          x-gromesh-phase: L3
          description: Custom role (createRole, L3).
    M2mValidationSummary:
      type: object
      additionalProperties: false
      required:
        - result
        - checks
        - at
      properties:
        result:
          enum:
            - passed
            - blocked
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - result
            properties:
              name:
                $ref: "#/components/schemas/ValidationReport/properties/checks/items/properties/name"
              result:
                enum:
                  - passed
                  - blocked
                  - warning
        at:
          type: string
          format: date-time
      description: "Check names and results only: no detail, no content, no values. A conflict with another workspace is reported only as the check `conflicts` blocked."
    M2mPromotionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - packageId
        - status
        - kind
        - contentDigest
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PromotionStatus"
        kind:
          enum:
            - full
            - partial
        contentDigest:
          $ref: "#/components/schemas/Digest"
        validation:
          oneOf:
            - $ref: "#/components/schemas/M2mValidationSummary"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
      description: "What an M2M client may read about a promotion it submitted: never the diff, content, values, policy, approvals or identities."
    PromotionRecovery:
      type: object
      additionalProperties: false
      required:
        - kind
        - deploymentRevision
        - at
      properties:
        kind:
          enum:
            - rollback
            - emergency-rollback
            - reapply
        promotionId:
          type:
            - string
            - "null"
          format: uuid
          description: The rollback promotion (null for a reapply, which is a reconciliation).
        deploymentRevision:
          type: integer
        at:
          type: string
          format: date-time
      description: "How a failed promotion was recovered: a separate operation, linked here and in the audit of both. The execution keeps its original result: converged after a failed execution only through reapply, rolled-back only through a rollback promotion."
      allOf:
        - if:
            required:
              - kind
            properties:
              kind:
                enum:
                  - rollback
                  - emergency-rollback
          then:
            required:
              - promotionId
            properties:
              promotionId:
                type: string
          else:
            properties:
              promotionId:
                type: "null"
    EmergencyPostReviewStatus:
      enum:
        - pending
        - in-review
        - no-findings
        - findings
        - corrective-action
      description: Governance of an executed emergency rollback; independent of PromotionStatus.
      x-gromesh-transitions:
        initial:
          - pending
        terminal:
          - no-findings
          - findings
          - corrective-action
        transitions:
          - - pending
            - in-review
            - an eligible reviewer starts it (startEmergencyPostReview)
          - - in-review
            - pending
            - the reviewer withdraws, or loses eligibility (identity or binding change)
          - - in-review
            - no-findings
            - concluded without irregularities
          - - in-review
            - findings
            - concluded with irregularities, no corrective action applicable
          - - in-review
            - corrective-action
            - concluded with irregularities and a corrective action referenced
    EmergencyPostReview:
      type: object
      additionalProperties: false
      required:
        - id
        - promotionId
        - status
        - openedAt
        - reviewer
        - justification
        - correctiveAction
        - decidedAt
      description: Opened in the same transaction in which the emergency rollback starts executing, whatever the outcome. Every transition writes an audit event in its transaction. Pending and in-review post-reviews are alerted and listed until concluded.
      allOf:
        - if:
            properties:
              status:
                enum:
                  - in-review
                  - no-findings
                  - findings
                  - corrective-action
          then:
            properties:
              reviewer:
                type: object
        - if:
            properties:
              status:
                enum:
                  - no-findings
                  - findings
                  - corrective-action
          then:
            properties:
              justification:
                type: string
              decidedAt:
                type: string
          else:
            properties:
              justification:
                type: "null"
              decidedAt:
                type: "null"
        - if:
            properties:
              status:
                const: corrective-action
          then:
            properties:
              correctiveAction:
                type: string
                minLength: 1
          else:
            properties:
              correctiveAction:
                type: "null"
      properties:
        id:
          type: string
          format: uuid
        promotionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EmergencyPostReviewStatus"
        openedAt:
          type: string
          format: date-time
        reviewer:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - userId
                - personId
                - startedAt
              properties:
                userId:
                  type: string
                  format: uuid
                personId:
                  type: string
                  format: uuid
                startedAt:
                  type: string
                  format: date-time
            - type: "null"
        justification:
          type:
            - string
            - "null"
          minLength: 10
        correctiveAction:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Reference to the corrective action (ticket, follow-up promotion).
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
    WorkspaceGlobalPlugin:
      type: object
      additionalProperties: false
      description: Logical Workspace-global draft record, never a materialized Kong instance. Config secrets are REDACTED in reads, audit and diffs. No platform plugins are included.
      required:
        - id
        - name
        - enabled
        - config
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        config:
          type: object
        protocols:
          type: array
          items:
            type: string
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceGlobalPluginPage:
      type: object
      additionalProperties: false
      required: [ items, nextCursor ]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceGlobalPlugin" } }
        nextCursor: { type: [ string, "null" ] }
    WorkspaceHealthchecks:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks
      type: object
      unevaluatedProperties: false
      properties:
        active:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks/properties/active
              type: object
              unevaluatedProperties: false
        passive:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: ./control-plane.openapi.yaml#/components/schemas/Healthchecks/properties/passive
              type: object
              unevaluatedProperties: false
      description: Healthchecks of v1, closed at every level.
