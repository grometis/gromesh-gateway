        The explicit deployment of THIS instance (decision D4): composes every workspace's active release into a new
        deployment revision through the compiler, validates the whole configuration, fixes its configHash and
        kongConfigHash (agent protocol v2, "Applied revision and convergence evidence") and its expected nodes (the
        nodes of the clusters whose deliveryProtocol is v2), and serves it to them. A revision reaches a cluster only
        through the delivery rules (v2 protocol, admission and the activation gate); nothing is served to v1 or
        v2-pending clusters. expectedRevision guards against a concurrent deployment (409 when the current revision
        differs). Composition or validation failure: the deployment is rejected and nothing is served (422 with the
        paths). 409 workspaces-mode-disabled while the server's Workspaces mode is disabled; 409 when the deployment
        lease is held. Only on dev (403 in hml and prd, where promotions deploy). Requires release.publish in the
        instance scope (a grant on one workspace does not deploy the instance). Audited in the same transaction.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [ expectedRevision, reason ], properties: { expectedRevision: { type: [ integer, "null" ], minimum: 1 }, reason: { type: string, minLength: 1 } } } } } }
      responses:
        "201": { description: Deployment recorded and served, content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
        "409": { description: "Lease held, revision changed, or refused by the delivery rules", content: { application/problem+json: { schema: { anyOf: [ { $ref: "#/components/schemas/DeliveryProblem" }, { $ref: "#/components/schemas/Problem" } ] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /deployments/current:
    get:
      tags: [ deployments ]
      operationId: getCurrentDeployment
      x-scope: instance
      x-gromesh-requirements: [ GW-DEP-02, GW-DEP-05, GW-DEP-09 ]
      x-required-permission: instance.read
      x-gromesh-planned: true
      responses:
        "200": { description: Deployment and convergence, content: { application/json: { schema: { $ref: "#/components/schemas/Deployment" } } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
  /reconciliations:
    post:
      tags: [ deployments ]
      operationId: reconcile
      x-scope: instance
      x-gromesh-requirements: [ GW-PRM-04, GW-DEP-03, GW-DEP-05 ]
      x-required-permission: reconcile.execute
      x-gromesh-planned: true
      description: |
        Restores convergence of the configuration ALREADY AUTHORIZED on this instance (rodada 6, G-1): reapply of
        the current deployment's members as a NEW revision (same contentDigest per workspace), clearing
        permanent-failure marks. It selects no version, carries no content and never changes the desired state;
        there is no "accept observed state", no direct edit and no rollback here (rollback is rollbackRelease, normal
        or emergency, with its own rules). Checks: the current deployment exists and was created by an authorized
        operation; no member's contentDigest is revoked (409, use a rollback or a promotion); in prd each member's
        stored attestation passes keyTrust use=historical; the deployment lease is free (409). It never supersedes a
        converging deployment. Never triggered by a promotion. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ action, reason ], properties: { action: { const: reapply }, reason: { type: string, minLength: 1 } } }
      security: [ { cookieAuth: [], csrfToken: [] } ]
      responses:
        "201": { description: Reconciliation started }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
