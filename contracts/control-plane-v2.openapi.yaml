        re-checked (not revoked, not expired, scope covers the workspace) and so are the target restrictions
        (never active here, revoked digest, contentFirstActivatedAt too old, historical attestation not valid →
        409).
      security: [ { cookieAuth: [], csrfToken: [] } ]
      responses:
        "202": { description: Executing, content: { application/json: { schema: { $ref: "#/components/schemas/Execution" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
