        "422": { $ref: "#/components/responses/ValidationError" }
  /promotions/{promotionId}/execution:
    parameters: [ { $ref: "#/components/parameters/PromotionId" } ]
    post:
      tags: [ promotions ]
      operationId: executePromotion
      x-gromesh-workspaces-mode-disabled: refused-provisioning
      x-gromesh-requirements: [ GW-APR-06, GW-DEP-01, GW-DEP-02, GW-DEP-04, GW-PRV-01, GW-PRV-02, GW-PRV-03, GW-PRV-04, GW-ENV-03, GW-M2M-03, GW-M2M-05 ]
      x-required-permission: promotion.execute
      x-required-permission-alternatives:
        - { permission: rollback.emergency, when: "promotion.kind == emergency-rollback" }
      x-scope: promotion
      x-gromesh-planned: true
      description: |
        Session + CSRF only. Revalidates; a relevant change since approval (closed definition in info) invalidates the approvals or blocks. Needs the
        deployment lease (409 otherwise). Idempotent per promotion. The executor's verified person and account must
        differ from the confirmed requester's, and from every approver's unless the policy sets executorMayApprove
