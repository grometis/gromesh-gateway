    parameters: [ { $ref: "#/components/parameters/PromotionId" } ]
    post:
      tags: [ promotions ]
      operationId: executePromotion
      x-gromesh-requirements: [ GW-APR-06, GW-DEP-01, GW-DEP-02, GW-DEP-04, GW-PRV-01, GW-PRV-02, GW-PRV-03, GW-PRV-04, GW-ENV-03 ]
