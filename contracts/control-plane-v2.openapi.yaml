      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [ dryRun ], properties: { dryRun: { type: boolean }, expectedDiffDigest: { $ref: "#/components/schemas/Digest" } }, if: { properties: { dryRun: { const: false } } }, then: { required: [ expectedDiffDigest ] } } } } }
