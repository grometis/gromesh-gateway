          $ref: ./control-plane.openapi.yaml#/components/responses/AnalyticsUnavailable
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: workspace.read
      x-scope: workspace
      x-gromesh-planned: true
      x-gromesh-requirements:
        - GW-WS-12
        - GW-WS-16b
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
  /workspaces/{workspaceId}/requests:
    get:
      tags:
        - analytics
      operationId: listRequests
      description: |
        Request explorer over the same `requests` table, newest first. Credentials never reach the table (the
        pipeline strips them), so a record carries no header or query values: only the path. `clientIp` is
        masked for every role but admin.
      parameters:
        - $ref: ./control-plane.openapi.yaml#/components/parameters/AnalyticsFrom
        - $ref: ./control-plane.openapi.yaml#/components/parameters/AnalyticsTo
        - $ref: ./control-plane.openapi.yaml#/components/parameters/Limit
        - $ref: ./control-plane.openapi.yaml#/components/parameters/Cursor
        - name: status
          in: query
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: Exact status code; mutually exclusive with `statusClass`.
        - name: statusClass
          in: query
          schema:
            type: string
            enum:
              - 2xx
              - 3xx
              - 4xx
              - 5xx
        - $ref: ./control-plane.openapi.yaml#/components/parameters/RouteFilter
        - $ref: ./control-plane.openapi.yaml#/components/parameters/ServiceFilter
        - name: consumerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                $ref: ./control-plane.openapi.yaml#/components/schemas/RequestPage
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: ./control-plane.openapi.yaml#/components/responses/AnalyticsUnavailable
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: workspace.read
      x-scope: workspace
      x-gromesh-planned: true
      x-gromesh-requirements:
        - GW-WS-12
        - GW-WS-16b
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
  /clusters:
    get:
      tags:
        - deployments
      operationId: listClusters
      x-required-permission: instance.read
      x-scope: instance
      x-gromesh-planned: true
      x-gromesh-requirements:
        - GW-ENV-01
      responses:
        "200":
          description: Clusters of the instance
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InstanceCluster"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags:
        - deployments
      operationId: createCluster
      x-required-permission: platform.admin
      x-scope: instance
      x-gromesh-planned: true
      x-gromesh-requirements:
        - GW-ENV-01
      description: Every cluster of the instance receives the instance's current deployment (all Workspaces). Session + CSRF.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  $ref: ./control-plane.openapi.yaml#/components/schemas/Name
      responses:
        "201":
          description: Created (the registration token is shown once)
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workspaces/{workspaceId}/variables/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    put:
      tags:
        - workspaces
      operationId: declareWorkspaceVariable
      x-scope: workspace
      x-gromesh-requirements:
        - GW-ENV-05
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerApiToken: []
      x-required-permission: gateway.write
      x-gromesh-planned: true
      description: Creates or replaces the declaration in the draft (audited; marks the draft changed). Changing type or secret of a variable referenced by the draft answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceVariableDeclaration"
      responses:
        "200":
          description: Declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceVariable"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - workspaces
      operationId: deleteWorkspaceVariable
      x-scope: workspace
      x-gromesh-requirements:
        - GW-ENV-05
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerApiToken: []
      x-required-permission: gateway.write
      x-gromesh-planned: true
      description: 409 while any draft field references it. The instance's value is kept until the next release without the declaration is active.
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Conflict"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /promotions/{promotionId}/post-review/start:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    post:
      tags:
        - promotions
      operationId: startEmergencyPostReview
      x-gromesh-requirements:
        - GW-DEP-07
        - GW-DEP-08
        - GW-APR-04
      x-required-permission: promotion.approve
      x-scope: promotion
      x-gromesh-planned: true
      description: "Session + CSRF only. The caller becomes the reviewer (pending -> in-review). Eligible: a verified person with promotion.approve in the promotion's scope who is not the requester nor, unless the effective policy sets executorMayApprove, the executor (403). 409 unless the promotion is an emergency-rollback whose post-review is pending. Never changes the promotion's status."
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Post-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyPostReview"
        "409":
          $ref: "#/components/responses/Conflict"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /promotions/{promotionId}/post-review/decision:
    parameters:
      - $ref: "#/components/parameters/PromotionId"
    post:
      tags:
        - promotions
      operationId: decideEmergencyPostReview
      x-gromesh-requirements:
        - GW-DEP-07
        - GW-DEP-08
        - GW-APR-04
      x-required-permission: promotion.approve
      x-scope: promotion
      x-gromesh-planned: true
      description: Session + CSRF only. Only the reviewer who started it (403 otherwise), with eligibility re-checked. Concludes in-review as no-findings, findings or corrective-action (409 from any other state). Never changes the promotion's status, its execution or the deployment; a recovery is its own operation (rollbackRelease, reconcile).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - outcome
                - justification
              properties:
                outcome:
                  enum:
                    - no-findings
                    - findings
                    - corrective-action
                justification:
                  type: string
                  minLength: 10
                correctiveAction:
                  type: string
                  minLength: 1
                  maxLength: 2000
              if:
                properties:
                  outcome:
                    const: corrective-action
              then:
                required:
                  - correctiveAction
              else:
                not:
                  required:
                    - correctiveAction
      responses:
        "200":
          description: Post-review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyPostReview"
        "409":
          $ref: "#/components/responses/Conflict"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: gromesh_session }
    bearerApiToken: { type: http, scheme: bearer, description: "ggt_ API token" }
    m2mAssertion: { type: http, scheme: bearer, description: Short-lived access token from /m2m/token }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token, description: Session-bound token from GET /auth/csrf (current contract) }
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    PromotionId: { name: promotionId, in: path, required: true, schema: { type: string, format: uuid } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ClusterId: { name: clusterId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    NotFound: { description: Not found or invisible, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    Forbidden: { description: Forbidden, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    Unauthorized: { description: Unauthorized, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    Conflict: { description: Conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    ValidationError: { description: Validation error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    BadRequest: { description: Malformed request (OAuth2 error for the token endpoint), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  schemas:
    WorkspaceServiceWrite:
      allOf:
        - $ref: "#/components/schemas/WorkspaceServiceFields"
      unevaluatedProperties: false
      description: ServiceWrite of v1 scoped to a Workspace (revision C-27). host refuses the reserved .gromesh.internal suffix and the forbidden destinations (422 at `host`); upstreamId points to an upstream of the SAME Workspace (composite foreign key). protocol, host, port and path accept a VarRef.
    WorkspaceRouteWrite:
      type: object
      required:
        - name
        - serviceId
        - paths
      description: "RouteWrite of v1 scoped to a Workspace (revision C-27, decision D1). paths is required: the compiler prefixes every path with /<slug> (a regex path becomes ~/<slug>(?:<regex>)). By default the FULL path, prefix included, reaches the upstream (GET /tvro/recarga -> upstream /tvro/recarga); stripPath true is an explicit choice with Kong's semantics. serviceId must be a service of the same Workspace."
      properties:
        name:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Name
        serviceId:
          type: string
          format: uuid
        protocols:
          type: array
          items:
            type: string
            enum:
              - http
              - https
              - grpc
              - grpcs
          default:
            - http
            - https
        methods:
          type: array
          items:
            type: string
        hosts:
          type: array
          items:
            type: string
        paths:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^(/|~/)
            maxLength: 1024
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        stripPath:
          type: boolean
          default: false
        preserveHost:
          type: boolean
          default: false
        analyticsRetentionDays:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 7
          description: |
            How long this route's request analytics are kept, in days. Null or omitted uses the 7-day default;
            retention can never exceed 7 days. Responses and exports return `null` when unset (never the default).
            Applies only to rows written after the next publication, without changing retention for existing rows.
            Does not change path masking. The value reaches the data plane inside the compiled gateway
            configuration (compiler-internal); no other contract changes.
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
      additionalProperties: false
    WorkspaceRoute:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/Route
        - type: object
          required:
            - pathCompatibility
          properties:
            pathCompatibility:
              enum:
                - legacy-preserved
                - workspace-default
              readOnly: true
              description: "legacy-preserved: a route migrated from an environment keeps its strip_path until convertRoutePathCompatibility"
    WorkspaceRoutePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceRoute"
        nextCursor:
          type:
            - string
            - "null"
    WorkspacePluginWrite:
      type: object
      required:
        - name
        - config
        - scope
      properties:
        name:
          type: string
          minLength: 1
          not:
            pattern: ^gromesh-
        enabled:
          type: boolean
          default: true
        scope:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            serviceId:
              type: string
              format: uuid
            routeId:
              type: string
              format: uuid
            consumerId:
              type: string
              format: uuid
        config:
          type: object
        protocols:
          type: array
          items:
            type: string
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
      additionalProperties: false
      description: "PluginWrite of v1 scoped to a Workspace. The scope names at least one service, route or consumer of the same Workspace: a Workspace-wide plugin is createWorkspaceGlobalPlugin (L9). Names gromesh-* are reserved; privileged capabilities (pre/post-function, file-log, *_by_lua, ambient cloud credentials) are platform-only (403, B §3.4)."
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
              message:
                type: string
    Digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    Stage: { enum: [ dev, hml, prd ] }
    Instance:
      type: object
      required: [ id, stage, signingKeyIds ]
      properties: { id: { type: string, format: uuid }, stage: { $ref: "#/components/schemas/Stage" }, name: { type: string }, signingKeyIds: { type: array, items: { type: string } } }
    WorkspaceMigrationReport:
      type: object
      additionalProperties: false
      required: [ migratedAt, status, blockers, workspaces, accessChanges ]
      if: { properties: { status: { const: complete } } }
      then: { properties: { blockers: { maxItems: 0 } } }
      else: { properties: { blockers: { minItems: 1 } } }
      properties:
        migratedAt: { type: string, format: date-time }
        status: { enum: [ complete, blocked ] }
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ kind, occurrences ]
            properties:
              kind: { enum: [ key-auth-key, jwt-key, basic-auth-username, sni ] }
              occurrences:
                type: array
                minItems: 2
                items:
                  type: object
                  additionalProperties: false
                  required: [ workspaceId, source, entityType, entityId, snapshotVersion ]
                  properties:
                    workspaceId: { type: string, format: uuid }
                    source: { enum: [ draft, active-snapshot, rollback-candidate ] }
                    entityType: { enum: [ key-auth-credential, jwt-credential, basic-auth-credential, certificate ] }
                    entityId: { type: string, format: uuid }
                    snapshotVersion: { type: [ integer, "null" ], minimum: 1, description: null for the draft }
                  if: { properties: { source: { const: draft } } }
                  then: { properties: { snapshotVersion: { type: "null" } } }
                  else: { properties: { snapshotVersion: { type: integer } } }
        workspaces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ workspaceId, name, slug, slugStatus, legacyRoutes, routesWithoutPath ]
            properties:
              workspaceId: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              slugStatus:
                enum: [ derived, adjusted ]
                description: "adjusted: the name gave a colliding, reserved or invalid slug; the proposed slug needs review before the first release"
              slugReason: { enum: [ collision, reserved, invalid ] }
              legacyRoutes: { type: integer, minimum: 0, description: Routes kept pathCompatibility legacy-preserved }
              routesWithoutPath: { type: integer, minimum: 0, description: Routes the N2 composition refuses until they get a path }
            if: { properties: { slugStatus: { const: adjusted } } }
            then: { required: [ slugReason ] }
            else: { not: { required: [ slugReason ] } }
        accessChanges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ userId, globalRole, change ]
            properties:
              userId: { type: string, format: uuid }
              globalRole: { enum: [ editor, viewer ] }
              change:
                enum: [ implicit-access-dropped ]
                description: The user keeps every current workspace but no longer reaches workspaces created from N2 on, unless bound to them
    ApiV1Usage:
      type: object
      additionalProperties: false
      required: [ windowDays, since, sessionCalls, tokens ]
      properties:
        windowDays: { const: 30 }
        since: { type: string, format: date }
        sessionCalls: { type: integer, minimum: 0 }
        tokens:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ tokenId, tokenName, ownerId, calls, lastCalledOn ]
            properties:
              tokenId: { type: string, format: uuid }
              tokenName: { type: string }
              ownerId: { type: string, format: uuid }
              calls: { type: integer, minimum: 1 }
              lastCalledOn: { type: string, format: date }
    WorkspaceWrite:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,39}$
          description: Optional; derived from the name when absent (lowercase, no accents, spaces to hyphens). Reserved slugs rejected.
      additionalProperties: false
    Workspace:
      type: object
      required:
        - id
        - key
        - name
        - slug
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        slug:
          type: string
        id:
          type: string
          format: uuid
        key:
          type: string
          format: uuid
          description: Logical identity shared by the same workspace across instances.
        status:
          enum:
            - active
            - archived
        activeRelease:
          type:
            - integer
            - "null"
        provisionedByPromotion:
          type:
            - string
            - "null"
          format: uuid
    WorkspacePage:
      type: object
      required: [ items, nextCursor ]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Workspace" } }, nextCursor: { type: [ string, "null" ] } }
    WorkspaceRequestStatus:
      enum: [ pending, approved, rejected, cancelled ]
      x-gromesh-transitions:
        initial: [ pending ]
        terminal: [ approved, rejected, cancelled ]
        transitions:
          - [ pending, approved, "someone with workspace.create approves: workspace created" ]
          - [ pending, rejected, "rejected" ]
          - [ pending, cancelled, "the requester cancels" ]
    WorkspaceRequest:
      type: object
      required: [ id, status ]
      properties: { id: { type: string, format: uuid }, name: { type: string }, status: { $ref: "#/components/schemas/WorkspaceRequestStatus" }, requestedBy: { type: string }, decidedBy: { type: [ string, "null" ] } }
    WorkspaceVariable:
      type: object
      required: [ name, type, secret, required, hasValue ]
      properties: { name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }, type: { enum: [ string, host, port, url, certificate, privateKey, credential ] }, secret: { type: boolean }, required: { type: boolean }, hasValue: { type: boolean }, value: { type: [ string, "null" ], description: REDACTED when secret }, validation: { $ref: "#/components/schemas/WorkspaceVariableDeclaration/properties/validation" } }
    RoleBindingWrite:
      type: object
      required: [ subjectType, subjectId ]
      oneOf:
        - { required: [ role ], not: { required: [ permissions ] } }
        - { required: [ permissions ], not: { required: [ role ] }, properties: { permissions: { minItems: 1 } } }
      if: { required: [ expiresAt ], properties: { expiresAt: { type: string } } }
      then: { required: [ justification ], properties: { justification: { type: string, minLength: 1 } } }
      allOf:
        - if: { required: [ permissions ], properties: { permissions: { contains: { const: rollback.emergency } } } }
          then: { required: [ expiresAt, justification ], properties: { subjectType: { const: user }, expiresAt: { type: string }, justification: { type: string, minLength: 10 } } }
      description: rollback.emergency is never part of a role; it is granted only directly to a user, with expiresAt (at most 7 days, checked by the service) and justification (rodada 5, F-3). Phases are marked on the parts they deliver (subjectType group L2, effect deny L3, expiresAt L4), with the core exceptions stated there.
      properties:
        subjectType:
          oneOf:
            - { const: user }
            - { const: group, x-gromesh-phase: L2 }
        subjectId: { type: string, format: uuid }
        role:
          $ref: "#/components/schemas/RoleName"
        permissions: { type: array, items: { $ref: "#/components/schemas/GrantablePermission" } }
        effect:
          default: allow
          oneOf:
            - { const: allow }
            - const: deny
              x-gromesh-phase: L3
              x-gromesh-core-exception: "Read-only deny bindings created by the N1 migration from environment role none; the core API never writes deny (422)."
        expiresAt:
          type: [ string, "null" ]
          format: date-time
          x-gromesh-phase: L4
          x-gromesh-core-exception: "Required on a direct user binding holding rollback.emergency (at most 7 days); any other expiresAt answers 422 in the core."
          x-gromesh-core-profile: { if: { required: [ expiresAt ] }, then: { required: [ permissions ], properties: { permissions: { contains: { const: rollback.emergency } } } } }
        justification: { type: [ string, "null" ] }
      additionalProperties: false
    RoleBinding:
      description: Response shape (not composed with RoleBindingWrite, which forbids extra properties).
      type: object
      required:
        - id
        - scope
        - subjectType
        - subjectId
        - effect
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: object
          properties:
            type:
              enum:
                - instance
                - workspace
            workspaceId:
              type:
                - string
                - "null"
              format: uuid
        grantedBy:
          type: string
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        subjectType:
          enum:
            - user
            - group
        subjectId:
          type: string
          format: uuid
        role:
          type:
            - string
            - "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        effect:
          enum:
            - allow
            - deny
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        justification:
          type:
            - string
            - "null"
    LoginIdentity:
      type: object
      required: [ id, kind, pendingLink ]
      properties: { id: { type: string, format: uuid }, kind: { enum: [ local, oidc ] }, email: { type: string, format: email }, issuer: { type: [ string, "null" ] }, subject: { type: [ string, "null" ] }, pendingLink: { type: boolean } }
    Person:
      type: object
      required: [ id, displayName, verified ]
      properties: { id: { type: string, format: uuid }, displayName: { type: string }, verified: { type: boolean }, corporateId: { type: [ string, "null" ] }, verifiedAt: { type: [ string, "null" ], format: date-time } }
    Group:
      type: object
      required: [ id, name ]
      properties: { id: { type: string, format: uuid }, name: { type: string }, description: { type: string }, source: { enum: [ local, idp ] } }
    Release:
      type: object
      required: [ workspaceId, version, contentDigest, origin, contentOriginVersion, contentFirstActivatedAt, originPromotionId, contentRevoked, createdAt ]
      allOf:
        - if: { properties: { origin: { const: promotion } } }
          then: { properties: { originPromotionId: { type: string } } }
      description: "A rollback copy inherits originPromotionId from the content it copies: a promotion id for promoted content, null for content published locally (dev) or migrated (R7-3)."
      properties:
        workspaceId: { type: string, format: uuid }
        version: { type: integer }
        contentDigest: { $ref: "#/components/schemas/Digest" }
        origin: { enum: [ local, promotion, rollback, tombstone, migration ] }
        promotionId: { type: [ string, "null" ], format: uuid }
        rollbackOf: { type: [ integer, "null" ] }
        contentOriginVersion: { type: integer, description: "First release of this workspace with this contentDigest on this instance; a rollback copy keeps it (G-2)." }
        contentFirstActivatedAt: { type: [ string, "null" ], format: date-time, description: "From content_activations, recorded when that content first converged here; null = never converged here, which makes it ineligible for an emergency rollback (no fallback to the copy's createdAt)." }
        originPromotionId: { type: [ string, "null" ], format: uuid, description: "The authorization that first brought this content; null only for origin local or migration (dev and migrated releases), a rollback copy of promoted content carries it." }
        contentRevoked: { type: boolean, readOnly: true, description: "A ContentRevocation exists for this contentDigest." }
        message: { type: string }
        createdBy: { type: object }
        createdAt: { type: string, format: date-time }
    DeploymentState:
      enum: [ composed, rejected, active, converging, converged, degraded, failed, superseded ]
      x-gromesh-transitions:
        initial: [ composed ]
        terminal: [ rejected, superseded ]
        transitions:
          - [ composed, rejected, "composition or validator failed (nothing applied; lease released)" ]
          - [ composed, active, "recorded, expected nodes fixed, agents notified" ]
          - [ active, converging, "some node has not applied yet" ]
          - [ active, converged, "every expected node already confirmed the revision" ]
          - [ converging, converged, "every expected node applied with revision and hash" ]
          - [ converging, degraded, "node failed (400/413), offline > 45 s or Kong unhealthy" ]
          - [ degraded, converging, "agent retry or node back" ]
          - [ degraded, failed, "convergence deadline (lease released)" ]
          - [ degraded, superseded, "reconciliation (reapply, same content) or rollback creates a new deployment" ]
          - [ failed, superseded, "reconciliation (reapply, same content) or rollback creates a new deployment" ]
          - [ converged, superseded, "new deployment" ]
          - [ converging, superseded, "emergency rollback only (owning promotion -> failed, reason superseded)" ]
    Deployment:
      type: object
      required: [ epoch, revision, state, members, configHash, convergence ]
      properties:
        epoch: { type: integer, minimum: 1 }
        revision: { type: integer }
        state: { $ref: "#/components/schemas/DeploymentState" }
        members: { type: array, items: { type: object, required: [ workspaceId, releaseVersion, contentDigest ], properties: { workspaceId: { type: string, format: uuid }, releaseVersion: { type: integer }, contentDigest: { $ref: "#/components/schemas/Digest" } } } }
        configHash: { $ref: "#/components/schemas/Digest" }
        convergence: { enum: [ converged, converging, degraded, no-nodes ] }
        clusters: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, status: { enum: [ converged, converging, degraded, no-nodes ] }, nodes: { type: array, items: { type: object, properties: { nodeId: { type: string }, state: { enum: [ applying, applied, failed, idle ] }, appliedRevision: { type: [ integer, "null" ] }, online: { type: boolean } } } } } } }
    PromotionRequest:
      description: Both kinds name the source release (deployed and converged on the source); partial adds a non-empty selection, whose dependency closure the TARGET recomputes over that release.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ kind, releaseVersion ]
          properties: { kind: { const: full }, releaseVersion: { type: integer, minimum: 1 }, message: { type: string } }
        - type: object
          additionalProperties: false
          x-gromesh-phase: L7
          description: Individual publication (L7); the core answers 422.
          required: [ kind, releaseVersion, selection ]
          properties:
            kind: { const: partial }
            releaseVersion: { type: integer, minimum: 1 }
            selection: { type: array, minItems: 1, items: { type: object, additionalProperties: false, required: [ kind, id, change ], properties: { kind: { enum: [ services, routes, plugins, consumers, upstreams, certificates ] }, id: { type: string, format: uuid }, change: { enum: [ upsert, removed ] } } } }
            message: { type: string }
    PromotionStatus:
      enum:
        - received
        - awaiting-requester-confirmation
        - awaiting-emergency-execution
        - validating
        - blocked
        - awaiting-approval
        - approved
        - rejected
        - expired
        - cancelled
        - executing
        - deploying
        - converged
        - failed
        - rolled-back
      description: Operational state only; the governance of an emergency rollback is EmergencyPostReview, which never changes it. failed is final only when nobody acts (it stays visible until reconciliation or rollback). converged on hml enables the attestation for prd.
      x-gromesh-transitions:
        initial:
          - received
          - validating
        terminal:
          - converged
          - rejected
          - expired
          - cancelled
          - rolled-back
        transitions:
          - - received
            - awaiting-requester-confirmation
            - diff computed on the target; approvers not notified yet
          - - awaiting-requester-confirmation
            - validating
            - requester confirms authenticated on the target (session + CSRF)
          - - awaiting-requester-confirmation
            - awaiting-requester-confirmation
            - confirmation refused (requester-mismatch, audited)
          - - awaiting-requester-confirmation
            - expired
            - confirmationTtl
          - - awaiting-requester-confirmation
            - cancelled
            - cancel
          - - validating
            - blocked
            - validation failed
          - - validating
            - awaiting-approval
            - validation passed
          - - validating
            - awaiting-emergency-execution
            - emergency-rollback validated (no prior approval)
          - - blocked
            - validating
            - revalidate after a separate reconciliation
          - - blocked
            - cancelled
            - cancel
          - - awaiting-approval
            - awaiting-approval
            - approval recorded, approvers missing
          - - awaiting-approval
            - rejected
            - an approver rejects
          - - awaiting-approval
            - approved
            - minimum of distinct approvers reached
          - - awaiting-approval
            - expired
            - request deadline
          - - awaiting-approval
            - validating
            - "relevant change on the target: approvals invalidated"
          - - awaiting-approval
            - awaiting-requester-confirmation
            - "persons linked, unlinked or merged: confirmation invalidated"
          - - approved
            - expired
            - approval validity
          - - approved
            - executing
            - executor (session, promotion.execute, verified person, separation of duties)
          - - approved
            - cancelled
            - cancel
          - - awaiting-emergency-execution
            - executing
            - second verified person with rollback.emergency or promotion.execute (or the requester with emergencySelfExecution)
          - - awaiting-emergency-execution
            - expired
            - 1 h
          - - executing
            - blocked
            - pre-execution revalidation failed
          - - executing
            - awaiting-approval
            - "diff or policy changed: approvals invalidated"
          - - executing
            - deploying
            - local release and deployment created (idempotent by promotionId)
          - - executing
            - failed
            - emergency rollback superseded, or failed before deploying (Execution.failureReason)
          - - deploying
            - converged
            - deployment converged in time (every node confirmed the revision)
          - - deploying
            - failed
            - permanent node failure, deadline, or superseded by an emergency rollback
          - - failed
            - rolled-back
            - rollback (approved or emergency, its own operation)
          - - failed
            - converged
            - authorized reapply (new revision, same content) converges
    Promotion:
      type: object
      required:
        - id
        - packageId
        - status
        - kind
        - proofUse
        - contentDigest
        - workspaceKey
        - slug
      properties:
        id:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        direction:
          enum:
            - incoming
            - outgoing
        status:
          $ref: "#/components/schemas/PromotionStatus"
        kind:
          oneOf:
            - const: full
            - const: partial
              x-gromesh-phase: L7
            - const: rollback
            - const: emergency-rollback
        proofUse:
          enum:
            - new
            - historical
          description: Fixed at creation from kind (full/partial → new; rollback, emergency-rollback → historical) and used unchanged at validation, approval, execution and recovery (F-4).
        workspaceKey:
          type: string
          format: uuid
        slug:
          type: string
        sourceInstanceId:
          type: string
          format: uuid
        contentDigest:
          $ref: "#/components/schemas/Digest"
        selectionDigest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        resultDigest:
          $ref: "#/components/schemas/Digest"
        diffDigest:
          $ref: "#/components/schemas/Digest"
        valuesDigest:
          $ref: "#/components/schemas/Digest"
        candidateDigest:
          $ref: "#/components/schemas/Digest"
        baseRevision:
          type:
            - integer
            - "null"
        provisioning:
          type: boolean
          description: True when the workspace does not exist in the target yet.
        risk:
          enum:
            - low
            - medium
            - high
            - critical
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        includedDependencies:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              id:
                type: string
              reason:
                type: string
        effectivePolicy:
          $ref: "#/components/schemas/EffectivePolicy"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        validations:
          type: array
          items:
            $ref: "#/components/schemas/ValidationReport"
        execution:
          oneOf:
            - $ref: "#/components/schemas/Execution"
            - type: "null"
        declaredRequester:
          $ref: "#/components/schemas/Identity"
        declaredAuthors:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
        requester:
          oneOf:
            - $ref: "#/components/schemas/ConfirmedRequester"
            - type: "null"
          description: Set by the TARGET on requester-confirmation; null before.
        postReview:
          oneOf:
            - $ref: "#/components/schemas/EmergencyPostReview"
            - type: "null"
          description: Only for kind emergency-rollback, from execution on.
        recoveredBy:
          oneOf:
            - $ref: "#/components/schemas/PromotionRecovery"
            - type: "null"
      allOf:
        - if:
            properties:
              kind:
                const: emergency-rollback
          then:
            properties:
              status:
                not:
                  enum:
                    - awaiting-approval
                    - approved
                    - rejected
            if:
              properties:
                status:
                  not:
                    enum:
                      - received
                      - awaiting-requester-confirmation
                      - validating
                      - blocked
                      - expired
                      - cancelled
                      - awaiting-emergency-execution
            then:
              required:
                - postReview
              properties:
                postReview:
                  $ref: "#/components/schemas/EmergencyPostReview"
          else:
            properties:
              status:
                not:
                  const: awaiting-emergency-execution
              postReview:
                type: "null"
        - if:
            properties:
              status:
                enum:
                  - deploying
                  - converged
                  - failed
                  - rolled-back
            required:
              - status
          then:
            required:
              - execution
            properties:
              execution:
                $ref: "#/components/schemas/Execution"
        - if:
            properties:
              status:
                const: rolled-back
            required:
              - status
          then:
            required:
              - recoveredBy
            properties:
              recoveredBy:
                $ref: "#/components/schemas/PromotionRecovery"
        - if:
            required:
              - status
            properties:
              status:
                const: deploying
          then:
            required:
              - execution
            properties:
              execution:
                required:
                  - result
                properties:
                  result:
                    const: deploying
              recoveredBy:
                type: "null"
        - if:
            required:
              - status
            properties:
              status:
                const: failed
          then:
            required:
              - execution
            properties:
              execution:
                required:
                  - result
                properties:
                  result:
                    const: failed
              recoveredBy:
                type: "null"
        - if:
            required:
              - status
            properties:
              status:
                const: converged
          then:
            required:
              - execution
            oneOf:
              - properties:
                  execution:
                    properties:
                      result:
                        const: converged
                  recoveredBy:
                    type: "null"
              - required:
                  - recoveredBy
                properties:
                  execution:
                    properties:
                      result:
                        const: failed
                  recoveredBy:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        const: reapply
        - if:
            required:
              - status
            properties:
              status:
                const: rolled-back
          then:
            required:
              - execution
            properties:
              execution:
                required:
                  - result
                properties:
                  result:
                    const: failed
              recoveredBy:
                required:
                  - kind
                properties:
                  kind:
                    enum:
                      - rollback
                      - emergency-rollback
    Change:
      type: object
      required: [ kind, id, change, risk ]
      properties: { kind: { type: string }, id: { type: string }, label: { type: string }, change: { enum: [ added, modified, removed ] }, risk: { enum: [ low, medium, high, critical ], description: "Risk of the change, computed by the target. critical: deletion of a route, service or consumer, a change to an authentication or authorization plugin, a credential revocation, a change to a mandatory plugin; high: a change affecting several routes, or to upstreams or targets in prd; medium and low otherwise. Extra approvals by risk are L6 (ApprovalPolicy.riskRules)." }, before: { type: [ object, "null" ] }, after: { type: [ object, "null" ] } }
    EffectivePolicy:
      type: object
      required: [ version, minApprovals, authorMayApprove, executorMayApprove, emergencySelfExecution ]
      description: Resolved values, the most restrictive of the sources (booleans that relax independence are true only when every source allows it; emergencySelfExecution comes only from the instance). The execution records this version in the audit.
      properties: { version: { type: integer }, minApprovals: { type: integer, minimum: 1 }, eligibleRoles: { type: array, items: { $ref: "#/components/schemas/RoleName" } }, requiredRoles: { type: array, items: { $ref: "#/components/schemas/RoleName" } }, approvalValidityHours: { type: integer }, authorMayApprove: { type: boolean }, executorMayApprove: { type: boolean }, emergencySelfExecution: { type: boolean }, emergencyMaxReleaseAgeDays: { type: integer, minimum: 1 }, sources: { type: array, items: { oneOf: [ { const: instance }, { const: workspace }, { const: risk, x-gromesh-phase: L6 } ] } } }
    ApprovalWrite:
      type: object
      additionalProperties: false
      required: [ decision, contentDigest, diffDigest, baseRevision, policyVersion, valuesDigest, candidateDigest ]
      properties: { decision: { enum: [ approve, reject ] }, contentDigest: { $ref: "#/components/schemas/Digest" }, diffDigest: { $ref: "#/components/schemas/Digest" }, baseRevision: { type: [ integer, "null" ] }, policyVersion: { type: integer }, valuesDigest: { $ref: "#/components/schemas/Digest" }, candidateDigest: { $ref: "#/components/schemas/Digest" }, comment: { type: string } }
    ApprovalState:
      enum: [ recorded, invalidated, expired, consumed ]
      x-gromesh-transitions:
        initial: [ recorded ]
        terminal: [ invalidated, expired, consumed ]
        transitions:
          - [ recorded, invalidated, "diffDigest, policyVersion, valuesDigest, candidateDigest, contentDigest or baseRevision changed" ]
          - [ recorded, expired, "validity" ]
          - [ recorded, consumed, "used by the execution (never reused by another promotion)" ]
    Approval:
      description: Response shape (not composed with ApprovalWrite, which forbids extra properties).
      type: object
      required: [ id, state, approver, at, decision, contentDigest, diffDigest, baseRevision, policyVersion, valuesDigest, candidateDigest ]
      properties: { id: { type: string, format: uuid }, approver: { type: object, required: [ userId, personId ], properties: { userId: { type: string, format: uuid }, personId: { type: string, format: uuid }, displayName: { type: string } } }, at: { type: string, format: date-time }, decision: { enum: [ approve, reject ] }, contentDigest: { $ref: "#/components/schemas/Digest" }, diffDigest: { $ref: "#/components/schemas/Digest" }, baseRevision: { type: [ integer, "null" ] }, policyVersion: { type: integer }, valuesDigest: { $ref: "#/components/schemas/Digest" }, candidateDigest: { $ref: "#/components/schemas/Digest" }, comment: { type: string }, invalidatedAt: { type: [ string, "null" ], format: date-time }, invalidatedReason: { type: [ string, "null" ] }, state: { $ref: "#/components/schemas/ApprovalState" } }
    ValidationReport:
      type: object
      required: [ id, kind, result, checks, at ]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [ pre-approval, pre-execution ] }
        result: { enum: [ passed, blocked ] }
        checks: { type: array, items: { type: object, required: [ name, result ], properties: { name: { enum: [ authentication, provenance, replay, stage-chain, attestation, requester, base-revision, target-integrity, dependencies, conflicts, network-destinations, compile, convergence, values, policy ] }, result: { enum: [ passed, blocked, warning ] }, detail: { type: string } } } }
        targetDeploymentRevision: { type: integer }
        at: { type: string, format: date-time }
    Execution:
      type: object
      required:
        - promotionId
        - result
        - executedBy
        - startedAt
      allOf:
        - if:
            properties:
              result:
                const: failed
          then:
            required:
              - failureReason
            properties:
              failureReason:
                type: string
          else:
            properties:
              failureReason:
                type: "null"
      properties:
        promotionId:
          type: string
          format: uuid
        result:
          enum:
            - deploying
            - converged
            - failed
        failureReason:
          enum:
            - node-failure
            - deadline
            - partial
            - superseded
            - revalidation
            - null
          description: "partial: some expected nodes applied and others did not before the deadline; superseded: replaced by an emergency rollback (only that may supersede a converging deployment)."
        releaseVersion:
          type: integer
        deploymentRevision:
          type: integer
        executedBy:
          type: object
          required:
            - userId
            - personId
          properties:
            userId:
              type: string
              format: uuid
            personId:
              type: string
              format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
    WorkspaceStateSummary:
      type: object
      additionalProperties: false
      required:
        - workspaceKey
        - activeRelease
        - deploymentRevision
        - convergence
      properties:
        workspaceKey:
          type: string
          format: uuid
        activeRelease:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - version
                - contentDigest
              properties:
                version:
                  type: integer
                contentDigest:
                  $ref: "#/components/schemas/Digest"
        deploymentRevision:
          type: integer
        convergence:
          enum:
            - converged
            - converging
            - degraded
            - no-nodes
      description: "The only state an M2M client reads: no content, values, diff, identities or administrative data."
    SignedPackage:
      allOf:
        - $ref: ./agent-protocol-v2.openapi.yaml#/components/schemas/Jws
      description: |
        Flattened JWS JSON serialization (RFC 7515) with ATTACHED payload; protected header {alg: EdDSA, kid, typ:
        gromesh-package+json, pkgVersion: 1}. payload = base64url(UTF-8 bytes of the RFC 8785 (JCS) canonical JSON of
        PackagePayload). The verifier checks the signature over the received bytes before parsing and rejects
        duplicated keys. The byte-level vector is contracts/examples/signed-package.example.json.
    PackagePayload:
      type: object
      required: [ packageId, sourceInstanceId, sourceStage, targetStage, workspaceKey, slug, kind, sourceReleaseVersion, createdAt, expiresAt, nonce, content, contentDigest, requestedBy, authors ]
      allOf:
        - if: { properties: { targetStage: { const: prd } } }
          then: { required: [ attestations ], properties: { sourceStage: { const: hml }, attestations: { minItems: 1, maxItems: 1 } } }
        - if: { properties: { targetStage: { const: hml } } }
          then: { properties: { sourceStage: { const: dev } } }
        - if: { properties: { kind: { const: partial } } }
          then: { required: [ selection, selectionDigest ], properties: { selection: { minItems: 1 } } }
      properties:
        packageId: { type: string, format: uuid }
        sourceInstanceId: { type: string, format: uuid }
        sourceStage: { $ref: "#/components/schemas/Stage" }
        targetStage:
          enum:
            - hml
            - prd
        workspaceKey: { type: string, format: uuid }
        slug: { type: string }
        kind:
          oneOf:
            - { const: full }
            - { const: partial, x-gromesh-phase: L7 }
        baseRevision: { type: [ integer, "null" ] }
        sourceReleaseVersion: { type: integer, minimum: 1 }
        selection: { type: array, items: { type: object, additionalProperties: false, required: [ kind, id, change ], properties: { kind: { type: string }, id: { type: string, format: uuid }, change: { enum: [ upsert, removed ] } } } }
        selectionDigest: { $ref: "#/components/schemas/Digest" }
        content:
          $ref: "#/components/schemas/WorkspaceContent"
        contentDigest: { $ref: "#/components/schemas/Digest" }
        attestations: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/Attestation" }, description: "To prd exactly one, covering THIS package's contentDigest (hml's converged release). prd executes only when its own recomputed resultDigest equals contentDigest (B §4.2, E-5); no choice among attestations." }
        requestedBy: { $ref: "#/components/schemas/Identity" }
        authors: { type: array, items: { $ref: "#/components/schemas/Identity" }, description: Declarative; the target never decides who may approve from this list alone. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        nonce: { type: string }
      unevaluatedProperties: false
    Attestation:
      type: object
      description: |
        Issued by hml for a release of the workspace that converged there. contentDigest is the digest of THAT hml
        release (the result in hml, not the package hml received). jws = flattened JWS (EdDSA, hml key) whose payload
        is the JCS canonical JSON of every other field of this object (issuer, workspaceKey, contentDigest,
        deploymentRevision, clusters with nodes and applied revisions, promotionId, authorsDigest, convergedAt); the
        verifier checks the jws and that its payload equals those fields. In a package to prd it must cover the
        package's contentDigest, which must equal prd's recomputed resultDigest, checked at validation and again at
        execution. prd stores it with the release it proved (releases.attestation_id); a rollback to that release
        presents it again while the hml key is not revoked.
      required: [ issuerInstanceId, issuerStage, workspaceKey, contentDigest, deploymentRevision, clusters, promotionId, authorsDigest, convergedAt, jws ]
      properties: { issuerInstanceId: { type: string, format: uuid }, issuerStage: { const: hml }, workspaceKey: { type: string, format: uuid }, contentDigest: { $ref: "#/components/schemas/Digest" }, deploymentRevision: { type: integer }, clusters: { type: array, minItems: 1, items: { type: object, required: [ clusterId, nodes ], properties: { clusterId: { type: string, format: uuid }, nodes: { type: array, minItems: 1, items: { type: object, required: [ nodeId, appliedRevision ], properties: { nodeId: { type: string }, appliedRevision: { type: integer } } } } } } }, promotionId: { type: string, format: uuid }, authorsDigest: { $ref: "#/components/schemas/Digest" }, convergedAt: { type: string, format: date-time }, jws: { $ref: ./agent-protocol-v2.openapi.yaml#/components/schemas/Jws } }
    Identity:
      description: Login identity as known by the instance that declares it. The receiving instance maps it to its own persons; it never decides who may approve from it alone.
      oneOf:
        - { type: object, additionalProperties: false, x-gromesh-phase: L5, required: [ kind, issuer, subject ], properties: { kind: { const: oidc }, issuer: { type: string, format: uri }, subject: { type: string, minLength: 1 }, email: { type: string, format: email }, displayName: { type: string } } }
        - { type: object, additionalProperties: false, required: [ kind, email ], properties: { kind: { const: local }, email: { type: string, format: email }, corporateId: { type: string, minLength: 1, maxLength: 128, description: "Declared by the source (its verified person's corporate id). Audit and mismatch only; the target never trusts it to grant anything." }, displayName: { type: string } } }
    ConfirmedRequester:
      type: object
      required: [ userId, personId, confirmedAt ]
      properties: { userId: { type: string, format: uuid }, personId: { type: string, format: uuid }, confirmedAt: { type: string, format: date-time } }
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required: [ minApprovals, eligibleRoles ]
      properties: { version: { type: integer, readOnly: true }, minApprovals: { type: integer, minimum: 1 }, eligibleRoles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RoleName" } }, requiredRoles: { type: array, items: { $ref: "#/components/schemas/RoleName" } }, approvalValidityHours: { type: integer, minimum: 1 }, confirmationTtlHours: { type: integer, minimum: 1, default: 24 }, authorMayApprove: { type: boolean }, executorMayApprove: { type: boolean, default: false, description: "The executor is never the confirmed requester; with false (default) it is also none of the approvers. A workspace policy can only turn it off." }, emergencySelfExecution: { type: boolean, default: false, description: "Instance policy only (422 on a workspace policy): the holder of rollback.emergency may execute the emergency rollback without a second person." }, emergencyMaxReleaseAgeDays: { type: integer, minimum: 1, maximum: 365, default: 30 }, riskRules: { x-gromesh-phase: L6, description: "Extra approvals by change risk (L6); the core answers 422.", type: array, items: { type: object, additionalProperties: false, required: [ minRisk, extraApprovals ], properties: { minRisk: { enum: [ medium, high, critical ] }, extraApprovals: { type: integer, minimum: 1 } } } } }
    RoleWrite:
      type: object
      additionalProperties: false
      required: [ name, permissions ]
      properties: { name: { type: string, pattern: "^[a-z][a-z0-9-]{1,39}$", not: { enum: [ viewer, editor, publisher, approver, workspace-admin, platform-admin ] } }, displayName: { type: string }, permissions: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RolePermission" } } }
    Role:
      description: Response shape (not composed with RoleWrite, which forbids extra properties).
      type: object
      required: [ id, name, permissions, builtin ]
      properties: { id: { type: string, format: uuid }, name: { type: string }, displayName: { type: string }, permissions: { type: array, items: { type: string } }, builtin: { type: boolean } }
    ClusterIsolation:
      type: object
      required: [ clusterId, pods, pendencies ]
      properties:
        clusterId: { type: string, format: uuid }
        pods:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ podUid, bootId, podName, nodeName, state, admission, reporting, lastSeq ]
            properties:
              podUid: { type: string, format: uuid }
              bootId: { type: string, format: uuid }
              podName: { type: string }
              nodeName: { type: string }
              admissionId: { type: [ string, "null" ], format: uuid }
              state: { $ref: "./agent-protocol-v2.openapi.yaml#/components/schemas/PodIsolationState" }
              admission: { enum: [ requested, refused, open, closed, closed-without-proof ] }
              reporting: { enum: [ reporting, communication-failure, unconfirmed-isolation, closed ] }
              kongStopConfirmed: { type: [ boolean, "null" ] }
              lastSeq: { type: integer, minimum: 0 }
              lastReportAt: { type: [ string, "null" ], format: date-time }
              leaseRemainingMs: { type: [ integer, "null" ], minimum: 0, description: "Remaining lease validity measured by the probe in the node's CLOCK_BOOTTIME at report time; never compared across nodes" }
              lastConclusiveAt: { type: [ string, "null" ], format: date-time }
              failedCapabilities: { type: array, items: { enum: [ CAP-1, CAP-2, CAP-3, CAP-4, CAP-5, CAP-6, CAP-7, guard-canary ] } }
        pendencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ id, kind, scope, openedAt, releasable ]
            properties:
              id: { type: string, format: uuid }
              kind: { enum: [ confirmed-violation, communication-failure, unconfirmed-isolation ] }
              scope: { enum: [ cluster, node ] }
              nodeName: { type: [ string, "null" ] }
              podUid: { type: [ string, "null" ], format: uuid }
              capability: { type: [ string, "null" ] }
              openedAt: { type: string, format: date-time }
              releasable: { type: boolean, description: "false for communication-failure" }
            if: { properties: { kind: { const: communication-failure } } }
            then: { properties: { releasable: { const: false }, scope: { const: cluster } } }
            else: { properties: { releasable: { const: true } } }
    IsolationPendencyLifecycle:
      description: Lifecycle of a pendency (kind while open, then how it closed). communication-failure is an alert; admissions are held by the challenge rule, not by a timer.
      enum: [ communication-failure, confirmed-violation, unconfirmed-isolation, closed, released ]
      x-gromesh-transitions:
        initial: [ communication-failure, confirmed-violation ]
        terminal: [ closed, released ]
        transitions:
          - [ communication-failure, closed, "the same chain resumes without violation (chain-resumed)" ]
          - [ communication-failure, confirmed-violation, "the chain resumes with a violation (superseded)" ]
          - [ communication-failure, unconfirmed-isolation, "10 min without the chain (superseded)" ]
          - [ unconfirmed-isolation, closed, "the complete chain still arrives (chain-resumed)" ]
          - [ unconfirmed-isolation, released, "releaseIsolationContainment (platform admin, audited)" ]
          - [ confirmed-violation, released, "releaseIsolationContainment (platform admin, audited)" ]
    RoutePathDiff:
      type: object
      required: [ routeId, pathCompatibility, diffDigest, paths ]
      properties:
        routeId: { type: string, format: uuid }
        pathCompatibility: { enum: [ legacy-preserved, workspace-default ] }
        diffDigest: { $ref: "#/components/schemas/Digest" }
        paths: { type: array, items: { type: object, required: [ publicPath, upstreamBefore, upstreamAfter ], properties: { publicPath: { type: string }, upstreamBefore: { type: string }, upstreamAfter: { type: string } } } }
    ContentRevocation:
      type: object
      required: [ workspaceId, contentDigest, reason, revokedAt, revokedBy ]
      properties: { workspaceId: { type: string, format: uuid }, contentDigest: { $ref: "#/components/schemas/Digest" }, reason: { type: string }, revokedAt: { type: string, format: date-time }, revokedBy: { type: object } }
    AuthenticationProfile:
      description: |
        Effective authentication of one route, computed by the compiler on the composed configuration (B §3.1) and
        returned in the publication preview and the promotion diff. The core accepts only the first alternative.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ composition, mechanisms ]
          properties:
            composition: { const: single }
            mechanisms: { type: array, maxItems: 1, items: { type: object, required: [ plugin, scope ], properties: { plugin: { enum: [ key-auth, basic-auth, jwt, hmac-auth ] }, scope: { enum: [ route, service, workspace, platform ] }, anonymous: { type: boolean } } } }
        - type: object
          x-gromesh-phase: L10
          description: "AND/OR chains and authenticators without a consumer (ldap-auth with a verified directory identity, session); the core answers 422 and blocks the composition."
          required: [ composition, mechanisms ]
          properties:
            composition: { enum: [ and, or ] }
            mechanisms: { type: array, minItems: 1, items: { type: object, required: [ plugin, scope ], properties: { plugin: { enum: [ key-auth, basic-auth, jwt, hmac-auth, ldap-auth, session ] }, scope: { enum: [ route, service, workspace, platform ] }, anonymous: { type: boolean }, directoryIdentity: { type: [ string, "null" ], description: "ldap-auth: identity of the directory from its verified TLS certificate and RootDSE naming context, never the configured hostname (G-3)." } } } }
    Peer:
      type: object
      required: [ id, stage, role, transport ]
      properties: { id: { type: string, format: uuid }, stage: { $ref: "#/components/schemas/Stage" }, role: { enum: [ source, target ] }, transport: { enum: [ push, pull, file ] }, baseUrl: { type: [ string, "null" ] } }
    PeerKey:
      type: object
      required: [ kid, publicKey, status, validFrom, validUntil, retiredAt, revokedAt ]
      properties: { kid: { type: string }, publicKey: { type: string, description: "base64url Ed25519 public key" }, status: { enum: [ active, retired, revoked ] }, validFrom: { type: string, format: date-time }, validUntil: { type: string, format: date-time }, retiredAt: { type: [ string, "null" ], format: date-time }, revokedAt: { type: [ string, "null" ], format: date-time } }
    VarRef:
      type: object
      additionalProperties: false
      required:
        - $var
      properties:
        $var:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
      description: Reference to a declared variable of the same workspace, accepted only on the parametrizable fields (info, "Environment values"); anywhere else 422 at that path. The value lives on each instance, never in a release or package, and is substituted at composition; the field's own rules (schema, forbidden destinations) apply again to the substituted value (422 at the field's path).
    WorkspaceVariableDeclaration:
      type: object
      additionalProperties: false
      required:
        - type
        - secret
        - required
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: Required inside a release content; in the request body, when present, it must equal the path (422).
        type:
          enum:
            - string
            - host
            - port
            - url
            - certificate
            - privateKey
            - credential
        secret:
          type: boolean
        required:
          type: boolean
        validation:
          type: object
          additionalProperties: false
          properties:
            pattern:
              type: string
              maxLength: 512
            minimum:
              type: integer
            maximum:
              type: integer
            maxLength:
              type: integer
              minimum: 1
      description: Part of the workspace draft (it travels with the release and the package, never the value). type privateKey and credential are always secret (422 otherwise).
      allOf:
        - if:
            required:
              - type
            properties:
              type:
                enum:
                  - privateKey
                  - credential
          then:
            properties:
              secret:
                const: true
    WorkspaceServiceFields:
      type: object
      required:
        - name
        - protocol
        - host
        - port
      properties:
        name:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Name
        protocol:
          oneOf:
            - type: string
              enum:
                - http
                - https
                - grpc
                - grpcs
                - tcp
                - tls
            - $ref: "#/components/schemas/VarRef"
        host:
          oneOf:
            - type: string
              description: An upstream's name balances across its targets; any other host is resolved by DNS. 422 at `host` for a forbidden destination (see the description of this API).
              not:
                pattern: (^|\.)gromesh\.internal\.?$
            - $ref: "#/components/schemas/VarRef"
        port:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 65535
            - $ref: "#/components/schemas/VarRef"
        path:
          oneOf:
            - type:
                - string
                - "null"
              pattern: ^/
            - $ref: "#/components/schemas/VarRef"
        retries:
          type: integer
          minimum: 0
          maximum: 32767
        connectTimeoutMs:
          type: integer
          minimum: 1
        readTimeoutMs:
          type: integer
          minimum: 1
        writeTimeoutMs:
          type: integer
          minimum: 1
        enabled:
          type: boolean
          default: true
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
        upstreamId:
          type:
            - string
            - "null"
          format: uuid
    WorkspaceService:
      description: "Response shape: fields as written (a VarRef stays a VarRef; the value is per instance)."
      allOf:
        - $ref: "#/components/schemas/WorkspaceServiceFields"
        - type: object
          required:
            - id
            - workspaceId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            workspaceId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    WorkspaceServicePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceService"
        nextCursor:
          type:
            - string
            - "null"
    WorkspaceTargetFields:
      type: object
      required:
        - target
      properties:
        target:
          oneOf:
            - $ref: ./control-plane.openapi.yaml#/components/schemas/TargetWrite/properties/target
            - $ref: "#/components/schemas/VarRef"
        weight:
          $ref: ./control-plane.openapi.yaml#/components/schemas/TargetWrite/properties/weight
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
    WorkspaceTargetWrite:
      allOf:
        - $ref: "#/components/schemas/WorkspaceTargetFields"
      unevaluatedProperties: false
      description: TargetWrite of v1 in a workspace upstream; target accepts a VarRef (host:port after substitution, forbidden destinations refused).
    WorkspaceTarget:
      allOf:
        - $ref: "#/components/schemas/WorkspaceTargetFields"
        - type: object
          required:
            - id
            - upstreamId
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            upstreamId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    WorkspaceTargetPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceTarget"
        nextCursor:
          type:
            - string
            - "null"
    WorkspaceCertificateFields:
      type: object
      required:
        - cert
        - key
        - snis
      properties:
        cert:
          oneOf:
            - $ref: ./control-plane.openapi.yaml#/components/schemas/CertificateWrite/properties/cert
            - $ref: "#/components/schemas/VarRef"
        key:
          oneOf:
            - $ref: ./control-plane.openapi.yaml#/components/schemas/CertificateWrite/properties/key
            - $ref: "#/components/schemas/VarRef"
        snis:
          allOf:
            - $ref: ./control-plane.openapi.yaml#/components/schemas/CertificateWrite/properties/snis
          description: Each SNI is unique IN THE INSTANCE, across workspaces (409, generic conflict).
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
    WorkspaceCertificateWrite:
      allOf:
        - $ref: "#/components/schemas/WorkspaceCertificateFields"
      unevaluatedProperties: false
      description: CertificateWrite of v1 in a workspace; cert and key accept a VarRef (a release or package always carries key as a VarRef).
    WorkspaceCertificate:
      type: object
      required:
        - id
        - cert
        - snis
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        cert:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/VarRef"
        key:
          oneOf:
            - const: REDACTED
            - $ref: "#/components/schemas/VarRef"
        snis:
          type: array
          items:
            type: string
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
        subject:
          type:
            - string
            - "null"
          description: null while cert is a VarRef (known per instance)
        issuer:
          type:
            - string
            - "null"
        notBefore:
          type:
            - string
            - "null"
          format: date-time
        notAfter:
          type:
            - string
            - "null"
          format: date-time
        fingerprintSha256:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkspaceCertificatePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceCertificate"
        nextCursor:
          type:
            - string
            - "null"
    WorkspaceConsumerWrite:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/ConsumerWrite
      unevaluatedProperties: false
      description: "ConsumerWrite of v1 in a workspace, with username or customId (a non-empty string). Both are unique in the WORKSPACE (decision H-5, see info): another workspace may use the same values. 409 on a duplicate in the same workspace."
      anyOf:
        - required:
            - username
          properties:
            username:
              type: string
              minLength: 1
        - required:
            - customId
          properties:
            customId:
              type: string
              minLength: 1
    WorkspaceUpstreamWrite:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/UpstreamWrite
      unevaluatedProperties: false
      description: UpstreamWrite of v1 in a workspace. name is unique in the workspace; on the node it becomes <name>.<slug>.gromesh.internal, and a service refers to it by upstreamId, never by host.
      properties:
        healthchecks:
          $ref: "#/components/schemas/WorkspaceHealthchecks"
    WorkspaceAclGroups:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/AclGroups
      unevaluatedProperties: false
      description: ACL groups of a workspace consumer; on the node every group is namespaced by the workspace.
    WorkspaceJwtCredentialCreate:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/JwtCredentialCreate
      unevaluatedProperties: false
      description: JwtCredentialCreate of v1. key is unique IN THE INSTANCE, across workspaces (409, generic conflict).
    WorkspaceBasicAuthCredentialCreate:
      allOf:
        - $ref: ./control-plane.openapi.yaml#/components/schemas/BasicAuthCredentialCreate
      unevaluatedProperties: false
      description: BasicAuthCredentialCreate of v1. username is unique IN THE INSTANCE, across workspaces (409, generic conflict).
    WorkspaceGlobalPluginWrite:
      type: object
      additionalProperties: false
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          not:
            pattern: ^gromesh-
        enabled:
          type: boolean
          default: true
        config:
          type: object
        protocols:
          type: array
          items:
            type: string
        tags:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Tags
      description: A plugin that applies to every route of the workspace, emulated by the compiler (info, "Plugins").
    InstanceCluster:
      type: object
      required:
        - id
        - name
        - status
        - nodes
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: ./control-plane.openapi.yaml#/components/schemas/Name
        status:
          enum:
            - no-nodes
            - converged
            - converging
            - degraded
          description: converged = every EXPECTED node (registered and not deregistered) confirmed the current deployment revision with its hash; a node offline for more than 45 s makes the cluster degraded, never converged.
        nodes:
          type: array
          items:
            type: object
            required:
              - nodeId
              - hostname
              - state
              - appliedRevision
              - kongHealthy
              - lastSeenAt
              - online
            properties:
              nodeId:
                type: string
              hostname:
                type: string
              state:
                enum:
                  - applying
                  - applied
                  - failed
                  - idle
              epoch:
                type:
                  - integer
                  - "null"
              appliedRevision:
                type:
                  - integer
                  - "null"
              appliedHash:
                oneOf:
                  - $ref: "#/components/schemas/Digest"
                  - type: "null"
              kongHealthy:
                type: boolean
              lastSeenAt:
                type: string
                format: date-time
              online:
                type: boolean
        createdAt:
          type: string
          format: date-time
      description: "A cluster belongs to the instance, not to a workspace: it receives the composition of every workspace."
    PackageService:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceServiceWrite"
    PackageRoute:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceRouteWrite"
    PackageConsumer:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
        - aclGroups
      properties:
        id:
          type: string
          format: uuid
        aclGroups:
          $ref: ./control-plane.openapi.yaml#/components/schemas/AclGroups/properties/groups
        spec:
          $ref: "#/components/schemas/WorkspaceConsumerWrite"
    PackagePlugin:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          oneOf:
            - $ref: "#/components/schemas/WorkspacePluginWrite"
            - allOf:
                - $ref: "#/components/schemas/WorkspaceGlobalPluginWrite"
              x-gromesh-phase: L9
    PackageUpstream:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceUpstreamWrite"
    PackageTarget:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
        - upstreamId
      properties:
        id:
          type: string
          format: uuid
        upstreamId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WorkspaceTargetWrite"
    PackageCertificate:
      type: object
      additionalProperties: false
      required:
        - id
        - spec
      properties:
        id:
          type: string
          format: uuid
        spec:
          allOf:
            - $ref: "#/components/schemas/WorkspaceCertificateWrite"
            - properties:
                key:
                  $ref: "#/components/schemas/VarRef"
    WorkspaceContent:
      type: object
      additionalProperties: false
      required:
        - services
        - routes
        - consumers
        - credentials
        - plugins
        - upstreams
        - targets
        - certificates
        - variables
      description: "Content of a release in the Gromesh model (never Kong's format): every entity of the workspace with its id, references by id inside the same content, secrets as VarRef. Every array is ordered by id (variables by name); contentDigest = \"sha256:\" + hex(SHA-256(UTF-8 bytes of the RFC 8785 JCS form of this object))."
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/PackageService"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PackageRoute"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/PackageConsumer"
        credentials:
          type: array
          maxItems: 0
          description: "Always empty: consumer credentials are environment values, created on each instance and never promoted."
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PackagePlugin"
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/PackageUpstream"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PackageTarget"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/PackageCertificate"
        variables:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/WorkspaceVariableDeclaration"
              - required:
                  - name
    Permission:
      enum:
