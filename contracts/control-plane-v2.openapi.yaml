      security:
        - cookieAuth: []
        - bearerApiToken: []
      summary: Export the current draft as a Gromesh configuration document
      description: |
        In a workspace this is the v1 environment export with "environment" read as this workspace. A gromesh/v1
        document has no variables: a draft field holding a VarRef answers 422 at that field (variables travel with
        releases and packages, as WorkspaceContent, and are declared with declareWorkspaceVariable).
        Exports every managed draft entity, without pagination, as `apiVersion: gromesh/v1`.
        This is Gromesh's declarative model, not a Kong config or a published snapshot. Environment settings,
        users, API tokens, clusters, audit events and platform-injected plugins are outside this document.
        `format` selects both serialization and Content-Type, independently of Accept; the default is yaml.
        Both representations conform to GromeshConfigV1Export. No state is changed.
        Plugin fields marked `encrypted` by the plugin schema, certificate private keys and HS256 JWT secrets
        are always the literal `REDACTED`, for every role. Key-auth credentials contain only identity, tags
        and `keyHint`, never `key`. Basic-auth credentials never contain a password or its hash.
        Reimporting an export into the same environment preserves matched secrets; importing it into another
        environment requires supplying real secrets for new entities. The output has no document size limit;
        a document larger than the import limit must be split before import.
      parameters:
        - name: format
          in: query
          description: Serialization of the response document
          schema:
            type: string
            enum:
              - yaml
              - json
            default: yaml
      responses:
        "200":
          description: Complete draft with secrets redacted
          content:
            application/yaml:
              schema:
                $ref: ./control-plane.openapi.yaml#/components/schemas/GromeshConfigV1Export
            application/json:
              schema:
                $ref: ./control-plane.openapi.yaml#/components/schemas/GromeshConfigV1Export
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      x-required-permission: workspace.read
      x-scope: workspace
      x-gromesh-requirements:
        - GW-WS-04
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
  /workspaces/{workspaceId}/import:
    post:
      tags:
        - environments
      operationId: importWorkspaceConfig
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerApiToken: []
      summary: Validate, preview or import configuration into the draft
      description: |
        In a workspace this is the v1 environment import with "environment" read as this workspace: every match,
        reference and preserved id stays inside it (a reference to another workspace answers 422), and the
        uniqueness rules of info apply (each conflict is an errors[] entry of the 422, as below). A gromesh/v1 document carries no VarRef (422 at the field).
        Accepts a parsed document object or a UTF-8 YAML/JSON document string inside the JSON request envelope.
        `sourceFormat` defaults to `gromesh/v1`; it selects the model, not the serialization. Reject multiple
        YAML documents, duplicate mapping keys, custom YAML tags and alias expansion. The document limit is
        5 MiB (5,242,880 bytes): UTF-8 bytes of a string before parsing, or UTF-8 bytes of compact JSON for an
        object, and of the decoded compact JSON in either case. Exceeding either limit returns 422 at `document`.

        Merge upserts services, routes and upstreams by name; consumers by username or customId. When both
        consumer identifiers are supplied, either may match an existing consumer; if both resolve, they must resolve
        to the same consumer. Resolving to different consumers is a conflict. Certificates match by an existing target-environment id or by
        their exact non-empty SNI set (order-independent); disagreeing matches are a conflict. An empty SNI set has
        no natural key and requires an existing id to update. SNI overlap with another certificate that would remain
        in the resulting draft is a uniqueness conflict.
        Plugins match by (name, resolved service, route, consumer scope), targets by (upstream, target), JWT
        credentials by issuer key and basic-auth credentials by username (both unique in the instance, across workspaces).
        Key-auth matches by existing id within the resolved consumer (until N1-X6, also by the supplied full key);
        `keyHint` is display-only and MUST NOT be used to match a credential. A credential belonging to another consumer,
        or an id disagreeing with a natural-key match, is a conflict. Credential ids only match within the resolved
        consumer; unmatched ids are source identities, not requested ids for creation. New ids are generated
        by the control plane, except for the consumer-id preservation rule for prehashed basic-auth below.
        Matched entities retain their ids. ACL membership matches by (consumer, group).
        Merge never deletes, including nested credentials, targets and ACL groups: omitted entities remain,
        and supplied ACL groups are unioned. Supplied entities replace their non-secret attributes, with omitted
        optional attributes taking the same defaults as their write schemas (nullable values default to null,
        arrays to empty, plugin scope to global, and plugin protocols to the plugin schema's default).
        A removed ACL membership requires replace mode or the existing ACL API.

        Replace uses the same matching rules but makes the draft exactly the document, deleting every entity
        and nested membership absent from it, subject only to retained ids and preserved secrets of matched
        entities. References in replace must resolve inside the document; in merge they may also resolve to
        existing draft entities. Unknown references are 422 with their source path. A service host matching
        an upstream name keeps the existing upstream-resolution semantics (the v1 binding by name; a service the
        import creates or replaces is a v1-written one, WS-U0); other hosts use DNS. An imported upstream whose name
        is the DNS host of a service written through v2 without upstreamId is 422 at its path
        (upstream-captures-service).

        A supplied `REDACTED`, or an omitted secret on a matched entity, keeps the current secret in either mode,
        as with certificate PUT. For a NEW credential/certificate/plugin secret, `REDACTED` or a missing value
        is 422 at that secret path; import never auto-generates credentials. This applies to basic-auth passwords,
        certificate keys and plugin fields marked `encrypted` that the selected plugin configuration requires.
        Optional inactive plugin secret fields may remain absent. Key-auth keys and HS256 JWT secrets follow the v1
        import (decision H-14): a supplied value is ignored, a matched credential keeps its own, a new one is
        imported pending reprovisioning and listed in `pendingCredentials`.
        A secret slot without a stored value is new even on a matched plugin or credential.
        RS256/ES256 JWT credentials require a valid public key and must not supply a secret. Existing certificate
        keys must still match the leaf; all current entity write validations, including certificate expiry on
        creation or a changed cert, apply. Basic-auth hashes are never accepted in the Gromesh document.

        For `kong-declarative-3.0`, `_format_version` must be the string `3.0`. Normalize only entities and fields
        representable in GromeshConfigV1, including nested or flat services/routes/plugins, consumers with
        keyauth_credentials/jwt_secrets/basicauth_credentials/acls, upstreams/targets and certificates/snis.
        Resolve source ids and named references before assigning target ids. Translate supported snake_case
        fields and relationships to the Gromesh model; do not pass this config directly to the data plane.
        Every unsupported entity or field, including nested fields and unknown plugin config fields, produces
        an `errors[]` entry at its original document path; nothing is silently ignored, even default-valued fields.
        `_transform` may be absent or true for plaintext basic-auth passwords. Such passwords keep today's
        plaintext handling even if they happen to contain 40 lowercase hex characters. `_transform` is
        document-wide, not per credential; `_transform: false` without basic-auth credentials is accepted.

        Accept prehashed `basicauth_credentials` only for `sourceFormat: kong-declarative-3.0` with
        `_transform: false`. Each supplied password must match `^[0-9a-f]{40}$` and is already Kong's
        `sha1(password + consumer_id)` hash; store it unchanged, without hashing it again. Acceptance requires
        the credential's consumer to be present in the source document with an `id` in lowercase canonical UUID
        form (`^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$`; the salt is that exact string, so
        any other form is rejected as invalid), and that exact id to be preserved as the consumer's id in the
        target environment. This applies to nested credentials and to flat credentials whose consumer reference
        resolves to a consumer entry of the same document carrying such an `id`. A reference to an existing
        target consumer that is not in the document does not suffice.

        For each such consumer, in both merge and replace, resolve its UUID globally before any
        username/customId matching. If that id exists in the TARGET environment, that consumer is the match
        and retains its id; normal merge/replace updates and uniqueness checks still apply. Any supplied
        username/customId resolving to a different consumer is a conflict, never a fallback match. If that id
        exists in ANOTHER environment, it cannot be preserved because consumer ids are global primary keys:
        reject with 422 at the source consumer's id path (e.g. `document.consumers.0.id`), without disclosing
        the other environment or consumer. If no consumer anywhere has that id, create a NEW consumer with
        exactly that id; a username/customId already matching another target consumer is a conflict, even
        in replace mode. Never substitute a generated id or another consumer's id to accept the hash.
        This exception applies only to source consumers carrying prehashed basic-auth credentials in this
        format. All other consumers and entities keep today's matching and id-generation rules.

        An invalid hash, a missing/invalid consumer UUID, or any inability to preserve that id rejects
        a real import with 422 and an error at the credential's original password path, e.g.
        `document.consumers.0.basicauth_credentials.0.password` or `document.basicauth_credentials.0.password`.
        The message explains that Kong's hash is salted with the consumer id and requires preserving that id,
        without echoing the hash or submitted password. Invalid UUIDs and cross-environment id collisions also
        produce an error at the source consumer's id path. Existing omitted/REDACTED-secret preservation on
        matched credentials still applies; it does not authorize creating a credential without a valid hash
        or bypassing the consumer-id rule: under `_transform: false`, an omitted or REDACTED password still requires
        its consumer's id to be preserved. All-or-nothing and dry-run error/report semantics below still apply.

        error paths, with one error per affected credential at its password path and no other paths:
          * hash not 40 lowercase hex: the password path.
          * consumer without `id`: the password path.
          * `id` not a lowercase canonical UUID: the password path and `document.consumers.N.id`.
          * `id` used by a consumer of another environment: the password path and `document.consumers.N.id`.
          * `id` repeated by two source consumers: the password path and `document.consumers.N.id` of the repeat.
          * username/customId resolving to another consumer: the password path and that identifier's path.
        The message at the id path is fixed ("consumer id cannot be preserved because it is already in use" for an
        id in use) and reveals only that the id is unavailable, never where; this availability signal, also
        visible through dry-run, is accepted since consumer ids are random UUIDs.

        Imported hashes are sealed at rest with `enc:v2`, bound to table `basicauth_credentials`,
        column `password_hash` and the target credential's id, like other basic-auth hashes. They are treated
        as secrets and REDACTED everywhere except the agent endpoint (including API, diff, preview and snapshot
        envelope); exports continue omitting basic-auth passwords and hashes entirely. Reports, errors, logs
        and audit events never echo the hash or submitted password. Plaintext imports with `_transform`
        absent/true and the Gromesh document's prohibition on importing hashes are unchanged.

        Conflicts (the matching conflicts above and uniqueness violations in the resulting draft) are errors like any
        other: an `errors[]` entry at the conflicting path, never a separate 409. A forbidden destination (see the
        description of this API) in the resulting draft is a semantic error at its document path, e.g.
        `document.services.0.host`, `document.upstreams.0.targets.1.target`.

        A real import (`dryRun: false`) is ALL OR NOTHING. With any error (invalid envelope, malformed
        serialization, schema violation, conversion or semantic error, conflict, size limit) NOTHING is written:
        no entity, draft revision, audit event or snapshot. The response is then 422 with the same report
        `{ added, modified, removed, errors[] }` (EnvironmentImportFailure, inside a problem+json body), where
        errors[] lists every error found and the change arrays are empty because there is no valid plan; never a
        partial success. On success the entire change, draft revision update and a redacted import audit event
        commit in ONE transaction and the response is 200 with errors[] empty.

        `dryRun: true` never writes anything (including audit, draft revision or snapshots) and returns the same
        redacted diff a real import would apply. Its document/conversion/semantic errors and conflicts return a 200
        report with errors[] (change arrays empty); an invalid request envelope, malformed serialization or a
        document schema violation is the same 422 EnvironmentImportFailure as a real import. Import NEVER publishes or notifies
        agents, even when publishMode is auto; a separate explicit publish is required.
        Reports diff against the current draft, not the published snapshot. Diff labels/before/after and errors
        never expose secrets, plaintext passwords, password hashes or submitted secret values. Error paths use
        dot-separated properties and zero-based indexes rooted at `document`, e.g. `document.consumers.0.jwtCredentials.0.secret`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./control-plane.openapi.yaml#/components/schemas/EnvironmentImportRequest
      responses:
        "200":
          description: Successful draft import, or a dry-run report; a real import always has an empty errors array
          content:
            application/json:
              schema:
