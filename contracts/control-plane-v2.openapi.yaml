        for unconfirmed-isolation it also closes the orphan admission as closed-without-proof. Admissions in its
        scope resume only under the challenge rule (every other open admission answering). A probe resumes only after a conclusive pass; a release alone never reopens
        traffic and never replaces a pod's own proof. communication-failure pendencies are not releasable (409): they
        close when the same report chain resumes or turn into unconfirmed-isolation. Containment by missing proof
        needs no release (two conclusive passes). Session + CSRF; justification required; audited with alert. 409
        when the pendency is not open or not releasable.
      security: [ { cookieAuth: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [ pendencyId, justification ], properties: { pendencyId: { type: string, format: uuid }, justification: { type: string, minLength: 10 } } } } } }
