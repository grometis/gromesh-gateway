      x-gromesh-planned: true
      description: |
        Session + CSRF only. Revalidates; a relevant change since approval (closed definition in info) invalidates the approvals or blocks. Needs the
        deployment lease (409 otherwise). Idempotent per promotion. The executor's verified person and account must
        differ from the confirmed requester's, and from every approver's unless the policy sets executorMayApprove
        (403). Under the `identity` lock it re-resolves requester, approvers and executor and drops votes and
        confirmations of an older identity_epoch whose equivalence changed. Key trust uses promotion.proofUse, the
        same use as at validation (info, F-4): kind full/partial → new (for prd: attestation with an `active` hml key,
        workspaceKey, attestation.contentDigest = package contentDigest = recomputed resultDigest, authorsDigest);
