        M2M). The TARGET records the caller's own account and person as the requester; the requester declared by the
        source is kept for audit only. 409 requester-mismatch (audited, alert) when the caller's person differs from
        the person the target maps the declared identity to (no mapping = mismatch; core: by the declared
        corporateId, else the local e-mail; L5: issuer+subject); 409 when the promotion is not awaiting confirmation,
        the echoed packageId/contentDigest differs, or the caller's person is not verified. The confirmation is
