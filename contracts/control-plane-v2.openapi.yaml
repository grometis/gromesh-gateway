        permanent-failure marks. It selects no version, carries no content and never changes the desired state;
        there is no "accept observed state", no direct edit and no rollback here (rollback is rollbackRelease, normal
        or emergency, with its own rules). Checks: the current deployment exists and was created by an authorized
        operation; no member's contentDigest is revoked (409, use a rollback or a promotion); in prd each member's
        stored attestation passes keyTrust use=historical; the deployment lease is free (409). It never supersedes a
