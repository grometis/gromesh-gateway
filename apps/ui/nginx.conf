# Direct HTTPS enables HSTS automatically. With TLS terminated at an ingress,
# enable HSTS there after redirecting HTTP to HTTPS. Alternatively, change this
# map's default to "max-age=31536000" ONLY if port 8080 is reachable exclusively
# through that TLS ingress. Keep it empty for local HTTP; never trust a client
# X-Forwarded-Proto header to enable HSTS.
map $scheme $hsts_header {
    default "";
    https "max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/v1/ {
        proxy_pass http://control-plane:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
