{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "control-plane.fullname" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /agent/v1/
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port: {number: 3000}
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port: {number: 3000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "control-plane.fullname" . }}-ui
                port: {number: 8080}
{{- end }}
