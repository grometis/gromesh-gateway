{{- if and (not .Values.bootstrapAdmin.existingSecret) .Values.bootstrapAdmin.email }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "control-plane.bootstrapSecret" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.bootstrapAdmin.emailKey }}: {{ .Values.bootstrapAdmin.email | b64enc | quote }}
  {{ .Values.bootstrapAdmin.passwordKey }}: {{ .Values.bootstrapAdmin.password | b64enc | quote }}
{{- end }}
