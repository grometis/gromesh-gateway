apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "control-plane.fullname" . }}-migrate
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "control-plane.selector" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "control-plane.podSecurity" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: {{ include "control-plane.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, dist/db/migrate-cli.js]
          securityContext:
            {{- include "control-plane.security" . | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
