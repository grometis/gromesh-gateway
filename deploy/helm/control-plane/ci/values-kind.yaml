# Synthetic Secrets are provisioned by kind.sh before the migration hook.
database:
  existingSecret: ci-database
bootstrapAdmin:
  existingSecret: ci-admin
encryption:
  existingSecret: ci-encryption
# kind has no TLS terminator; this is the only development opt-out.
insecureCookies: true
image:
  repository: gromesh-control-plane
  tag: ci
  digest: ""
  pullPolicy: Never
ui:
  replicaCount: 1
  image:
    repository: gromesh-ui
    tag: ci
    digest: ""
    pullPolicy: Never
validator:
  image:
    # kind loads the own image by tag; the digest is only known to the registry.
    digest: ""
    pullPolicy: Never
