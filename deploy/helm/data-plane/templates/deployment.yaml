{{- include "data-plane.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-plane.fullname" . }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "data-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-plane.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/kong-listeners: {{ .Files.Get "files/kong/listeners.conf" | sha256sum | trunc 16 }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # containerd refuses a pod-level group without a user; containers still set their own runAsUser.
        runAsUser: {{ .Values.kong.runAsUser }}
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: {{ include "data-plane.image" .Values.kong.image | quote }}
          imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              if [ ! -e /kong/declarative/kong.json ]; then
                umask 022
                printf '%s\n' '{"_format_version":"3.0"}' > /kong/declarative/kong.json
              fi
          securityContext:
            runAsUser: 1001
            {{- include "data-plane.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: snapshot
              mountPath: /kong/declarative
        {{- if .Values.workspaces.enabled }}
        # Installs kong-supervisor and kong-liveness (apps/isolation, shipped in the agent image) for the kong container.
        - name: isolation-install
          image: {{ include "data-plane.image" .Values.agent.image | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: [/gromesh/isolation-bin/isolation-probe, install, /isolation-bin]
          securityContext:
            runAsUser: 1001
            {{- include "data-plane.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: isolation-bin
              mountPath: /isolation-bin
        {{- include "data-plane.agent" . | nindent 8 }}
        - name: isolation-probe
          image: {{ include "data-plane.image" .Values.agent.image | quote }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          restartPolicy: Always
          command: [/gromesh/isolation-bin/isolation-probe]
          securityContext:
            runAsUser: {{ .Values.workspaces.probe.runAsUser }}
            {{- include "data-plane.containerSecurityContext" . | nindent 12 }}
          env:
            - name: GROMESH_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: GROMESH_CLUSTER_ID
              value: {{ .Values.workspaces.clusterId | quote }}
            - name: GROMESH_INSTANCE_KEYS
              value: /etc/gromesh/instance-keys.json
            - name: GROMESH_PROBE_CONFIG
              value: /etc/gromesh/probe.json
            - name: GROMESH_KONG_STATE_FILE
              value: /gromesh/kong-state/kong-state.json
          # The probe never listens: Ready only in state ok with a valid lease.
          readinessProbe:
            exec:
              command: [/gromesh/isolation-bin/isolation-probe, ready]
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            {{- toYaml .Values.workspaces.probe.resources | nindent 12 }}
          volumeMounts:
            - name: isolation
              mountPath: /gromesh/isolation
            - name: isolation-handoff
              mountPath: /gromesh/handoff
            - name: isolation-probe-config
              mountPath: /etc/gromesh
              readOnly: true
            # kong-supervisor's record of the stop, for the final report's kongStopConfirmed.
            - name: kong-state
              mountPath: /gromesh/kong-state
              readOnly: true
        {{- end }}
      containers:
        - name: kong
          image: {{ include "data-plane.image" .Values.kong.image | quote }}
          imagePullPolicy: {{ .Values.kong.image.pullPolicy }}
          # A container restarted after an unclean exit finds its old sockets in the volume, and bind() fails.
          {{- if .Values.workspaces.enabled }}
          # kong-supervisor is PID 1: no nginx without a valid lease, stopped within 1 s of losing it.
          command: [/gromesh/isolation-bin/kong-supervisor, --, /bin/sh, -ec]
          {{- else }}
          command: [/bin/sh, -ec]
          {{- end }}
          args:
            - rm -f /kong/admin/admin.sock /kong/admin/status.sock && exec /usr/local/bin/gromesh-entrypoint kong docker-start
          securityContext:
            runAsUser: {{ .Values.kong.runAsUser }}
            {{- include "data-plane.containerSecurityContext" . | nindent 12 }}
          env:
            - name: KONG_DATABASE
              value: "off"
            {{- if .Values.kong.realIpHeader }}
            - name: KONG_REAL_IP_HEADER
              value: {{ .Values.kong.realIpHeader | quote }}
            - name: KONG_TRUSTED_IPS
              value: {{ join "," .Values.kong.trustedIps | quote }}
            {{- end }}
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.json
            # Admin and status APIs only on Unix sockets for the agent; TCP 8100 serves /metrics and
            # /status/ready to callers outside the pod (files/kong/listeners.conf, contract: agent-protocol).
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_ADMIN_GUI_LISTEN
              value: "off"
            - name: KONG_STATUS_LISTEN
              value: "off"
            - name: KONG_NGINX_HTTP_INCLUDE
              value: /etc/gromesh/kong/listeners.conf
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
            {{- if or .Values.collector.enabled .Values.collector.auth.existingSecret }}
            # The platform http-log sends {vault://env/gromesh-collector-token}; nginx workers only see variables
            # declared with `env` (contract: Platform analytics).
            - name: GROMESH_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-plane.collectorTokenSecret" . }}
                  key: {{ .Values.collector.auth.existingSecretKey }}
            - name: KONG_NGINX_MAIN_ENV
              value: GROMESH_COLLECTOR_TOKEN
            {{- end }}
            # Not /usr/local/kong: an emptyDir there would hide the image's own lib/ (libada.so, ...).
            - name: KONG_PREFIX
              value: /kong_prefix
            - name: KONG_NGINX_DAEMON
              value: "off"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            {{- if .Values.workspaces.enabled }}
            - name: KONG_PLUGINS
              value: bundled,gromesh-workspace,gromesh-route-guard
            # The route guard reads the pod uid in the nginx workers (nginx clears the environment otherwise).
            - name: GROMESH_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KONG_NGINX_MAIN_ENV
              value: GROMESH_POD_UID
            - name: GROMESH_KONG_STATE_FILE
              value: /gromesh/kong-state/kong-state.json
            {{- else }}
            - name: KONG_PLUGINS
              value: bundled
            {{- end }}
            - name: KONG_NGINX_WORKER_PROCESSES
              value: {{ .Values.kong.workerProcesses | quote }}
            - name: KONG_DNS_NOT_FOUND_TTL
              value: {{ .Values.kong.dns.notFoundTtl | quote }}
            - name: KONG_DNS_ERROR_TTL
              value: {{ .Values.kong.dns.errorTtl | quote }}
            - name: KONG_DNS_STALE_TTL
              value: {{ .Values.kong.dns.staleTtl | quote }}
          ports:
            - name: proxy-http
              containerPort: 8000
            - name: proxy-https
              containerPort: 8443
            - name: status
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          {{- if .Values.workspaces.enabled }}
          # Independent of the supervisor: a heartbeat older than 3 s, or nginx without a valid lease, fails at once;
          # the kubelet raises the probe's grace of 1 s to its minimum of 2 s (B §3.5.3, G).
          startupProbe:
            exec:
              command: [/bin/sh, -c, test -s /gromesh/kong-state/kong-state.json]
            periodSeconds: 1
            failureThreshold: 10
          livenessProbe:
            exec:
              command: [/gromesh/isolation-bin/kong-liveness]
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
            terminationGracePeriodSeconds: 1
          {{- else }}
          livenessProbe:
            tcpSocket:
              port: proxy-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.kong.resources | nindent 12 }}
          volumeMounts:
            - name: snapshot
              mountPath: /kong/declarative
              readOnly: true
            - name: kong-prefix
              mountPath: /kong_prefix
            - name: kong-tmp
              mountPath: /tmp
            - name: kong-admin
              mountPath: /kong/admin
            - name: kong-listeners
              mountPath: /etc/gromesh/kong
              readOnly: true
            {{- if .Values.workspaces.enabled }}
            - name: isolation
              mountPath: /gromesh/isolation
              readOnly: true
            - name: kong-state
              mountPath: /gromesh/kong-state
            - name: isolation-bin
              mountPath: /gromesh/isolation-bin
              readOnly: true
            {{- end }}
        {{- if not .Values.workspaces.enabled }}
        {{- include "data-plane.agent" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: snapshot
          emptyDir: {}
        - name: agent-state
          emptyDir: {}
        - name: kong-prefix
          emptyDir: {}
        - name: kong-tmp
          emptyDir: {}
        - name: kong-admin
          emptyDir: {}
        - name: kong-listeners
          configMap:
            name: {{ include "data-plane.fullname" . }}-kong-listeners
        {{- if .Values.workspaces.enabled }}
        # Written only by the probe (its own UID); read-only in kong; never mounted by the agent.
        # The report queue alone may reach 64Mi (then the probe stops renewing): the volume holds it with room to spare,
        # so the probe stops serving before the kubelet would evict the pod.
        - name: isolation
          emptyDir:
            sizeLimit: 80Mi
        - name: kong-state
          emptyDir:
            sizeLimit: 1Mi
        - name: isolation-bin
          emptyDir:
            sizeLimit: 64Mi
        # The outbox mirrors the probe's queue (up to 64Mi) beside the agent's documents.
        - name: isolation-handoff
          emptyDir:
            sizeLimit: 80Mi
        - name: isolation-probe-config
          configMap:
            name: {{ include "data-plane.fullname" . }}-isolation-probe
        {{- end }}
