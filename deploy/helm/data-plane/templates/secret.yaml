{{- if not .Values.agent.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-plane.secretName" . }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.agent.existingSecretKey }}: {{ required "Set agent.existingSecret or agent.token to a cluster registration token" .Values.agent.token | b64enc | quote }}
{{- end }}
