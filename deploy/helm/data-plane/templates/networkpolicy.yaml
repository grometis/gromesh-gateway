{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "data-plane.fullname" . }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "data-plane.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
      {{- with .Values.networkPolicy.proxyPeers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.controlPlanePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "data-plane.urlPort" .Values.agent.controlPlaneUrl }}
    {{- if .Values.collector.httpLogEndpoint }}
    - to:
        {{- toYaml .Values.networkPolicy.collectorPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "data-plane.urlPort" .Values.collector.httpLogEndpoint }}
    {{- end }}
    {{- with .Values.networkPolicy.dnsPeers }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.upstreams }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
