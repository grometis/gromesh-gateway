{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "data-plane.fullname" . }}
  labels:
    {{- include "data-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "data-plane.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
      {{- with .Values.networkPolicy.proxyPeers }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.controlPlanePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "data-plane.urlPort" .Values.agent.controlPlaneUrl }}
    {{- if and .Values.collector.enabled (eq .Values.collector.mode "sidecar") }}
    # The sidecar collector listens on the pod's loopback (no policy applies there) and writes to ClickHouse.
    - to:
        {{- toYaml .Values.networkPolicy.clickhousePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "data-plane.urlPort" .Values.collector.clickhouse.endpoint }}
    {{- else if include "data-plane.collectorEndpoint" . }}
    - to:
        {{- if .Values.networkPolicy.collectorPeers }}
        {{- toYaml .Values.networkPolicy.collectorPeers | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "data-plane.collectorSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "data-plane.urlPort" (include "data-plane.collectorEndpoint" .) }}
    {{- end }}
    {{- with .Values.networkPolicy.dnsPeers }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.upstreams }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
