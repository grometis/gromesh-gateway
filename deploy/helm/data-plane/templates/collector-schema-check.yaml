{{- if .Values.collector.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-collector-schema" (include "data-plane.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "data-plane.collectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "data-plane.name" . }}-collector-schema
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector-schema
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check-schema
          image: {{ include "data-plane.image" .Values.collector.image | quote }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          command: [sh, -ec]
          args:
            - |
{{ .Files.Get "files/vector/check-clickhouse-schema.sh" | indent 14 }}
          securityContext:
            {{- include "data-plane.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CLICKHOUSE_ENDPOINT
              value: {{ .Values.collector.clickhouse.endpoint | quote }}
            - name: CLICKHOUSE_DATABASE_BASE64
              value: {{ .Values.collector.clickhouse.database | b64enc | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collector.clickhouse.existingSecret }}
                  key: {{ .Values.collector.clickhouse.existingSecretKey }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
{{- end }}
