# Keep deploy/observability/vector/vector.yaml and deploy/helm/data-plane/files/vector/vector.yaml identical.
data_dir: /var/lib/vector

# No environment interpolation (Vector 0.57 gates it behind --dangerously-allow-env-var-interpolation): the few
# values taken from the environment are @@<name>@@ (filled by "config.sh render" in entrypoint.sh) or SECRET[env.*];
# config.sh checks each one, defaults included. Run this file through "config.sh render" before Vector reads it.
secret:
  env:
    type: exec
    command: [/bin/sh, /etc/vector/config.sh, secret]

# The API/tap is disabled: it could expose events before sanitization.
api:
  enabled: false

sources:
  internal_metrics:
    type: internal_metrics
    # Keep the metric names consumed by CollectorWithoutEvents stable.
    namespace: vector

  kong:
    type: http_server
    # Workspaces mode (sidecar in the Kong pod): 127.0.0.1 only, no Service; the token still decides (B §3.5.2).
    address: "@@collector_address@@"
    path: /kong
    strict_path: true
    decoding:
      codec: bytes
    # Only this cluster's gateways have the token (contract: Platform analytics); anything else that reaches the
    # collector, through the proxy or from another pod, gets 401. A previous token is accepted during rotation.
    auth:
      strategy: custom
      source: |
        got = string(.headers."x-gromesh-collector-token") ?? ""
        current = get_env_var("GROMESH_COLLECTOR_TOKEN") ?? ""
        previous = get_env_var("GROMESH_COLLECTOR_TOKEN_PREVIOUS") ?? ""
        got != "" && (got == current || got == previous)

transforms:
  decode:
    type: remap
    inputs: [kong]
    drop_on_error: true
    drop_on_abort: true
    # Parse errors are deliberately not interpolated in diagnostics. Kong sends
    # arrays when queue.max_batch_size > 1; remap splits them into events.
    source: |
      payload, err = parse_json(.message)
      if err != null { abort }
      . = payload

  mask_path:
    type: remap
    inputs: [decode]
    drop_on_error: true
    drop_on_abort: true
    source: |
      uri, err = string(.request.uri)
      if err != null { abort }
      # Queries are never stored. Decode the path before matching encoded PII.
      path = decode_percent(string!(split(uri, "?", limit: 2)[0]))
      if !starts_with(path, "/") { abort }
      # Precedence: an entire CPF/CNPJ or a segment containing an email keeps
      # its specific marker. Punctuated CNPJ spans two slash-delimited parts.
      # Otherwise mask the whole segment for 6+ consecutive digits outside UUIDs;
      # UUID spans stay opaque even in /mvp-<uuid> and /e2e-<uuid> paths.
      segments = split(path, "/")
      masked = []
      for_each(segments) -> |index, value| {
        segment = value
        previous = string(get(segments, [index - 1]) ?? null) ?? ""
        # The preceding iteration already emitted a complete punctuated CNPJ.
        cnpj_tail = match(previous, r'^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$') && match(segment, r'^[0-9]{4}-[0-9]{2}$')
        if !cnpj_tail {
          next = string(get(segments, [index + 1]) ?? null) ?? ""
          if match(segment, r'^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$') && match(next, r'^[0-9]{4}-[0-9]{2}$') {
            segment = "{cnpj}"
          } else if match(segment, r'(?i)[a-z0-9.!#%&*+=^_`{|}~\x24\x27-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+') {
            segment = "{email}"
          } else if match(segment, r'^(?:[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}|[0-9]{11})$') {
            segment = "{cpf}"
          } else if match(segment, r'^[0-9]{14}$') {
            segment = "{cnpj}"
          } else {
            without_uuids = replace(segment, r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b', "")
            if match(without_uuids, r'[0-9]{6,}') { segment = "{id}" }
          }
          masked = push(masked, segment)
        }
      }
      .request.uri = join!(masked, "/")

  sanitize:
    type: remap
    inputs: [mask_path]
    drop_on_error: true
    drop_on_abort: true
    source: |
      key_names = array!(parse_json!(get_env_var("GROMESH_KEY_NAMES") ?? "[\"apikey\"]"))
      # http-log emits the environment's published key_names as a JSON array.
      # Old snapshots omit it; the cluster env var remains a fallback and union.
      if exists(.key_names) { key_names = append(key_names, array!(.key_names)) }
      key_names = map_values(key_names) -> |name| { downcase(string!(name)) }
      credentials = append(key_names, ["apikey", "authorization", "cookie", "set-cookie"])
      .request.headers = filter(object(.request.headers) ?? {}) -> |name, _value| { !includes(credentials, downcase(name)) }
      .response.headers = filter(object(.response.headers) ?? {}) -> |name, _value| { !includes(credentials, downcase(name)) }
      .request.querystring = filter(object(.request.querystring) ?? {}) -> |name, _value| { !includes(credentials, downcase(name)) }

      # Drop the whole query (also URL/referrer copies) and every field outside
      # the analytics allowlist. No raw event can reach a sink or disk buffer.
      path = string!(.request.uri)
      if !starts_with(path, "/") { abort }
      uuid = r'(?i)^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      environment_id = string!(.environment_id)
      # Only privileged plugins of the same gateway can read the token: still pin the environment ("any" only in
      # development, see entrypoint.sh; an unset variable drops every event).
      expected_environment = downcase(get_env_var("GROMESH_ENVIRONMENT_ID") ?? "")
      if expected_environment != "any" && downcase(environment_id) != expected_environment { abort }
      # The cluster is this collector's own identity (validated by entrypoint.sh), never trusted from the event.
      cluster_id = get_env_var!("GROMESH_CLUSTER_ID")
      if !match(environment_id, uuid) || !match(cluster_id, uuid) { abort }
      service_id = string(.service.id) ?? ""
      route_id = string(.route.id) ?? ""
      consumer_id = string(.consumer.id) ?? ""
      if service_id != "" && !match(service_id, uuid) { abort }
      if route_id != "" && !match(route_id, uuid) { abort }
      if consumer_id != "" && !match(consumer_id, uuid) { abort }
      service_id = if service_id == "" { null } else { service_id }
      route_id = if route_id == "" { null } else { route_id }
      consumer_id = if consumer_id == "" { null } else { consumer_id }
      method = string!(.request.method)
      if !includes(["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "TRACE", "CONNECT"], method) { abort }
      client_ip = ip_to_ipv6!(string!(.client_ip))
      ts = from_unix_timestamp!(to_int!(.started_at), unit: "milliseconds")
      latency_upstream_ms = to_float!(.latencies.proxy)
      latency_upstream_ms = if latency_upstream_ms < 0 { null } else { latency_upstream_ms }
      retention_days = int(.retention_days) ?? 7
      if retention_days < 1 || retention_days > 7 { retention_days = 7 }
      # Sidecar (GROMESH_POD_UID set): the row id is derived from (cluster, pod, Kong's request id), so a replayed or
      # repeated batch carries the same ids and the dedupe below drops it; an event without a request id is dropped.
      pod_uid = get_env_var("GROMESH_POD_UID") ?? ""
      id = uuid_v4()
      if pod_uid != "" {
        request_id = string(.request.id) ?? ""
        if !match(request_id, r'^[0-9a-f]{32}$') { abort }
        h = sha2(cluster_id + "|" + pod_uid + "|" + request_id, variant: "SHA-256")
        id = slice!(h, 0, 8) + "-" + slice!(h, 8, 12) + "-" + slice!(h, 12, 16) + "-" + slice!(h, 16, 20) + "-" + slice!(h, 20, 32)
      }
      . = {
        "id": id,
        "ts": format_timestamp!(ts, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC"),
        "environment_id": environment_id,
        "cluster_id": cluster_id,
        "service_id": service_id,
        "route_id": route_id,
        "consumer_id": consumer_id,
        "method": method,
        "path": path,
        "status": to_int!(.response.status),
        "latency_kong_ms": to_float!(.latencies.kong),
        "latency_upstream_ms": latency_upstream_ms,
        "latency_total_ms": to_float!(.latencies.request),
        "client_ip": client_ip,
        "request_size": to_int!(.request.size),
        "response_size": to_int!(.response.size),
        "retention_days": retention_days
      }

  # Only derived ids can repeat (sidecar): a batch delivered twice counts once while its ids are in the cache.
  dedupe:
    type: dedupe
    inputs: [sanitize]
    fields:
      match: [id]
    cache:
      num_events: 20000

sinks:
  metrics:
    type: prometheus_exporter
    inputs: [internal_metrics]
    address: "@@metrics_address@@"

  requests:
    type: clickhouse
    inputs: [dedupe]
    endpoint: "@@clickhouse_endpoint@@"
    database: "@@clickhouse_database@@"
    table: requests
    acknowledgements:
      enabled: true
    auth:
      strategy: basic
      # INSERT-only user created by clickhouse/002-users.sh.
      user: gromesh_writer
      password: "SECRET[env.clickhouse_password]"
    skip_unknown_fields: false
    date_time_best_effort: true
    batch:
      max_events: 100
      timeout_secs: 1
    buffer:
      type: memory
      max_events: 10000
      when_full: block
