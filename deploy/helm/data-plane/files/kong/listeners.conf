# Included with KONG_NGINX_HTTP_INCLUDE while admin_listen and status_listen are off (contract: agent-protocol).
# admin_listen refuses unix: addresses, so these servers reuse Kong's own handlers. Only the agent, through the
# shared /kong/admin volume, reaches the Admin and status APIs: no service, route or target can, since neither
# has a TCP listener in the pod.
server {
    charset UTF-8;
    server_name kong_admin;
    listen unix:/kong/admin/admin.sock;
    access_log off;
    client_max_body_size 64m;
    client_body_buffer_size 64m;
    location / {
        default_type application/json;
        content_by_lua_block { Kong.admin_content() }
        header_filter_by_lua_block { Kong.admin_header_filter() }
    }
}

server {
    charset UTF-8;
    server_name kong_status;
    listen unix:/kong/admin/status.sock;
    access_log off;
    location / {
        default_type application/json;
        content_by_lua_block { Kong.status_content() }
        header_filter_by_lua_block { Kong.status_header_filter() }
    }
}

# Scrapers and the kubelet. The proxy can reach any address of its own pod, so requests from the pod itself
# (loopback or the pod's own address) are refused.
server {
    charset UTF-8;
    server_name kong_metrics;
    listen 0.0.0.0:8100;
    access_log off;
    deny 127.0.0.0/8;
    deny ::1;
    access_by_lua_block {
        if ngx.var.remote_addr == ngx.var.server_addr then
            return ngx.exit(ngx.HTTP_FORBIDDEN)
        end
    }
    location = /metrics {
        default_type text/plain;
        content_by_lua_block { Kong.status_content() }
        header_filter_by_lua_block { Kong.status_header_filter() }
    }
    location = /status/ready {
        default_type application/json;
        content_by_lua_block { Kong.status_content() }
        header_filter_by_lua_block { Kong.status_header_filter() }
    }
    location / {
        return 404;
    }
}
