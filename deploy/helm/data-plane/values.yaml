# Two pods let voluntary maintenance retain a serving data plane after publication.
replicaCount: 2
# Overrides allow several releases to share a namespace without selector collisions.
nameOverride: ""
fullnameOverride: ""
# Private project images may require credentials in the release namespace.
imagePullSecrets: []

kong:
  image:
    # The project's own build (images/kong, workflow kong-image), pinned by digest; never the upstream image.
    repository: ghcr.io/grometis/gromesh-kong
    tag: "3.9.4-5cd683f5e6c4d19d1dc3706eb375df571846125d"
    digest: "sha256:ffe28812ade7f8aaec8ff1303b5c5f2e614453b87e1b3bd917401f6ad8b74faf"
    pullPolicy: IfNotPresent
  # UID 1001 can read the packaged runtime; all runtime writes go to volumes.
  runAsUser: 1001
  # Two workers match compose without sizing workers from the host CPU count.
  workerProcesses: 2
  # Cold NXDOMAIN, 5s polls: 80.6s baseline -> 10.3s (3.9.3/3.9.4); recover within the 60s log queue.
  dns:
    notFoundTtl: 1
    errorTtl: 1
    # Retain stale positive answers during DNS outages; do not shorten upstream availability.
    staleTtl: 3600
  # Prefix (/kong_prefix: nginx files, sockets, certificates, LMDB) and /tmp
  # each have an emptyDir so the image root filesystem can remain read-only.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

agent:
  image:
    # Published by the images workflow and pinned by digest through image-digests (scripts/bump-image-digests.mjs).
    repository: ghcr.io/grometis/gromesh-agent
    tag: "584a6428a827dcf790df73314650995edb79e768"
    digest: "sha256:f13a82e3ab5cd8e4b0c67b08de38fe677d7deb236739df859451c988013ec4af"
    pullPolicy: IfNotPresent
  # The agent appends /agent/v1/... itself. Use the control plane origin/base URL,
  # e.g. http://control-plane:3000, WITHOUT /api/v1 or /agent/v1.
  controlPlaneUrl: http://control-plane:3000
  # Prefer an existing Secret in this namespace. Never commit a real token here;
  # token is an alternative for injection via a private values file or --set-file.
  # Missing both sources fails rendering; existingSecret takes precedence.
  # Secret rotation requires restarting pods: environment variables are read once.
  token: ""
  existingSecret: ""
  existingSecretKey: registration-token
  # The node token is ONLY in memory: the agent re-registers on every process
  # restart. Keep the registration Secret valid; no PVC can persist that token.
  # GROMESH_NODE_ID comes from metadata.name so replicas register independently.
  # /kong/declarative is an emptyDir: snapshots survive container restarts, not
  # pod replacement. The agent stages metadata/config then atomically renames.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# The init uses the Kong image's shell, avoiding an additional image dependency.
# fsGroup 1001 grants it and the agent write access without a root chown step.
initResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

service:
  # ClusterIP avoids provisioning an external balancer during local acceptance.
  # Both types expose only 8000/8443; admin and status are never Service ports.
  type: ClusterIP
  annotations: {}
  # Local preserves client addresses with LoadBalancer; use Cluster if required
  # by the provider's health checks or topology. Ignored for ClusterIP.
  externalTrafficPolicy: Local
  # Limit public balancer clients when the cloud provider supports source ranges.
  loadBalancerSourceRanges: []

collector:
  # The cluster's own Vector: receives Kong's http-log at http://gromesh-collector:8080/kong (the fixed name the
  # control plane's PLATFORM_HTTP_LOG_ENDPOINT points at), strips credentials and writes gromesh.requests in
  # ClickHouse tagged with this cluster's id. Off: point httpLogEndpoint at an external collector instead.
  enabled: false
  # Only needed when enabled is false and an external collector serves the fixed name; informs NetworkPolicy.
  httpLogEndpoint: ""
  # UUID of this cluster in the control plane (POST /environments/{envId}/clusters). Required when enabled:
  # the collector refuses to start without it, and every row it writes carries it.
  clusterId: ""
  image:
    repository: timberio/vector
    tag: "0.57.0-alpine"
    # Pinned by digest; bump by hand with `docker buildx imagetools inspect timberio/vector:<tag>`.
    digest: "sha256:19e3526faf4d4b1ed0c28a0d68d4cc3a1e13e437099986a5b7a768707907497c"
    pullPolicy: IfNotPresent
  # Optional non-secret fallback/union with each http-log event's key_names. Vector always strips apikey.
  keyNames: []
  clickhouse:
    # External schema is operator-managed (this chart bundles no ClickHouse). A mandatory pre-install/upgrade
    # hook refuses rollout until 001-requests.sql and 002-retention.sql have been applied, using only writer metadata.
    endpoint: http://clickhouse.observability.svc.cluster.local:8123
    database: gromesh
    # Secret holding the INSERT-only user's password (gromesh_writer); required when enabled.
    existingSecret: ""
    existingSecretKey: writer-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

metrics:
  # Adds pod scrape annotations for gateway :8100/metrics and collector :9598/metrics.
  # Publish the platform prometheus plugin through the control plane/compiler; annotations cannot enable it.
  # The agent separately serves :9100/metrics, with no health endpoint, so there
  # is no agent liveness probe that could mistake a metrics response for health.
  enabled: false
  # Match the scrape jobs for this gateway and collector; keep unrelated installations out of the alert.
  gatewayJob: gateway
  collectorJob: collector
  prometheusRule:
    # Requires the Prometheus Operator CRD. The rules ConfigMap is always available.
    enabled: false
    labels: {}
  # NetworkPolicy intentionally permits proxy ingress ONLY. When enabled, an
  # operator-managed policy must allow trusted scrapers to :8100 and collector :9598
  # (and optionally agent :9100). Kubelet probes and same-pod loopback do not need these ingress rules.

# CPU requests above provide the denominator for the HPA's pod utilization.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  # Render only when the effective minimum replicas (HPA min or replicaCount)
  # exceeds one, so a single-pod development release can still be drained.
  enabled: true
  minAvailable: 1

networkPolicy:
  # Requires a CNI that enforces NetworkPolicy. Empty destination lists deny
  # traffic, never mean allow-all. Explicitly choose peers for CP and collector.
  enabled: false
  # Empty proxy peers allow clients from any source, but only on 8000/8443.
  # Use NetworkPolicyPeer objects (ipBlock or namespaceSelector + podSelector).
  proxyPeers: []
  controlPlanePeers: []
  collectorPeers: []
  # Each upstream needs an explicit CIDR and TCP ports (Service DNAT behavior
  # depends on the CNI; allow backend pod CIDRs when it evaluates post-DNAT).
  upstreams: []
  # - cidr: 10.42.0.0/16
  #   ports: [80, 443]
  # Select the cluster's DNS pods; override for NodeLocal DNS with an ipBlock.
  # Restricting both UDP/TCP 53 avoids opening arbitrary kube-system egress.
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
