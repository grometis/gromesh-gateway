# Gromesh Gateway — local development stack.
# Week 1 adds `control-plane` and `ui`; week 2 adds `agent` (sidecar sharing the kong-config volume).
name: gromesh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gromesh
      POSTGRES_PASSWORD: gromesh
      POSTGRES_DB: gromesh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gromesh -d gromesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kong OSS data plane in DB-less mode. Swap the image for the in-house 3.9.4 build (images/kong) when ready.
  kong:
    image: ${KONG_IMAGE:-kong:3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      # Exposed on the compose network only for week 1 (control plane pushes directly).
      # From week 2 the agent runs as a sidecar and this goes back to 127.0.0.1:8001.
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled
      KONG_NGINX_WORKER_PROCESSES: "2"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8100:8100"
    volumes:
      - ./kong:/kong/declarative:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sample upstream used by fixtures and e2e tests (service host "echo", port 80).
  echo:
    image: traefik/whoami:v1.10.3
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pg-data:
