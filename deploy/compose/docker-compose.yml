# Gromesh Gateway — local development stack.
# Every password and key in this file is a local-development placeholder (names say "dev"): never reuse one
# anywhere else. The Helm charts ship no credentials; production secrets come from existing Kubernetes Secrets.
# The agent shares the data plane network namespace and persistent boot configuration.
name: gromesh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gromesh
      POSTGRES_PASSWORD: gromesh
      POSTGRES_DB: gromesh
    ports:
      # Override when the host already runs Postgres on 5432 (then set TEST_DATABASE_URL to match).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gromesh -d gromesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-time volume ownership and empty boot config. Never overwrite the last good snapshot.
  kong-config-init:
    image: ${KONG_IMAGE:-ghcr.io/grometis/gromesh-kong@sha256:ffe28812ade7f8aaec8ff1303b5c5f2e614453b87e1b3bd917401f6ad8b74faf}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown 1001:1001 /kong/declarative /kong/admin
        chmod 755 /kong/declarative
        chmod 750 /kong/admin
        if [ ! -e /kong/declarative/kong.json ]; then
          cp /seed/kong.yml /kong/declarative/kong.json
          chown 1001:1001 /kong/declarative/kong.json
          chmod 644 /kong/declarative/kong.json
        fi
    volumes:
      - kong-config:/kong/declarative
      - kong-admin:/kong/admin
      - ./kong:/seed:ro

  # Kong OSS data plane in DB-less mode. Swap the image for the in-house 3.9.4 build (images/kong) when ready.
  kong:
    image: ${KONG_IMAGE:-ghcr.io/grometis/gromesh-kong@sha256:ffe28812ade7f8aaec8ff1303b5c5f2e614453b87e1b3bd917401f6ad8b74faf}
    # Same listeners as the data-plane chart: Admin/status APIs only on Unix sockets in the kong-admin volume,
    # TCP 8100 only /metrics and /status/ready from outside the container (contract: agent-protocol).
    entrypoint: [/bin/sh, -ec]
    command:
      - rm -f /kong/admin/admin.sock /kong/admin/status.sock && exec /usr/local/bin/gromesh-entrypoint kong docker-start
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.json
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "off"
      KONG_NGINX_HTTP_INCLUDE: /etc/gromesh/kong/listeners.conf
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # The platform http-log resolves {vault://env/gromesh-collector-token}; workers see only `env` variables.
      GROMESH_COLLECTOR_TOKEN: ${GROMESH_COLLECTOR_TOKEN:-gromesh-dev-collector-token-not-a-secret}
      KONG_NGINX_MAIN_ENV: GROMESH_COLLECTOR_TOKEN
      KONG_PLUGINS: bundled
      KONG_NGINX_WORKER_PROCESSES: "2"
      # Cold NXDOMAIN, 5s polls: 80.6s baseline -> 10.3s (3.9.3/3.9.4); recover within the 60s log queue.
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_ERROR_TTL: "1"
      KONG_DNS_STALE_TTL: "3600"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8100:8100"
    # The admin-isolation e2e: a name that resolves to the gateway's own loopback.
    extra_hosts:
      - "loopback-alias.test:127.0.0.1"
    volumes:
      - kong-config:/kong/declarative:ro
      - kong-admin:/kong/admin
      - ../helm/data-plane/files/kong/listeners.conf:/etc/gromesh/kong/listeners.conf:ro
    depends_on:
      kong-config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # No proxy listener or proxy traffic: plugin validation only.
  kong-validator:
    image: ${KONG_IMAGE:-ghcr.io/grometis/gromesh-kong@sha256:ffe28812ade7f8aaec8ff1303b5c5f2e614453b87e1b3bd917401f6ad8b74faf}
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: "off"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_NGINX_WORKER_PROCESSES: "1"
    ports:
      - "127.0.0.1:8011:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Started per cluster with its registration token (see the control-plane e2e):
  # GROMESH_REGISTRATION_TOKEN=… docker compose up -d agent
  agent:
    profiles: [agent]
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    network_mode: "service:kong"
    environment:
      GROMESH_CP_URL: http://control-plane:3000
      GROMESH_REGISTRATION_TOKEN: ${GROMESH_REGISTRATION_TOKEN:-}
      GROMESH_NODE_ID: ${GROMESH_NODE_ID:-compose-node}
      GROMESH_STATE_DIR: /var/lib/gromesh
      KONG_ADMIN_URL: unix:///kong/admin/admin.sock
      KONG_STATUS_URL: unix:///kong/admin/status.sock
      SNAPSHOT_PATH: /kong/declarative/kong.json
    volumes:
      - kong-config:/kong/declarative
      - kong-admin:/kong/admin
      - agent-state:/var/lib/gromesh
    read_only: true
    depends_on:
      kong:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # `pnpm smoke`: the contract example against the real Kong, from inside its network namespace
  # (the data-plane Admin API only listens on a Unix socket in the kong-admin volume).
  smoke:
    profiles: [tools]
    image: node:24-alpine
    network_mode: "service:kong"
    user: "1001:1001"
    volumes:
      - kong-admin:/kong/admin
      - ../../scripts:/repo/scripts:ro
      - ../../contracts:/repo/contracts:ro
    command: ["node", "/repo/scripts/smoke.mjs"]
    depends_on:
      kong:
        condition: service_healthy

  control-plane:
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    environment:
      DATABASE_URL: postgres://gromesh:gromesh@postgres:5432/gromesh
      MIGRATE_ON_START: "true"
      # First admin of this development stack; the cookie is not Secure because the stack has no TLS.
      BOOTSTRAP_ADMIN_EMAIL: admin@gromesh.dev
      BOOTSTRAP_ADMIN_PASSWORD: gromesh-dev-admin
      COOKIE_SECURE: "false"
      # The UI's nginx proxies /api/v1 from the compose network: take the client address from X-Forwarded-For.
      TRUST_PROXY: uniquelocal
      # Plugin configs are validated by Kong itself (POST /schemas/plugins/validate).
      KONG_VALIDATOR_URL: http://kong-validator:8001
      # Analytics read the `observability` profile's ClickHouse with the SELECT-only user; 502 while it is down.
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: gromesh_reader
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-gromesh-dev-reader}
      CLICKHOUSE_DATABASE: gromesh
      # Development-only key for secrets at rest (`<keyId>:<base64 of 32 bytes>`); never reuse outside this stack.
      GROMESH_ENCRYPTION_KEY: ${GROMESH_ENCRYPTION_KEY:-dev:ZGV2LW9ubHktZ3JvbWVzaC1lbmNyeXB0aW9uLWtleS0=}
      # Development-only HMAC key for credential fingerprints (base64 of 32 bytes), separate from the cipher key.
      GROMESH_FINGERPRINT_KEY: ${GROMESH_FINGERPRINT_KEY:-ZGV2LW9ubHktZ3JvbWVzaC1maW5nZXJwcmludC1rZXk=}
      # Injects the prometheus and http-log platform plugins into every publication (empty = none).
      PLATFORM_HTTP_LOG_ENDPOINT: http://gromesh-collector:8080/kong
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kong-validator:
        condition: service_healthy

  ui:
    build:
      context: ../..
      dockerfile: apps/ui/Dockerfile
    ports:
      # Separate from Vite/Prism acceptance, which uses 5173 on the host.
      - "127.0.0.1:${UI_PORT:-5174}:8080"
    depends_on:
      control-plane:
        condition: service_healthy

  # Sample upstream used by fixtures and e2e tests (service host "echo", port 80).
  echo:
    image: traefik/whoami:v1.10.3
    ports:
      - "127.0.0.1:8080:80"

  # A second upstream backend for the load-balancing acceptance: whoami answers with its own Hostname.
  echo-2:
    image: traefik/whoami:v1.10.3

  clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    environment:
      CLICKHOUSE_DB: gromesh
      CLICKHOUSE_USER: gromesh
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-gromesh-dev-observability}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../observability/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the INSERT-only (Vector) and SELECT-only (control plane) users; idempotent, runs before Vector.
  clickhouse-init:
    profiles: [observability]
    image: clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    entrypoint: ["sh", "/init/users.sh"]
    environment:
      CLICKHOUSE_USER: gromesh
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-gromesh-dev-observability}
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:-gromesh-dev-writer}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-gromesh-dev-reader}
    volumes:
      - ../observability/clickhouse-init:/init:ro
      - ../observability/clickhouse:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # Reached by Kong as http://gromesh-collector:8080/kong (compose network only).
  vector:
    profiles: [observability]
    image: timberio/vector:0.57.0-alpine@sha256:19e3526faf4d4b1ed0c28a0d68d4cc3a1e13e437099986a5b7a768707907497c
    user: "65534:65534"
    # entrypoint.sh refuses to start without a UUID in GROMESH_CLUSTER_ID: every row is tagged with it.
    entrypoint: ["sh", "/etc/vector/entrypoint.sh"]
    networks:
      default:
        # The name the compiled http-log plugin targets; the same name resolves to each cluster's own collector.
        aliases: [gromesh-collector]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:-gromesh-dev-writer}
      # The e2e recreates this service with the real cluster id; the default marks "development, no cluster".
      GROMESH_CLUSTER_ID: ${GROMESH_CLUSTER_ID:-00000000-0000-4000-8000-00000000c0c0}
      # "any" (explicit opt-out) because the e2e scripts create environments on the fly; the chart requires a UUID.
      GROMESH_ENVIRONMENT_ID: ${GROMESH_ENVIRONMENT_ID:-any}
      # Development-only; the gateway sends the same value (contract: Platform analytics).
      GROMESH_COLLECTOR_TOKEN: ${GROMESH_COLLECTOR_TOKEN:-gromesh-dev-collector-token-not-a-secret}
      # Optional non-secret JSON array, unioned with each event's key_names. Vector always strips apikey.
      GROMESH_KEY_NAMES: ${GROMESH_KEY_NAMES:-[]}
      VECTOR_LOG: info
    volumes:
      - ../observability/vector:/etc/vector:ro
    tmpfs:
      - /var/lib/vector:uid=65534,gid=65534,mode=0700
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"X-Gromesh-Collector-Token: $$GROMESH_COLLECTOR_TOKEN\" --post-data='[]' http://127.0.0.1:8080/kong"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/collector.rules.yml:/etc/prometheus/collector.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # From the repo root (Node >= 24, builds the compiler and checks Vector logs):
  # POSTGRES_PORT=55433 node deploy/observability/acceptance.mjs
  observability-acceptance:
    # Own profile: with only `tools` active (pnpm smoke) its dependency on vector would make the project invalid.
    profiles: [observability-tools]
    image: node:24.18.0-alpine
    network_mode: "service:kong"
    user: "1001:1001"
    volumes:
      - kong-admin:/kong/admin
      - ../observability:/repo/deploy/observability:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-gromesh-dev-observability}
      GROMESH_COLLECTOR_TOKEN: ${GROMESH_COLLECTOR_TOKEN:-gromesh-dev-collector-token-not-a-secret}
    command: ["node", "/repo/deploy/observability/acceptance.mjs", "--inside"]
    depends_on:
      kong:
        condition: service_healthy
      echo:
        condition: service_started
      vector:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  pg-data:
  kong-config:
  kong-admin:
  agent-state:
  clickhouse-data:
  prometheus-data:
