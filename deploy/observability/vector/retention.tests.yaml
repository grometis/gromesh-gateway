tests:
  - name: retention-missing
    inputs:
      - insert_at: decode
        type: log
        log_fields:
          message: "{\"environment_id\": \"00000000-0000-4000-8000-000000000001\", \"started_at\": 1792100000123, \"request\": {\"uri\": \"/sensitive?secret=discarded\", \"method\": \"GET\", \"size\": 100}, \"response\": {\"status\": 200, \"size\": 200}, \"client_ip\": \"127.0.0.1\", \"latencies\": {\"kong\": 1, \"proxy\": 2, \"request\": 3}}"
    outputs:
      - extract_from: sanitize
        conditions:
          - type: vrl
            source: |
              assert!(.retention_days == 7, "Retention must be an integer in 1..7, otherwise 7")
              assert!(is_integer(.retention_days))
              assert!(.path == "/sensitive")
              assert!(!exists(.request) && !exists(.response))
